<!doctype html>
<!--
  mock: NIHO editor「書く・考えをまとめる」を支援する案の比較（PC。v1 のリファイン画面がベース）
  色と文字: このモックは単体で開けるよう、色を :root の仮値（hex）で持つ。実装（docs-ui / editor-web）では packages/ui/src/styles/tokens.css の token を引き、生の hex は足さない。文字は 12px 以上にそろえてある。
  mock: NIHO editor「書く・考えをまとめる」を支援する案の比較（PC。v1 のリファイン画面がベース）
  論点（上の帯の「案」を ON/OFF して比べる）:
    参照   … 右パネルを「AI／参照」のタブにし、自分の別ページ・Web 記事の読みやすいコピー・録音の文字起こしを右に置く。
             一覧の行を Shift+クリック（または行の ⋯ › 右に開く）で開く。右で文字を選ぶと「引用して挿入」が出て、左に引用＋出典が入る。
             仕切りをドラッグで幅を変え、ダブルクリックで戻す。右は 1 枚＋タブ（多段 split にしない）。
    AI    … 書式の帯の「AI ▾」から、選んだ段落について「構造」「反論」「不明な点」「続きを聞く」。結果は本文に書かず右の AI タブに
             コメントとして並び、採用／却下／？（理由）。採用で入った文は灰色（AI 由来）で、書き直した分だけ黒に戻る。
             AI が本文に入れる前に版を切り、ヘッダーの「版」から戻せる。打つ手が止まると、本文由来の問いを 1 つだけ末尾に出す。
    目次   … 見出しが 2 つ以上あると、本文の右端に細い目次。ホバーで広がり、見出しをドラッグすると本文の章が入れ替わる。
    集中   … ヘッダーの ◎（⌘D）で、カーソルのある段落以外を薄くし、その段落を画面の縦中央に保つ。
    今日   … 一覧の先頭に「今日」のページ、その下に「1 年前の今日」と今週の 7 つの点（週単位。連続日数は出さない）。
             一覧の下の「今週の振り返り」は AI が作った下書きで、「記事にする」で普通のページに昇格する。
  作っていない:
    - 上の黒い帯は mock 用。保存・公開・AI の送信・検索は動かない（見た目だけ）。
    - 参照の Web 記事は、どの URL を入れても同じ合成の記事（example.jp）を出す。実際の取得・本文抽出はしない。
    - AI のコメント・続き・問い・振り返りの下書きは固定の合成文。モデルは呼ばない。
    - 目次のドラッグは h2 の章だけ（h3 は章に付いて動く）。集中モードの縦中央は本文が短いと効かない。
    - 書式の帯は B・I・S・コード・リンク・H・箇条書き（v1 と同じ）＋ AI。表・チェックリストは入れない。
    - 320px は崩れない程度（一覧と右は重なる）。比較は PC 幅を想定。
  参照: idea/active/2026-11-05-writing-support-ideas.md（出典つきの調査）/ docs/mockups/editor-ui-refine-v1.html（ベース）/
        docs/architecture/editor-niho-life-design.md §5 §6
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NIHO editor 書く支援の案 v1</title>
<style>
:root{
  --ink:#2a2a26;--ink2:#54544d;--mute:#6e6d66;--faint:#898880;
  --white:#fff;--canvas:#fffdfa;--shell:#fcfaf5;--sand:#f7f7f4;--sand2:#f5f3ee;
  --line:#f1f1ed;--line2:#e7e7e2;--line3:#dbdbd5;--track:#f2efe8;
  --moss:#56751e;--pale:#EEF6E1;--leaf:#B2D67C;--deep:#63A109;
  --grad:linear-gradient(140deg,#7DBA3A 0%,#63A109 100%);--grad-h:linear-gradient(140deg,#74B033 0%,#5C9508 100%);
  --amber:#C8713A;--amber-ink:#a55827;--amber-pale:#FAF0E6;--blue:#1E4EA8;--blue-pale:#EAF2FF;--red:#B42318;
  --sans:"Hiragino Maru Gothic ProN","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
  --sbw:244px;--aiw:360px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.6 var(--sans);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
b,strong{font-weight:600}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px;border-radius:6px}
[contenteditable]:focus{outline:none}
[hidden]{display:none!important}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
kbd{font:12px var(--mono);color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 14px;border-radius:999px;background:var(--grad);color:#fff;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--grad-h)}
.btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line3)}
.btn.line:hover{background:var(--sand)}
.btn.quiet{background:none;color:var(--ink2)}
.btn.quiet:hover{background:var(--sand)}
.btn.sm{height:28px;padding:0 11px;font-size:12.5px}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none;position:relative}
.ib:hover,.ib.on{background:var(--sand2);color:var(--ink)}
.ib[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30}
.ib[data-tip]:hover::after{opacity:1}
.menu{position:absolute;z-index:40;min-width:200px;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 36px rgba(28,28,26,.12);padding:6px;display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:13.5px;color:var(--ink)}
.menu button:hover{background:var(--sand)}
.menu button .ico{width:16px;height:16px;color:var(--ink2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* mock bar */
.mock{position:sticky;top:0;z-index:100;overflow:hidden;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;background:#141413;color:#fff;font-size:12.5px}
.mock .url{flex:1;min-width:0;background:rgba(255,255,255,.08);border-radius:8px;padding:4px 10px;font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mock .url b{color:#fff;font-weight:600}
.variant-switch{display:flex;align-items:center;gap:6px}
.variant-switch span{color:rgba(255,255,255,.5);margin-left:4px}
.variant-switch button{height:24px;padding:0 10px;border-radius:999px;color:rgba(255,255,255,.75);font-weight:600;font-size:12px;border:1px solid rgba(255,255,255,.18);white-space:nowrap;flex:none}
.variant-switch button.on{background:#fff;color:#141413;border-color:#fff}
.variant-switch button.all{border-style:dashed}

/* shell */
.ws{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:calc(100vh - 40px)}
.sb{position:sticky;top:40px;height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--shell);border-right:1px solid var(--line)}
.sb-top{display:flex;align-items:center;gap:6px;padding:10px 10px 2px 14px}
.sb-top .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;flex:1;min-width:0}
.sb-top .brand i{width:20px;height:20px;border-radius:6px;background:var(--grad);flex:none}
.sb-act{padding:4px 8px 2px}
.sb-act button{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.sb-act button:hover{background:var(--sand2);color:var(--ink)}
.sb-act button .ico{width:16px;height:16px;color:var(--faint)}
.sb-act button kbd{margin-left:auto}
.sb-list{flex:1;overflow:auto;padding:6px 8px 10px}
.row{position:relative;display:flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 calc(8px + var(--d,0) * 18px);border-radius:8px;cursor:pointer;user-select:none}
.row:hover{background:var(--sand2)}
.row.on{background:#fff;box-shadow:0 1px 2px rgba(28,28,26,.06),0 0 0 1px var(--line)}
.row .ico.leaf{width:15px;height:15px;color:var(--faint)}
.row b{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-size:12px;color:var(--faint);white-space:nowrap}
.row .mk{width:14px;height:14px;color:var(--mute)}
.row .more{width:22px;height:22px;border-radius:6px;display:none;place-items:center;color:var(--faint)}
.row .more:hover{background:var(--line2);color:var(--ink)}
.row:hover .when{display:none}
.row:hover .more{display:grid}
.row.ref{box-shadow:inset 3px 0 0 var(--leaf)}
.row .menu{left:auto;right:4px;top:30px}
/* 今日・振り返り（案: 今日） */
.today{display:none;margin:4px 0 2px}
body.v-daily .today{display:block}
.today .row b{font-weight:600}
.today .row .tag{font-size:12px;color:var(--moss);background:var(--pale);border-radius:999px;padding:0 7px;font-weight:600}
.otd{display:none;margin:8px 8px 4px;padding:9px 10px;border:1px solid var(--line2);border-radius:10px;background:#fff;cursor:pointer}
body.v-daily .otd{display:block}
.otd:hover{background:var(--sand)}
.otd small{display:block;font-size:12px;color:var(--moss);font-weight:600;letter-spacing:.04em}
.otd b{display:block;font-size:13px;margin-top:2px}
.otd span{display:block;font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week{display:none;align-items:center;gap:6px;margin:6px 16px 8px;font-size:12px;color:var(--faint)}
body.v-daily .week{display:flex}
.week i{width:8px;height:8px;border-radius:50%;background:var(--line3)}
.week i.on{background:var(--moss)}
.week i.today{box-shadow:0 0 0 2px var(--pale)}
.week em{font-style:normal;margin-left:auto}
.sb-review{display:none;border-top:1px solid var(--line);padding:6px 8px 0}
body.v-daily .sb-review{display:block}
.sb-review .row b{font-weight:600}
.sb-review .row .tag{font-size:12px;color:var(--amber-ink);background:var(--amber-pale);border-radius:999px;padding:0 7px;font-weight:600}
.sb-foot{border-top:1px solid var(--line);padding:8px 10px}
.sb-me{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 8px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.sb-me:hover{background:var(--sand2);color:var(--ink)}
.sb-me .av{width:22px;height:22px;border-radius:50%;background:var(--pale);color:var(--moss);display:grid;place-items:center;font-size:12px;font-weight:700}

/* document */
.doc{position:relative;display:flex;flex-direction:column;min-width:0;min-height:calc(100vh - 40px)}
.dt{position:sticky;top:40px;z-index:20;display:flex;align-items:center;gap:4px;height:46px;padding:0 10px 0 8px;background:var(--canvas)}
.dt .crumb{font-size:13px;color:var(--mute);max-width:30vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:4px}
.dt .ins{display:flex;align-items:center;gap:2px;margin-left:8px;padding-left:10px;border-left:1px solid var(--line2)}
.dt .ins .ib{color:var(--faint)}
.dt .ins .ib:hover{color:var(--ink)}
.pubbtn{height:30px;padding:0 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.pubbtn:hover{background:var(--sand)}
#focusbtn{display:none}
body.v-focus #focusbtn{display:grid}
.ver{display:none;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--amber-ink);background:var(--amber-pale);white-space:nowrap}
.ver.on{display:inline-flex}
.ver .menu{right:0;left:auto;top:32px;min-width:230px}

.dbody{display:grid;grid-template-columns:minmax(0,1fr) 0;flex:1;position:relative}
.dbody.open{grid-template-columns:minmax(0,1fr) var(--aiw)}
.canvas{padding:52px 56px 160px;min-width:0;position:relative}
.canvas .in{max-width:680px;margin:auto;position:relative}
.tt{font-weight:600;font-size:34px;line-height:1.25;letter-spacing:-.01em;min-height:1.25em}
.badge{display:none;font-size:12px;font-weight:600;color:var(--amber-ink);background:var(--amber-pale);border-radius:999px;padding:1px 9px;vertical-align:middle;margin-left:8px}
.bd{font-size:16px;line-height:1.95;margin-top:14px;min-height:40vh}
.bd>*{transition:opacity .2s}
.bd p{margin:0 0 .35em}
.bd h2{font-size:22px;font-weight:600;line-height:1.4;margin:1.2em 0 .3em}
.bd h3{font-size:18px;font-weight:600;margin:1em 0 .2em}
.bd ul{list-style:disc;padding-left:22px}
.bd li{margin:.15em 0}
.bd code{font:13.5px var(--mono);background:var(--sand);border-radius:5px;padding:1px 5px;color:var(--ink2)}
.bd a{color:var(--moss);text-decoration:underline;text-underline-offset:3px}
.bd blockquote{border-left:3px solid var(--leaf);padding:2px 0 2px 14px;margin:.6em 0;color:var(--ink2)}
.bd blockquote cite{display:block;font-style:normal;font-size:12.5px;color:var(--mute);margin-top:4px}
.bd blockquote cite a{color:var(--mute)}
.bd .ai{color:var(--mute)}
.bd .anchored{background:var(--pale);box-shadow:0 0 0 6px var(--pale);border-radius:4px}
.bd .q{color:var(--amber-ink)}
.ph:empty::before,.ph.blank::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
body.focus .bd>*{opacity:.3}
body.focus .bd>.cur{opacity:1}
body.focus .tt{opacity:.3}
.bd::selection,.bd *::selection{background:#dce9f7}
/* 問い（案: AI） */
.deeper{display:none;align-items:flex-start;gap:10px;margin:28px 0 0;padding:10px 12px;border-radius:10px;background:var(--sand);color:var(--ink2);font-size:14px}
.deeper.on{display:flex}
.deeper .ico{color:var(--moss);margin-top:3px}
.deeper button{font-weight:600;color:var(--moss);padding:2px 8px;border-radius:6px}
.deeper button:hover{background:var(--pale)}
.deeper .x{color:var(--faint)}
/* 記事にする（振り返り） */
.promote{display:none;margin-top:14px}
.promote.on{display:flex;gap:8px;align-items:center}

/* 文字数 */
.count{position:fixed;right:18px;bottom:14px;z-index:15;font-size:12px;color:var(--faint);padding:4px 9px;border-radius:999px;background:var(--canvas)}
.dbody.open .count{right:calc(var(--aiw) + 18px)}

/* 目次（案: 目次） */
.toc{display:none;position:fixed;right:calc(var(--aiw) + 18px);top:120px;z-index:14;max-width:260px}
body.v-toc .dbody.open .toc.has{display:block}
body.v-toc .dbody:not(.open) .toc.has{display:block;right:18px}
.toc .bars{display:flex;flex-direction:column;gap:7px;align-items:flex-end;padding:6px}
.toc .bars i{display:block;height:2px;border-radius:2px;background:var(--line3)}
.toc .bars i.l2{width:22px}.toc .bars i.l3{width:14px}
.toc .list{display:none;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 36px rgba(28,28,26,.12);padding:8px}
.toc:hover .bars,.toc.drag .bars{display:none}
.toc:hover .list,.toc.drag .list{display:block}
.toc .list a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--ink2);cursor:grab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc .list a.l3{padding-left:24px;font-size:12.5px;color:var(--mute)}
.toc .list a:hover{background:var(--sand);color:var(--ink)}
.toc .list a.dragging{opacity:.4}
.toc .list a.over{box-shadow:0 -2px 0 var(--deep)}

/* 書式の帯 */
.selbar{position:absolute;z-index:30;display:none;align-items:center;gap:1px;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(28,28,26,.12);padding:3px}
.selbar.open{display:flex}
.selbar button{height:28px;min-width:28px;padding:0 8px;border-radius:7px;color:var(--ink2);font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:4px;position:relative}
.selbar button:hover{background:var(--sand);color:var(--ink)}
.selbar .sep{width:1px;height:16px;background:var(--line2);margin:0 3px}
.selbar .ico{width:15px;height:15px}
.selbar .aiwrap{position:relative;display:none}
body.v-ai .selbar .aiwrap{display:inline-flex}
.selbar .aibtn{color:var(--moss)}
.selbar .menu{left:0;top:34px;min-width:170px}
.quotebtn{position:absolute;z-index:30;display:none;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--grad);color:#fff;font-weight:600;font-size:12.5px;box-shadow:0 8px 24px rgba(28,28,26,.18)}
.quotebtn.open{display:inline-flex}
.quotebtn .ico{width:14px;height:14px;stroke-width:2.2}

/* 右パネル */
.ai{position:sticky;top:86px;align-self:start;height:calc(100vh - 86px);border-left:1px solid var(--line);background:var(--canvas);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.divider{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5}
.divider:hover,.divider.on{background:linear-gradient(90deg,transparent 3px,var(--line3) 3px,var(--line3) 5px,transparent 5px)}
.ai .hd{display:flex;align-items:center;gap:2px;height:40px;padding:0 8px 0 12px;flex:none}
.tabs{display:flex;gap:2px;background:var(--track);border-radius:999px;padding:3px}
.tabs button{height:24px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:#63605a}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(28,28,26,.07)}
.tabs button:not(.on):hover{color:var(--ink)}
#tab-ref{display:none}
body.v-ref #tab-ref{display:inline-block}
.pane{display:none;flex:1;min-height:0;flex-direction:column}
.pane.on{display:flex}
.thread{flex:1;overflow:auto;padding:4px 14px;display:flex;flex-direction:column;gap:10px}
.composer{padding:10px 12px 12px;flex:none}
.composer .box{border:1px solid var(--line2);border-radius:14px;background:#fff;padding:9px 10px 7px}
.composer .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--pale);color:var(--moss);font-size:12px;font-weight:600}
.chip .x{color:var(--moss);opacity:.7;font-size:14px}
.composer textarea{width:100%;border:0;outline:none;resize:none;font-size:13.5px;line-height:1.6;min-height:48px;background:none;padding:0 2px;display:block}
.composer textarea::placeholder{color:var(--faint)}
.composer .foot{display:flex;align-items:center;gap:4px;margin-top:4px}
.composer .foot .ib{width:28px;height:28px;color:var(--faint)}
.model{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;color:var(--mute)}
.send{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin-left:auto}
.send .ico{width:15px;height:15px;stroke-width:2.2}
/* AI コメント（案: AI） */
.cmt{border:1px solid var(--line2);border-radius:12px;background:#fff;padding:10px 12px;font-size:13px;line-height:1.65;cursor:default}
.cmt:hover{border-color:var(--leaf)}
.cmt .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--moss);margin-bottom:4px}
.cmt .k .ico{width:13px;height:13px}
.cmt .k em{font-style:normal;color:var(--faint);font-weight:500;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.cmt .why{display:none;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--sand);color:var(--ink2);font-size:12.5px}
.cmt.why .why{display:block}
.cmt .acts{display:flex;gap:4px;margin-top:8px}
.cmt .acts button{height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink2);border:1px solid var(--line2)}
.cmt .acts button.ok{background:var(--grad);color:#fff;border-color:transparent}
.cmt .acts button.q{width:26px;padding:0}
.cmt.done{opacity:.55}
.cmt.done .acts{display:none}
/* 参照パネル */
.reftabs{display:flex;gap:2px;padding:4px 10px 0;overflow:auto;scrollbar-width:none;flex:none}
.reftabs button{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px 8px 0 0;font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap;max-width:160px}
.reftabs button span{overflow:hidden;text-overflow:ellipsis}
.reftabs button.on{color:var(--ink);background:#fff;box-shadow:inset 0 -2px 0 var(--leaf)}
.reftabs button .x{color:var(--faint);font-size:14px}
.reftabs .ico{width:13px;height:13px;flex:none}
.refurl{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.refurl input{flex:1;min-width:0;height:30px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;font-size:13px;background:#fff;outline:none}
.refurl input:focus{border-color:var(--ink2)}
.refbody{flex:1;overflow:auto;padding:14px 18px 40px;font-size:14.5px;line-height:1.85;color:var(--ink2);position:relative}
.refbody h1{font-size:19px;font-weight:600;color:var(--ink);line-height:1.35;margin-bottom:4px}
.refbody .src{font-size:12px;color:var(--mute);margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.refbody .src a{color:var(--mute)}
.refbody p{margin:0 0 .6em}
.refbody h2{font-size:15.5px;font-weight:600;color:var(--ink);margin:1em 0 .3em}
.refbody .seg{display:grid;grid-template-columns:52px minmax(0,1fr);gap:0 10px;padding:6px 0;border-top:1px solid var(--line)}
.refbody .seg:first-of-type{border-top:0}
.refbody .seg time{font:12px var(--mono);color:var(--mute);padding-top:3px}
.refbody .empty{color:var(--faint);text-align:center;padding:40px 10px;font-size:13.5px}
.refbody ::selection{background:#dce9f7}

/* 公開シート・モーダル（最小） */
.veil{position:fixed;inset:0;z-index:90;background:rgba(20,20,18,.3);display:none;place-items:center;padding:20px}
.veil.open{display:grid}
.modal{width:min(100%,460px);background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.22);padding:20px 22px 18px}
.modal h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.modal h2 .ib{margin-left:auto}
.modal .body{margin-top:10px;font-size:13.5px;line-height:1.8;color:var(--ink2);display:grid;gap:8px}

@media (max-width:900px){

  .dbody.open .ai{display:flex}

  .toc,body.v-toc .dbody.open .toc.has,body.v-toc .dbody:not(.open) .toc.has{display:none}
}

<script>
(function(){
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const body=$('#body'), title=$('#title'), dbody=$('#dbody'), ws=$('#ws');

  /* ================= データ（合成） ================= */
  const PAGES={
    walk:{id:'8f2c9a',title:'鎌倉の朝の散歩',html:'<p>朝の散歩は、海まで歩いてから戻る。今日は材木座の方まで足を伸ばした。</p><p>波は静かで、サーファーが三人。帰りに豆腐屋で寄り道した。</p><h2>気づいたこと</h2><p>由比ヶ浜より材木座のほうが風が弱い。砂浜の向きが違うからだと思っていたけれど、海岸林の切れ目の位置も関係しているかもしれない。</p><h3>朝 6 時台の人</h3><p>犬の散歩の人が多い。顔見知りになると、挨拶だけで一日が始まる。</p><h2>次に歩くなら</h2><p>稲村ヶ崎まで足を伸ばして、帰りは江ノ電に乗る。</p>'},
    today:{id:'a1b2c3',title:'11月5日（水）',html:'<p>6 時起き。雲が低い。</p><p>散歩の記事の続きを書く。材木座の風のことをもう少し調べたい。</p>'},
    plan:{id:'c4d5e6',title:'来週の段取り',html:'<p>月曜: 海岸林のメモを整理。</p><p>水曜: 記事を公開。</p>'},
    coast:{id:'d7e8f9',title:'海岸林のメモ',html:'<p>由比ヶ浜から材木座にかけての松は、江戸期の植林が元になっている。</p><p>海岸林の切れ目は滑川の河口と、材木座の東端にある。河口のところは冬の季節風が抜けやすい。</p><p>保安林の指定は昭和の初めで、砂の飛散と潮風を防ぐためのもの。</p>'},
    otd:{id:'e0f1a2',title:'由比ヶ浜の夕方',html:'<p>風が強くて、海は白く泡立っていた。</p><p>砂が飛んで目に入る。こういう日は材木座の方へ逃げると少しましだと、散歩の人に教わった。</p>'},
    rec:{id:'f3a4b5',title:'散歩の録音 11/4',rec:true,segs:[['00:12','今日は材木座まで。風がほとんどない。'],['01:48','由比ヶ浜のほうはいつも風が強い気がする。向きの違いかな。'],['03:05','海岸林が切れているところで、ふっと風が抜ける。あれは滑川の河口。'],['05:30','帰りに豆腐屋。がんもを買った。']]},
    review:{id:'rev-45',title:'今週の振り返り',draft:true,html:'<p>今週は 3 本。散歩の話が 2 本、段取りが 1 本。</p><h2>よく出てきたこと</h2><ul><li>材木座と由比ヶ浜の「風の違い」が 2 回</li><li>海岸林の切れ目（滑川の河口）</li><li>朝 6 時台の犬の散歩の人</li></ul><h2>記事になりそうな種</h2><p>「風の弱い朝の散歩道」として、海岸林のメモと散歩の記事をつなぐと 1 本になる。</p>'},
  };
  const WEB={title:'鎌倉の海岸林と季節風',url:'example.jp/kamakura/coast-forest',html:'<p>由比ヶ浜から材木座にかけての海岸線には、クロマツを主体とした海岸林が帯状に残っている。江戸期の植林を起源とし、昭和初期に保安林に指定された。</p><h2>切れ目と風</h2><p>海岸林は滑川の河口と材木座の東端で途切れており、冬の北西風はこの切れ目から市街地側へ抜ける。河口付近の砂の飛散が多いのはこのためである。</p><p>材木座側は背後の丘が風を遮るため、同じ日でも体感の風は弱い。</p><h2>管理</h2><p>松くい虫の被害で本数は減っており、現在は補植と下草刈りが続けられている。</p>'};
  let current='walk';
  const state={ver:3,comments:[],refs:[],ref:null,deeperN:0};

  /* ================= 案の切替（mock 用） ================= */
  const vbtns=$$('#variants button[data-v]');
  function applyV(){ vbtns.forEach(b=>document.body.classList.toggle('v-'+b.dataset.v,b.classList.contains('on'))); if(!document.body.classList.contains('v-ref')&&$('#tab-ref').classList.contains('on')) showTab('ai'); if(!document.body.classList.contains('v-focus')) setFocus(false); renderToc(); }
  vbtns.forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('on');applyV();}));
  $('#vall').addEventListener('click',()=>{vbtns.forEach(b=>b.classList.add('on'));applyV();});
  $('#vnone').addEventListener('click',()=>{vbtns.forEach(b=>b.classList.remove('on'));applyV();});

  /* ================= ページ ================= */
  function textOf(el){return (el.innerText||'').replace(/\s+/g,'');}
  function refresh(){
    [title,body].forEach(el=>el.classList.toggle('blank',textOf(el).length===0));
    const n=[...textOf(title)+textOf(body)].length;
    $('#count').textContent=n.toLocaleString('ja-JP')+' 字';
    const t=(title.innerText||'').trim(); $('#crumb').textContent=t||'無題';
    const row=$('#list .row.on b, .sb-review .row.on b, .today .row.on b'); if(row && current!=='review') row.textContent=t||'無題';
    renderToc();
  }
  function openPage(id){
    const p=PAGES[id]; if(!p||p.rec) return;
    current=id; title.textContent=p.title; body.innerHTML=p.html;
    $('#url').textContent='/p/'+p.id;
    $$('.row').forEach(r=>r.classList.toggle('on',r.dataset.page===id));
    $('#badge').style.display=p.draft?'inline-block':'none';
    $('#promote').classList.toggle('on',!!p.draft);
    $('#deeper').classList.remove('on');
    refresh();
  }
  $$('.row[data-page]').forEach(r=>r.addEventListener('click',e=>{
    if(e.target.closest('.more')) return;
    const id=r.dataset.page;
    if(e.shiftKey && document.body.classList.contains('v-ref')){ openRef(PAGES[id].rec?'rec':'page',id); return; }
    if(PAGES[id].rec){ openRef('rec',id); return; }
    openPage(id);
  }));
  $('.otd').addEventListener('click',()=>openRef('page','otd'));
  /* 行の ⋯ */
  const rowmenu=$('#rowmenu'); let rowFor=null;
  $$('.row .more').forEach(m=>m.addEventListener('click',e=>{e.stopPropagation();const r=m.closest('.row');rowFor=r.dataset.page;const rr=r.getBoundingClientRect(),sb=$('.sb').getBoundingClientRect();rowmenu.style.top=(rr.bottom-sb.top+2)+'px';rowmenu.classList.toggle('open');}));
  rowmenu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;rowmenu.classList.remove('open');if(b.dataset.act==='right')openRef(PAGES[rowFor].rec?'rec':'page',rowFor);else openPage(rowFor);});
  /* 記事にする */
  $('#promote .btn:not(.quiet)').addEventListener('click',()=>{PAGES.review.draft=false;PAGES.review.title='風の弱い朝の散歩道';title.textContent=PAGES.review.title;$('#badge').style.display='none';$('#promote').classList.remove('on');const row=$('.sb-review .row b');row.textContent=PAGES.review.title;$('.sb-review .row .tag').remove();refresh();});
  $('#promote .quiet').addEventListener('click',()=>$('#promote').classList.remove('on'));

  /* ================= 右パネル・タブ ================= */
  function showTab(t){ $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t)); $('#pane-ai').classList.toggle('on',t==='ai'); $('#pane-ref').classList.toggle('on',t==='ref'); }
  $$('#tabs button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
  $('#aitoggle').addEventListener('click',()=>{dbody.classList.toggle('open');$('#aitoggle').classList.toggle('on',dbody.classList.contains('open'));});
  $('#aiclose').addEventListener('click',()=>{dbody.classList.remove('open');$('#aitoggle').classList.remove('on');});
  $('#sbclose').addEventListener('click',()=>ws.classList.remove('sbopen'));
  $('#sbopen').addEventListener('click',()=>ws.classList.toggle('sbopen'));
  /* 仕切り */
  const divider=$('#divider'); let dragging=false;
  divider.addEventListener('mousedown',e=>{dragging=true;divider.classList.add('on');e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(!dragging)return;const w=Math.min(560,Math.max(260,window.innerWidth-e.clientX));document.documentElement.style.setProperty('--aiw',w+'px');});
  document.addEventListener('mouseup',()=>{dragging=false;divider.classList.remove('on');});
  divider.addEventListener('dblclick',()=>document.documentElement.style.setProperty('--aiw','360px'));

  /* ================= 参照 ================= */
  function openRef(kind,id){
    if(!document.body.classList.contains('v-ref')){ if(kind==='page') openPage(id); return; }
    const key=kind+':'+id;
    if(!state.refs.find(r=>r.key===key)) state.refs.push({key,kind,id});
    state.ref=key;
    dbody.classList.add('open'); $('#aitoggle').classList.add('on'); showTab('ref'); renderRefs();
    $$('.row').forEach(r=>r.classList.toggle('ref',state.refs.some(x=>x.kind!=='web'&&x.id===r.dataset.page)));
  }
  function closeRef(key){ state.refs=state.refs.filter(r=>r.key!==key); if(state.ref===key) state.ref=state.refs.length?state.refs[state.refs.length-1].key:null; renderRefs(); $$('.row').forEach(r=>r.classList.toggle('ref',state.refs.some(x=>x.kind!=='web'&&x.id===r.dataset.page))); }
  function renderRefs(){
    const tabs=$('#reftabs'); tabs.innerHTML='';
    state.refs.forEach(r=>{
      const b=document.createElement('button'); b.className=r.key===state.ref?'on':'';
      const name=r.kind==='web'?WEB.title:PAGES[r.id].title;
      const ico=r.kind==='web'?'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c3 3 3 13 0 16M12 4c-3 3-3 13 0 16"/></svg>':r.kind==='rec'?'<svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>':'<svg class="ico" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>';
      b.innerHTML=ico+'<span>'+name+'</span><span class="x" aria-label="閉じる">×</span>';
      b.addEventListener('click',e=>{ if(e.target.classList.contains('x')){closeRef(r.key);return;} state.ref=r.key; renderRefs(); });
      tabs.appendChild(b);
    });
    const rb=$('#refbody');
    const r=state.refs.find(x=>x.key===state.ref);
    if(!r){ rb.innerHTML='<div class="empty">一覧の行を Shift+クリック、または URL を入れる</div>'; return; }
    if(r.kind==='web'){ rb.innerHTML='<h1>'+WEB.title+'</h1><div class="src"><a href="#">'+WEB.url+'</a><span>·</span><span>読みやすい形で保存</span></div>'+WEB.html; }
    else if(r.kind==='rec'){ const p=PAGES[r.id]; rb.innerHTML='<h1>'+p.title+'</h1><div class="src">録音 · 7:12</div>'+p.segs.map(s=>'<div class="seg"><time>'+s[0]+'</time><p>'+s[1]+'</p></div>').join(''); }
    else { const p=PAGES[r.id]; rb.innerHTML='<h1>'+p.title+'</h1><div class="src">自分のページ</div>'+p.html; }
    rb.dataset.kind=r.kind; rb.dataset.id=r.id||'';
  }
  function goWeb(){ const v=$('#refurl').value.trim(); if(!v) return; const key='web:'+WEB.url; if(!state.refs.find(x=>x.key===key)) state.refs.push({key,kind:'web',id:null}); state.ref=key; renderRefs(); $('#refurl').value=''; }
  $('#refgo').addEventListener('click',goWeb);
  $('#refurl').addEventListener('keydown',e=>{if(e.key==='Enter')goWeb();});

  /* 引用して挿入 */
  const quotebtn=$('#quotebtn'); let quoteSel=null;
  function placeQuote(){
    const sel=getSelection(); const rb=$('#refbody');
    if(!sel||sel.rangeCount===0||sel.isCollapsed||!rb.contains(sel.anchorNode)){quotebtn.classList.remove('open');return;}
    const r=sel.getRangeAt(0); quoteSel={text:sel.toString().trim(),kind:rb.dataset.kind,id:rb.dataset.id,seg:r.startContainer.parentElement.closest('.seg')?.querySelector('time')?.textContent};
    const rect=r.getBoundingClientRect(),d=$('#doc').getBoundingClientRect();
    quotebtn.classList.add('open');
    quotebtn.style.left=Math.max(8,rect.left-d.left+rect.width/2-quotebtn.offsetWidth/2)+'px';
    quotebtn.style.top=(rect.top-d.top-quotebtn.offsetHeight-8)+'px';
  }
  quotebtn.addEventListener('mousedown',e=>e.preventDefault());
  quotebtn.addEventListener('click',()=>{
    if(!quoteSel) return;
    const q=document.createElement('blockquote');
    let cite='';
    if(quoteSel.kind==='web') cite='<a href="#">'+WEB.title+'</a> · '+WEB.url+'#:~:text='+encodeURIComponent(quoteSel.text.slice(0,12));
    else if(quoteSel.kind==='rec') cite='<a href="#">'+PAGES[quoteSel.id].title+'</a> · '+(quoteSel.seg||'');
    else cite='<a href="#">'+PAGES[quoteSel.id].title+'</a>（自分のページ）';
    q.innerHTML='<p>'+quoteSel.text+'</p><cite>— '+cite+'</cite>';
    const at=caretBlock(); if(at) at.after(q); else body.appendChild(q);
    const after=document.createElement('p'); after.innerHTML='<br>'; q.after(after);
    quotebtn.classList.remove('open'); getSelection().removeAllRanges(); refresh();
    after.focus(); const rg=document.createRange(); rg.setStart(after,0); rg.collapse(true); const s=getSelection(); s.removeAllRanges(); s.addRange(rg);
  });
  let lastCaret=null;
  function caretBlock(){ return lastCaret && body.contains(lastCaret) ? lastCaret : null; }

  /* ================= 本文・書式 ================= */
  const selbar=$('#selbar');
  function blockOf(node){ let n=node&&node.nodeType===3?node.parentElement:node; while(n&&n.parentElement!==body) n=n.parentElement; return n; }
  function placeSel(){
    const sel=getSelection();
    if(sel&&sel.rangeCount&&body.contains(sel.anchorNode)){ lastCaret=blockOf(sel.anchorNode); markCur(); }
    if(!sel||sel.rangeCount===0||sel.isCollapsed||!body.contains(sel.anchorNode)){ if(!$('#aimenu').classList.contains('open')) selbar.classList.remove('open'); return; }
    const r=sel.getRangeAt(0).getBoundingClientRect(),d=$('#doc').getBoundingClientRect();
    selbar.classList.add('open'); const w=selbar.offsetWidth; let x=r.left-d.left+r.width/2-w/2; x=Math.max(8,Math.min(x,d.width-w-8));
    selbar.style.left=x+'px'; selbar.style.top=(r.top-d.top-selbar.offsetHeight-8)+'px';
  }
  document.addEventListener('selectionchange',()=>requestAnimationFrame(()=>{placeSel();placeQuote();}));
  $$('#selbar button[data-cmd]').forEach(b=>b.addEventListener('mousedown',e=>{
    e.preventDefault();const c=b.dataset.cmd;
    if(c==='h2')document.execCommand('formatBlock',false,'h2');
    else if(c==='ul')document.execCommand('insertUnorderedList');
    else if(c==='code'){const s=getSelection();if(s.rangeCount){const r=s.getRangeAt(0);const code=document.createElement('code');code.textContent=r.toString();r.deleteContents();r.insertNode(code);}}
    else if(c==='link')document.execCommand('createLink',false,'https://');
    else document.execCommand(c);
    refresh();
  }));
  title.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();body.focus();}});
  [title,body].forEach(el=>el.addEventListener('input',()=>{refresh();onTyped();}));
  body.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text'));});
  /* AI 由来（灰色）は書き直すと黒に */
  body.addEventListener('input',()=>{const b=caretBlock(); if(b&&b.classList.contains('ai')) b.classList.remove('ai');});

  /* ================= AI コメント ================= */
  const aimenu=$('#aimenu');
  $('#aiask').addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();aimenu.classList.toggle('open');});
  const SAY={
    '構造':['この段落は「観察 → 推測」の順になっています。推測（海岸林の切れ目）を先に出すと、読者の問いが立ちます。','段落の前半が観察、後半が推測。読みの順番としては逆の方が強い。'],
    '反論':['風の弱さは砂浜の向きより、背後の丘の高さで説明できるかもしれません。材木座は三方を丘に囲まれています。','「海岸林の切れ目」だけでは、冬と夏で向きが変わる風を説明できない。'],
    '不明':['「海岸林の切れ目」がどこかを読者は知りません。滑川の河口、と書くと一文で伝わります。','固有名詞の場所が示されていない。'],
    '続き':['切れ目の位置を、次の散歩で確かめてみるのはどうでしょう。滑川の河口の手前と向こうで、風の違いを記録する。','本文の続きとして入れられる段落の案。'],
  };
  const NEXT='<p class="ai">次の散歩では、滑川の河口の手前と向こうで立ち止まって、風の違いを確かめてみたい。海岸林の切れ目が原因なら、河口を境に体感が変わるはずだ。</p>';
  aimenu.addEventListener('mousedown',e=>{
    const b=e.target.closest('button'); if(!b) return; e.preventDefault(); e.stopPropagation();
    const kind=b.dataset.kind; const sel=getSelection(); const anchor=sel&&sel.rangeCount?blockOf(sel.anchorNode):null;
    aimenu.classList.remove('open'); selbar.classList.remove('open');
    const c={id:'c'+Date.now(),kind,anchor,text:SAY[kind][0],why:SAY[kind][1],done:false};
    state.comments.push(c); renderComments(); dbody.classList.add('open'); $('#aitoggle').classList.add('on'); showTab('ai');
    sel.removeAllRanges();
  });
  function renderComments(){
    const th=$('#thread'); th.innerHTML=''; $$('.bd .anchored').forEach(el=>el.classList.remove('anchored'));
    state.comments.forEach(c=>{
      const el=document.createElement('div'); el.className='cmt'+(c.done?' done':'');
      const where=c.anchor?(c.anchor.innerText||'').trim().slice(0,18):'';
      el.innerHTML='<div class="k"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>'+c.kind+'<em>'+where+'</em></div><div>'+c.text+'</div><div class="why">'+c.why+'</div><div class="acts"><button class="ok">'+(c.kind==='続き'?'本文に入れる':'済')+'</button><button class="no">却下</button><button class="q" aria-label="理由">?</button></div>';
      el.addEventListener('mouseenter',()=>c.anchor&&c.anchor.classList.add('anchored'));
      el.addEventListener('mouseleave',()=>c.anchor&&c.anchor.classList.remove('anchored'));
      el.querySelector('.q').addEventListener('click',()=>el.classList.toggle('why'));
      el.querySelector('.no').addEventListener('click',()=>{state.comments=state.comments.filter(x=>x!==c);renderComments();});
      el.querySelector('.ok').addEventListener('click',()=>{
        if(c.kind==='続き'){ const tmp=document.createElement('div'); tmp.innerHTML=NEXT; const p=tmp.firstChild; (c.anchor||body.lastElementChild).after(p); bumpVer(); refresh(); }
        c.done=true; renderComments();
      });
      th.appendChild(el);
    });
  }
  /* 版 */
  let lastAi=null;
  function bumpVer(){ state.ver++; const v=$('#ver'); v.classList.add('on'); $('#verlabel').textContent='版 '+state.ver; $('#vermenu button[data-act=back]').textContent='書き換え前（版 '+(state.ver-1)+'）に戻す'; lastAi=$$('.bd .ai').pop(); }
  $('#ver').addEventListener('click',e=>{e.stopPropagation();$('#vermenu').classList.toggle('open');});
  $('#vermenu').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();$('#vermenu').classList.remove('open');if(b.dataset.act==='back'&&lastAi){lastAi.remove();state.ver--;$('#verlabel').textContent='版 '+state.ver;if(!$('.bd .ai'))$('#ver').classList.remove('on');refresh();}});
  /* 問い（本文由来、1 つだけ） */
  const QS=['材木座のほうが風が弱いのは、なぜだと思いますか？','「海岸林の切れ目」は、散歩の道のどのあたりですか？','豆腐屋に寄るのは、散歩のどんな気分のときですか？'];
  let typedT=null;
  function onTyped(){ clearTimeout(typedT); $('#deeper').classList.remove('on'); if(!document.body.classList.contains('v-ai')||current==='review') return; typedT=setTimeout(()=>{ if(textOf(body).length<10) return; $('#deeperq').textContent=QS[state.deeperN%QS.length]; $('#deeper').classList.add('on'); },1800); }
  $('#deeperw').addEventListener('click',()=>{ const q=$('#deeperq').textContent; const p=document.createElement('p'); p.className='q'; p.textContent=q; body.appendChild(p); const a=document.createElement('p'); a.innerHTML='<br>'; body.appendChild(a); $('#deeper').classList.remove('on'); state.deeperN++; a.focus(); const rg=document.createRange(); rg.setStart(a,0); rg.collapse(true); const s=getSelection(); s.removeAllRanges(); s.addRange(rg); a.scrollIntoView({block:'center'}); });
  $('#deeperx').addEventListener('click',()=>{$('#deeper').classList.remove('on');state.deeperN++;});
  /* @ 出典チップ */
  $('#atbtn').addEventListener('click',()=>{ const r=state.refs.find(x=>x.key===state.ref); const name=r?(r.kind==='web'?WEB.title:PAGES[r.id].title):'このページ'; const c=document.createElement('span'); c.className='chip'; c.innerHTML='@ '+name+'<span class="x">×</span>'; c.querySelector('.x').addEventListener('click',()=>c.remove()); $('#chips').appendChild(c); });

  /* ================= 目次 ================= */
  const toc=$('#toc');
  function renderToc(){
    const hs=$$('.bd h2, .bd h3'); toc.classList.toggle('has',hs.length>=2&&document.body.classList.contains('v-toc'));
    $('#tocbars').innerHTML=hs.map(h=>'<i class="l'+h.tagName[1]+'"></i>').join('');
    const list=$('#toclist'); list.innerHTML='';
    hs.forEach(h=>{ const a=document.createElement('a'); a.className='l'+h.tagName[1]; a.textContent=h.textContent||'（見出し）'; a.draggable=h.tagName==='H2'; a.addEventListener('click',()=>h.scrollIntoView({block:'start',behavior:'smooth'})); a._h=h; list.appendChild(a); });
  }
  let tocDrag=null;
  $('#toclist').addEventListener('dragstart',e=>{const a=e.target.closest('a');if(!a||!a.draggable)return;tocDrag=a;a.classList.add('dragging');toc.classList.add('drag');e.dataTransfer.setData('text/plain','');});
  $('#toclist').addEventListener('dragover',e=>{const a=e.target.closest('a');if(!a||!tocDrag||a===tocDrag||a.classList.contains('l3'))return;e.preventDefault();$$('#toclist a').forEach(x=>x.classList.remove('over'));a.classList.add('over');});
  $('#toclist').addEventListener('drop',e=>{const a=e.target.closest('a');if(!a||!tocDrag||a===tocDrag)return;e.preventDefault();moveSection(tocDrag._h,a._h);endTocDrag();});
  document.addEventListener('dragend',endTocDrag);
  function endTocDrag(){ if(!tocDrag) return; tocDrag.classList.remove('dragging'); tocDrag=null; toc.classList.remove('drag'); $$('#toclist a').forEach(x=>x.classList.remove('over')); }
  function sectionOf(h){ const out=[h]; let n=h.nextElementSibling; while(n&&n.tagName!=='H2'){out.push(n);n=n.nextElementSibling;} return out; }
  function moveSection(h,before){ const sec=sectionOf(h); const target=before; sec.forEach(el=>body.insertBefore(el,target)); renderToc(); h.scrollIntoView({block:'start',behavior:'smooth'}); }

  /* ================= 集中 ================= */
  function setFocus(on){ document.body.classList.toggle('focus',on); $('#focusbtn').setAttribute('aria-pressed',String(on)); $('#focusbtn').classList.toggle('on',on); if(on) markCur(); }
  function markCur(){ $$('.bd > .cur').forEach(el=>el.classList.remove('cur')); const b=caretBlock(); if(b) b.classList.add('cur'); if(document.body.classList.contains('focus')&&b){ const r=b.getBoundingClientRect(); if(Math.abs(r.top+r.height/2-window.innerHeight/2)>40) b.scrollIntoView({block:'center',behavior:'smooth'}); } }
  $('#focusbtn').addEventListener('click',()=>setFocus(!document.body.classList.contains('focus')));
  document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'&&document.body.classList.contains('v-focus')){e.preventDefault();setFocus(!document.body.classList.contains('focus'));} if(e.key==='Escape'){aimenu.classList.remove('open');$('#vermenu').classList.remove('open');rowmenu.classList.remove('open');$('#veil').classList.remove('open');} });
  document.addEventListener('click',e=>{ if(!e.target.closest('#rowmenu,.row .more')) rowmenu.classList.remove('open'); if(!e.target.closest('#ver')) $('#vermenu').classList.remove('open'); });

  /* ================= 初期 ================= */
  openPage('walk');
  state.refs.push({key:'page:coast',kind:'page',id:'coast'}); state.ref='page:coast'; renderRefs(); $$('.row').forEach(r=>r.classList.toggle('ref',r.dataset.page==='coast'));
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.has('ref')) showTab('ref');
  if(h.has('web')){ $('#refurl').value='https://example.jp/kamakura/coast-forest'; goWeb(); showTab('ref'); }
  if(h.has('rec')){ openRef('rec','rec'); }
  if(h.has('cmt')){ ['構造','反論'].forEach(k=>{state.comments.push({id:'x'+k,kind:k,anchor:$$('.bd p')[2],text:SAY[k][0],why:SAY[k][1],done:false});}); state.comments.push({id:'xn',kind:'続き',anchor:$$('.bd p')[2],text:SAY['続き'][0],why:SAY['続き'][1],done:false}); renderComments(); showTab('ai'); }
  if(h.has('ai')){ const tmp=document.createElement('div'); tmp.innerHTML=NEXT; $$('.bd p')[2].after(tmp.firstChild); bumpVer(); refresh(); $('#deeperq').textContent=QS[0]; $('#deeper').classList.add('on'); }
  if(h.has('focus')){ lastCaret=$$('.bd p')[2]; setFocus(true); }
  if(h.has('review')){ openPage('review'); }
  if(h.has('quote')){ const q=document.createElement('blockquote'); q.innerHTML='<p>海岸林は滑川の河口と材木座の東端で途切れており、冬の北西風はこの切れ目から市街地側へ抜ける。</p><cite>— <a href="#">'+WEB.title+'</a> · '+WEB.url+'#:~:text=%E6%B5%B7%E5%B2%B8%E6%9E%97%E3%81%AF</cite>'; $$('.bd p')[2].after(q); refresh(); }
  if(h.get('v')){ const on=h.get('v').split(','); vbtns.forEach(b=>b.classList.toggle('on',on.includes(b.dataset.v))); applyV(); }
})();
</script>
</body>
