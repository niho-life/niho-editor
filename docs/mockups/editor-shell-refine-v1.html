<!doctype html>
<!--
  mock: NIHO editor のシェル（左の一覧・行のメニュー・左下の設定）リファイン v1（PC と 320px）
  色と文字: 単体で開けるよう、色は :root の仮値（hex）で持つ。実装（docs-ui / editor-web）では packages/ui/src/styles/tokens.css の
  token を引き、生の hex は足さない。文字は 12px 以上。

  オーナーの指示（2026-11-06）と、それをどう置いたか:
    1. 「検索」「新しいページ」をアイコンだけにして、「一覧をしまう」と同じ 1 行に
       → 一覧の上は 1 行: [アプリのアイコン Editor] ……… [検索][＋][一覧をしまう]。言葉は吹き出し（検索 ⌘K／新しいページ ⌘N）。
         ＋ は今までどおり「空のページ／録音から／音声ファイルから」のメニュー。検索を押すとその行が検索欄に変わる（今と同じ）。
       ※ 設計 §4 の「2 行にする（アイコンの列にしない。オーナー決定 2026-11-05）」を上書きする。実装のときに設計を直す。
    2. 画面の左上にアプリ名「Editor」とアイコン
       → 一覧の 1 行目の左。一覧をしまったときはヘッダーの左（「一覧を出す」の右隣）に同じものが出るので、どの状態でも左上にある。
         アイコンは Mac アプリの icon.svg（apps/docs/src-tauri/icons）のグリフをそのまま小さく描く。
    3. 行の「…」に「削除」
       → 「…」の中身は「削除」だけ。「開く」は行を押せば開くので要らない。「右に並べて開く」は ⌥クリックとドラッグに任せてメニューから消す。
         削除は今の「…」（右上）と同じ確認（ゴミ箱に 30 日）。触れる端末（hover が無い）では「…」を常に出す。
    4. 「右に並べて開く」「左／右のドックへ移す」「メインの下に浮かせる」は全部やめる（ドラッグで足りる）
       → 一覧の上の「一覧のメニュー（⋯）」そのものを消す。AI の「⋯」は会話の履歴だけにして、「〜へ移す」の行を消す。
         右に並べるのは ⌥クリック・行のドラッグ。ドックを移すのは見出しのドラッグ。
    5. 左下の「設定」を押すとメニュー、もう一度「設定」で設定ページ、の二度手間
       → 左下は「設定」の直リンク（押すとすぐ /settings）。メニューは無い（▾ も無い）。
         発信先・役割とつながり・ログアウトは設定ページの中に入れる。設定の一覧は 3 層設計（#271）のまま、先頭に「アカウント」の群を足す:
           アカウント: [本人の名前 › 役割とつながり（未処理の招待はバッジ）] [発信先 ›]
           AI / 手順 / データ: 今のまま
           いちばん下: ログアウト（薄い 1 行）
         未処理の招待のバッジは、左下の「設定」と「役割とつながり」の行の両方に出す（今までメニューの行に出ていたもの）。
         発信先・役割とつながりのページは「← 設定」で戻る（URL は今のまま /destinations・/account）。

  見かた:
    - 上の黒い帯は mock 用。本物には無い。
    - 行にカーソルを乗せると「…」。押すと「削除」。削除を押すと確認のシート。
    - 左下の「設定」→ 設定の一覧 → 「発信先」「役割とつながり」の行で中へ。
    - 右上の「一覧をしまう」で一覧をしまうと、ヘッダーの左に Editor が出る。
    - 幅 720px 以下はスマホの並び（一覧がはじめの画面。ページ・設定は全画面で、左上のボタンで一覧へ）。
    - URL の ?view=settings|dest|account / ?menu=row|new / ?sb=closed / ?screen=list|page で、その状態で開ける（確認用）。

  作っていない:
    - 本文の保存・公開・AI・検索の結果・新しいページの作成・削除の実行・ログアウトは見た目だけ（押すと右上に一言）。
    - 行のドラッグ・右に並べる・ドックの移動は動かない（本物のまま）。
    - 設定の AI／手順／データの中（あなたについて・固有名詞・手順の詳細）は docs/mockups/editor-settings-refine-v1.html のまま。ここでは行だけ。
  参照: packages/docs-ui/src/shell/sidebar.tsx（es-sb-top / es-sb-acts / rowMenuItems / shellAccountItems）/ packages/docs-ui/src/shell/header.tsx /
        apps/editor-web/src/components/AiBox.tsx（PLACE_TEXT）/ docs/mockups/editor-settings-refine-v1.html / docs/architecture/editor-niho-life-design.md §4
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NIHO editor シェル リファイン v1</title>
<style>
:root{
  --ink:#2a2a26;--ink2:#54544d;--mute:#6e6d66;--faint:#898880;
  --white:#fff;--canvas:#fffdfa;--shell:#fcfaf5;--sand:#f7f7f4;--sand2:#f5f3ee;
  --line:#f1f1ed;--line2:#e7e7e2;--line3:#dbdbd5;--track:#f2efe8;
  --moss:#56751e;--pale:#EEF6E1;--leaf:#B2D67C;--deep:#63A109;
  --grad:linear-gradient(140deg,#7DBA3A 0%,#63A109 100%);--grad-h:linear-gradient(140deg,#74B033 0%,#5C9508 100%);
  --amber:#C8713A;--amber-ink:#a55827;--amber-pale:#FAF0E6;
  --red:#B42318;--red-pale:#fdebec;
  --sans:"Hiragino Maru Gothic ProN","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
  --sbw:244px;--aiw:320px;--bar:40px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:14px/1.6 var(--sans);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
b,strong{font-weight:600}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
kbd{font:12px var(--mono);color:var(--faint)}

/* ===== 共通の部品 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 15px;border-radius:999px;background:var(--grad);color:#fff;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--grad-h)}
.btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line3)}
.btn.line:hover{background:var(--sand);box-shadow:inset 0 0 0 1.5px var(--line3)}
.btn.quiet{background:none;color:var(--ink2)}
.btn.quiet:hover{background:var(--sand)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn .ico{width:15px;height:15px}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none;position:relative}
.ib:hover,.ib.on{background:var(--sand2);color:var(--ink)}
.ib[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:60}
.ib[data-tip]:hover::after,.ib[data-tip]:focus-visible::after{opacity:1}
.ib[data-tip].tip-l::after{left:0;transform:none}
.ib[data-tip].tip-r::after{left:auto;right:0;transform:none}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:50;min-width:200px;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 36px rgba(28,28,26,.12);padding:6px;display:none}
.menu.open{display:block}
.menu.left{right:auto;left:0}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;font-size:13.5px;color:var(--ink)}
.menu button:hover{background:var(--sand)}
.menu button .ico{width:16px;height:16px;color:var(--ink2)}
.menu button small{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap}
.menu button.danger{color:var(--red)}
.menu button.danger .ico{color:var(--red)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu .hd{font-size:12px;font-weight:600;color:var(--faint);padding:4px 10px 6px}
.menu.at{position:fixed;top:0;left:0;right:auto}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--faint);background:var(--sand2);white-space:nowrap;flex:none}
.tag.ok{color:var(--moss);background:var(--pale)}
.tag.no{color:var(--amber-ink);background:var(--amber-pale)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--amber);color:#fff;font-size:11.5px;font-weight:700;font-style:normal;line-height:1}
.av{width:22px;height:22px;border-radius:50%;background:var(--pale);color:var(--moss);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.av.lg{width:40px;height:40px;font-size:16px}
.toast{position:fixed;top:52px;right:16px;z-index:120;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(28,28,26,.2);opacity:0;transition:opacity .15s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}

/* ===== mock bar（本物には無い） ===== */
.mock{position:sticky;top:0;z-index:100;overflow:hidden;display:flex;align-items:center;gap:10px;height:var(--bar);padding:0 12px;background:#141413;color:#fff;font-size:12.5px}
.mock .url{flex:1;min-width:0;background:rgba(255,255,255,.08);border-radius:8px;padding:4px 10px;font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mock .url b{color:#fff;font-weight:600}
.mock .sw{display:flex;align-items:center;gap:6px;overflow:auto}
.mock .sw button{height:24px;padding:0 10px;border-radius:999px;color:rgba(255,255,255,.75);font-weight:600;font-size:12px;border:1px solid rgba(255,255,255,.18);white-space:nowrap;flex:none}
.mock .sw button.on{background:#fff;color:#141413;border-color:#fff}
@media (max-width:820px){.mock .url{display:none}}

/* ===== shell ===== */
.ws{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:calc(100vh - var(--bar))}
.ws.nosb{grid-template-columns:minmax(0,1fr)}
.ws.nosb .sb{display:none}
.sb{position:sticky;top:var(--bar);height:calc(100vh - var(--bar));display:flex;flex-direction:column;background:var(--shell);border-right:1px solid var(--line);min-width:0}

/* 一覧の上の 1 行: ブランド ＋ アイコン 3 つ */
.sb-top{display:flex;align-items:center;gap:2px;height:52px;padding:10px 8px 6px 12px;flex:none}
.brand{display:flex;align-items:center;gap:7px;min-width:0;flex:1;font-weight:600;font-size:14px;letter-spacing:.01em;color:var(--ink);padding:3px 6px 3px 2px;border-radius:8px;white-space:nowrap}
.brand .logo{width:22px;height:22px;flex:none;border-radius:6px;box-shadow:0 1px 2px rgba(28,28,26,.14)}
.sb-top .ib{width:30px;height:30px;color:var(--mute)}
.sb-top .ib:hover,.sb-top .ib.on{color:var(--ink)}
.sb-top .ib .ico{width:17px;height:17px}
.newwrap{position:relative;display:grid}
.sb-find{display:flex;align-items:center;gap:8px;flex:1;min-width:0;height:32px;padding:0 4px 0 10px;border-radius:9px;background:#fff;border:1px solid var(--line2);color:var(--mute)}
.sb-find input{flex:1;min-width:0;border:0;outline:none;font-size:13px;background:none;color:var(--ink)}
.sb-find .ico{width:15px;height:15px}
.sb-find .ib{width:26px;height:26px}

.sb-list{flex:1;min-height:0;overflow:auto;padding:4px 8px 10px}
.row{position:relative;display:flex;align-items:center;gap:6px;min-height:34px;padding:4px 4px 4px calc(10px + var(--d,0) * 18px);border-radius:8px;cursor:pointer;user-select:none;flex-wrap:wrap}
.row:hover{background:var(--sand2)}
.row.on{background:#fff;box-shadow:0 1px 2px rgba(28,28,26,.06),0 0 0 1px var(--line)}
.row b{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row b.untitled{color:var(--mute)}
.row .when{font-size:12px;color:var(--faint);white-space:nowrap;width:40px;text-align:right}
.row .sub{flex-basis:100%;font-size:12px;color:var(--mute);margin-top:-2px;padding-bottom:2px}
.row .more{width:24px;height:24px;border-radius:6px;display:none;place-items:center;color:var(--faint);flex:none}
.row .more .ico{width:16px;height:16px}
.row .more:hover,.row .more.on{background:var(--line2);color:var(--ink)}
.row:hover .when,.row.menu-on .when{display:none}
.row:hover .more,.row.menu-on .more{display:grid}
.row:hover .more{margin-left:16px}
.row.menu-on .more{margin-left:16px;background:var(--line2);color:var(--ink)}
@media (hover:none){.row .when{display:none}.row .more{display:grid}.ib[data-tip]::after{display:none}}

/* このページの写真（閉じた 1 行） */
.sb-photos{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-top:1px solid var(--line);color:var(--faint);font-size:11px;flex:none}
.sb-photos .ico{width:17px;height:17px;color:var(--mute)}

/* 左下: 設定の直リンク（メニューは無い） */
.sb-foot{border-top:1px solid var(--line);padding:8px 10px;flex:none}
.sb-set{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink2);text-decoration:none}
.sb-set:hover,.sb-set.on{background:var(--sand2);color:var(--ink)}
.sb-set .ico{width:18px;height:18px;color:var(--mute)}
.sb-set .badge{margin-left:auto}

/* ===== ページ ===== */
.doc{position:relative;display:flex;flex-direction:column;min-width:0;min-height:calc(100vh - var(--bar))}
.dt{position:sticky;top:var(--bar);z-index:20;display:flex;align-items:center;gap:2px;height:52px;padding:0 10px 0 8px;background:var(--canvas)}
.dt .brand{flex:none;margin-right:4px}
.dt .crumb{font-size:13px;color:var(--mute);max-width:30vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 6px}
.dt .crumb.untitled{color:var(--faint)}
.dt .ins{display:flex;align-items:center;gap:2px;margin-left:6px;padding-left:10px;border-left:1px solid var(--line2)}
.dt .ins .ib{color:var(--faint)}
.dt .ins .ib:hover{color:var(--ink)}
.pubbtn{height:30px;padding:0 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.pubbtn:hover{background:var(--sand)}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) 0;flex:1;transition:grid-template-columns .2s}
.dbody.open{grid-template-columns:minmax(0,1fr) var(--aiw)}
.canvas{padding:52px 56px 140px;min-width:0}
.canvas .in{max-width:680px;margin:auto}
.tt{font-weight:600;font-size:34px;line-height:1.25;letter-spacing:-.01em;min-height:1.25em}
.bd{font-size:16px;line-height:1.95;margin-top:14px;min-height:40vh}
.ph:empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.count{position:fixed;right:18px;bottom:14px;z-index:15;font-size:12px;color:var(--faint);padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--canvas) 85%,transparent)}
.dbody.open .count{right:calc(var(--aiw) + 18px)}

/* AI（右） */
.ai{position:sticky;top:calc(var(--bar) + 52px);align-self:start;height:calc(100vh - var(--bar) - 52px);border-left:1px solid var(--line);background:var(--canvas);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ai .hd{display:flex;align-items:center;gap:2px;height:40px;padding:0 8px 0 16px;font-size:13px;font-weight:600;flex:none}
.ai .hd span{flex:1}
.ai .hd .newwrap .menu{min-width:240px}
.thread{flex:1;overflow:auto;padding:4px 16px}
.composer{padding:10px 12px 12px;flex:none}
.composer .box{border:1px solid var(--line2);border-radius:14px;background:#fff;padding:9px 10px 7px}
.composer textarea{width:100%;border:0;outline:none;resize:none;font-size:13.5px;line-height:1.6;min-height:48px;background:none;padding:0 2px;display:block}
.composer textarea::placeholder{color:var(--faint)}
.composer .foot{display:flex;align-items:center;gap:4px;margin-top:4px}
.composer .foot .ib{width:28px;height:28px;color:var(--faint)}
.send{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin-left:auto}
.send .ico{width:15px;height:15px;stroke-width:2.2}

/* ===== 設定（メインの列に出る） ===== */
.page{padding:0 48px 120px;min-width:0}
.page .in{max-width:640px;margin:auto;min-width:0;padding-top:28px}
.page h1{font-size:22px;font-weight:600}
.back{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:10px;margin-left:-6px;padding:4px 8px 4px 4px;border-radius:8px}
.back:hover{background:var(--sand);color:var(--ink)}
.back .ico{width:16px;height:16px}
.sect{margin-top:28px}
.sect h2{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--mute);margin:0 0 8px 2px}
.grp{border:1px solid var(--line2);border-radius:14px;background:#fff}
.r{position:relative;display:grid;grid-template-columns:150px minmax(0,1fr) auto;align-items:center;gap:6px 14px;width:100%;min-height:48px;padding:8px 12px 8px 16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink)}
.grp>.r:first-child{border-top:0;border-radius:13px 13px 0 0}
.grp>.r:last-child{border-radius:0 0 13px 13px}
.grp>.r:only-child{border-radius:13px}
.r .k{font-weight:600;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px;min-width:0}
.r .k span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .v{min-width:0;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .v small{color:var(--faint);font-size:12.5px;margin-left:6px}
.r .e{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:0}
.r.link{cursor:pointer}
.r.link:hover{background:var(--sand)}
.r.me{grid-template-columns:auto minmax(0,1fr) auto;min-height:60px;gap:6px 12px}
.r.me .t b{display:block;font-size:14px}
.r.me .t small{display:block;font-size:12.5px;color:var(--faint)}
.r.add{min-height:44px;color:var(--moss);font-weight:600;font-size:13px;grid-template-columns:auto minmax(0,1fr);gap:8px}
.r.add .ico{width:15px;height:15px}
.r.add:hover{background:var(--pale)}
.chev{width:16px;height:16px;color:var(--faint);flex:none}
.seg{display:inline-flex;background:var(--sand2);border-radius:999px;padding:3px;flex:none;max-width:100%}
.seg button{height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--moss);box-shadow:0 1px 2px rgba(28,28,26,.08)}
.bar{width:120px;height:6px;border-radius:3px;background:var(--track);flex:none;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:3px}
.logout{display:inline-flex;align-items:center;gap:8px;margin-top:34px;padding:6px 10px 6px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mute)}
.logout:hover{background:var(--sand);color:var(--ink)}
.logout .ico{width:16px;height:16px}
/* 発信先のカード */
.dcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.grp>.dcard:first-child{border-top:0}
.dcard i{width:36px;height:36px;border-radius:10px;flex:none;background:var(--pale)}
.dcard i.kam{background:#E7EEF6}
.dcard i.site{background:var(--sand2)}
.dcard .t{flex:1;min-width:0}
.dcard .t b{display:block;font-size:14px}
.dcard .t code{display:block;font:12px var(--mono);color:var(--faint);margin-top:1px}
.dcard .m{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
/* 役割とつながり */
.acct{display:flex;align-items:center;gap:12px;padding:14px 16px}
.acct b{display:block;font-size:14px}
.acct code{display:block;font:12px var(--mono);color:var(--faint)}
.role{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.grp>.role:first-child{border-top:0}
.role .t{flex:1;min-width:0}
.role .t b{display:block;font-size:13.5px}
.role .t small{display:block;font-size:12.5px;color:var(--faint)}
.role.off .t b{color:var(--mute)}
.invite{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--leaf);background:var(--pale);border-radius:14px;margin-bottom:10px;flex-wrap:wrap}
.invite .t{flex:1;min-width:140px}
.invite .t b{display:block;font-size:13.5px}
.invite .t small{display:block;font-size:12.5px;color:var(--mute)}
.invite .acts{display:flex;gap:6px}

/* ===== 削除の確認（シート） ===== */
.veil{position:fixed;inset:0;z-index:110;background:rgba(28,28,26,.28);display:none;align-items:center;justify-content:center;padding:16px}

.sheet{width:min(420px,100%);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(28,28,26,.24);padding:22px 22px 18px}
.sheet h2{font-size:17px;font-weight:600;margin-bottom:8px}
.sheet p{font-size:13.5px;color:var(--ink2)}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* ===== 画面の切替 ===== */
const ws = $("#ws");
let view = "page";
function show(name) {
  view = name;
  const settings = name !== "page";
  $("#doc").hidden = settings;
  $("#settings").hidden = !settings;
  $("#go-settings").classList.toggle("on", settings);
  if (settings) {
    const v = V[name]();
    $("#settings-in").innerHTML = v.html;
    $("#mb-ttl").textContent = v.title;
    $("#url").textContent = v.url;
    ws.dataset.screen = "settings";
    window.scrollTo(0, 0);
  } else {
    $("#url").textContent = "/p/b3db6a17";
    ws.dataset.screen = "page";
  }
  $$("#sw button").forEach((b) => b.classList.toggle("on", b.dataset.go === (name === "page" ? "page" : name)));
}
document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) { show(go.dataset.go); return; }
  const v = e.target.closest("[data-view]");
  if (v) { show(v.dataset.view); return; }
  const t = e.target.closest("[data-toast]");
  if (t && !e.target.closest("[data-del]")) { e.preventDefault(); toast(t.dataset.toast); closeMenus(); }
});
$("#go-settings").addEventListener("click", (e) => { e.preventDefault(); show("settings"); });

/* ===== メニュー ===== */
function closeMenus() {
  $$(".menu.open").forEach((m) => m.classList.remove("open"));
  $$("[data-menu].on").forEach((b) => { b.classList.remove("on"); b.setAttribute("aria-expanded", "false"); });
  $$(".row.menu-on").forEach((r) => r.classList.remove("menu-on"));
}
$$("[data-menu]").forEach((b) => b.addEventListener("click", (e) => {
  e.stopPropagation();
  const m = $("#menu-" + b.dataset.menu);
  const was = m.classList.contains("open");
  closeMenus();
  if (!was) { m.classList.add("open"); b.classList.add("on"); b.setAttribute("aria-expanded", "true"); }
}));
document.addEventListener("click", (e) => { if (!e.target.closest(".menu")) closeMenus(); }, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeMenus(); $("#veil").classList.remove("open"); } });

/* 行: 押すと開く。「…」と右クリックで削除のメニュー */
let menuRow = null;
function openRowMenu(row, x, y) {
  closeMenus();
  menuRow = row;
  row.classList.add("menu-on");
  const m = $("#menu-row");
  m.classList.add("open");
  const w = 220, h = 50;
  m.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + "px";
  m.style.top = Math.max(8, Math.min(y, window.innerHeight - h - 8)) + "px";
}
$("#list").addEventListener("click", (e) => {
  const more = e.target.closest(".more");
  const row = e.target.closest(".row");
  if (!row) return;
  if (more) { e.stopPropagation(); const r = more.getBoundingClientRect(); openRowMenu(row, r.left, r.bottom + 4); return; }
  $$("#list .row").forEach((r) => r.classList.toggle("on", r === row));
  const t = $("b", row).textContent;
  $("#crumb").textContent = t; $("#crumb").classList.toggle("untitled", $("b", row).classList.contains("untitled"));
  $("#title").textContent = $("b", row).classList.contains("untitled") ? "" : t;
  show("page");
});
$("#list").addEventListener("contextmenu", (e) => { const row = e.target.closest(".row"); if (!row) return; e.preventDefault(); openRowMenu(row, e.clientX, e.clientY); });

/* 削除の確認 */
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-del]");
  if (!d) return;
  e.stopPropagation();
  const row = d.dataset.del === "row" ? menuRow : $("#list .row.on");
  const name = row ? $("b", row).textContent : "無題";
  closeMenus();
  $("#del-h").textContent = `「${name}」を削除しますか？`;
  $("#veil").classList.add("open");
  $("#del-cancel").focus();
  $("#del-ok").onclick = () => { $("#veil").classList.remove("open"); if (row) row.remove(); toast("ゴミ箱に入れました（30 日で消えます）"); };
});
$("#del-cancel").addEventListener("click", () => $("#veil").classList.remove("open"));
$("#veil").addEventListener("click", (e) => { if (e.target === $("#veil")) $("#veil").classList.remove("open"); });

/* 検索: その行が検索欄に変わる */
$("#btn-search").addEventListener("click", () => { $("#sbtop").hidden = true; $("#sbfind").hidden = false; $("#find-input").focus(); });
$("#btn-find-close").addEventListener("click", () => { $("#sbfind").hidden = true; $("#sbtop").hidden = false; $("#btn-search").focus(); });
$("#find-input").addEventListener("keydown", (e) => { if (e.key === "Escape") $("#btn-find-close").click(); });

/* 一覧をしまう／出す: しまったときはヘッダーの左に Editor */
function setSidebar(open) {
  ws.classList.toggle("nosb", !open);
  $("#btn-expand").hidden = open;
  $("#brand-hd").hidden = open;
}
$("#btn-collapse").addEventListener("click", () => setSidebar(false));
$("#btn-expand").addEventListener("click", () => setSidebar(true));
/* スマホ: ページ・設定の左上で一覧へ */
$("#btn-list").addEventListener("click", () => (ws.dataset.screen = "list"));
$("#btn-list2").addEventListener("click", () => (ws.dataset.screen = "list"));
const mq = matchMedia("(max-width:720px)");
function onMq() { $("#btn-list").hidden = !mq.matches; if (mq.matches) setSidebar(true); }
mq.addEventListener("change", onMq); onMq();

/* AI の開閉 */
$("#aitoggle").addEventListener("click", () => { $("#dbody").classList.toggle("open"); $("#aitoggle").classList.toggle("on"); });

/* toast */
let tt;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1800); }

/* ===== URL の指定（確認用） ===== */
const q = new URLSearchParams(location.search);
if (q.get("view")) show({ settings: "settings", dest: "dest", account: "account" }[q.get("view")] || "page");
if (q.get("sb") === "closed") setSidebar(false);
if (q.get("screen")) ws.dataset.screen = q.get("screen");
if (q.get("menu") === "row") { const row = $$("#list .row")[1]; row.classList.add("menu-on"); const r = $(".more", row).getBoundingClientRect(); openRowMenu(row, r.left, r.bottom + 4); }
if (q.get("menu") === "new") $("#btn-new").click();
if (q.get("menu") === "del") { const row = $$("#list .row")[1]; menuRow = row; $("#del-h").textContent = `「${$("b", row).textContent}」を削除しますか？`; $("#veil").classList.add("open"); }
</script>
</body>
