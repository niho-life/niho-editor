<!doctype html>
<!--
  mock: フォルダ › ページ › タブ。本文はタブにある。1 フォルダに 1 つの手順（ワークフロー）があり、「ページ」パネルの「流れ」から
        今開いているタブを入力にして次の出力を作る。画面はパネル（一覧・AI・ページ・写真）をレールに置く形（Cursor のように動かせる）
        v1（PC と 320px）。Issue #288
  土台: docs/mockups/editor-folders-v1.html（フォルダ・この録音について）。色は :root の仮値（hex）。実装では packages/ui の token を引く。

  決めたこと（オーナー 2026-11-06。#288）:
    - 「案」という語も概念も置かない。あるのは フォルダ › ページ › タブ の 3 つ。
    - 本文はタブにある。タブが無いページも、ページ名の上に薄い罫線が本文のコンテンツ幅（680px）であり、右端の ＋ でタブができる
      （「タブを足す」というボタンは置かない）。新しいタブはまっさら（複製だけ元の本文を持つ）。
    - **1 フォルダに 1 つの手順。** 手順は「ページ」パネルの「流れ」に出ていて、各行の右端の「作成」が、今開いているタブを入力に
      その段階の出力を作る（間の段階が無ければ一緒に作る）。この入力から作成済みなら「済み」で押せない。
      「記事にする」「ここから続きを作る」「もう 1 つ作る」というボタンは置かない（同じ入力からもう 1 つはタブの ▾ から）。
    - 機能の出力はフォルダの中へ。同じ役割のページがあればそのページに**タブ**が増え、無ければページができる。
    - 本文の中にも、ページ名の下にも、ボタンや帯を置かない。
    - **AI チャットはアプリ全体で 1 つ。** ページを移っても会話は残る（Cursor の composer と同じ）。探す範囲は、今開いているページの
      入っているフォルダ。パネルの上に「範囲」と「今のタブ」が出て、ページを移ると範囲だけ変わる。
    - **パネルは全部動かせる**（Cursor の感じ）: 一覧・AIと作る・ページ・写真 を、左右のレールの上／下へドラッグで置ける。
      同じレールに 2 つ以上あれば上下に分かれ、境目をドラッグして高さを変える。× で閉じ、ヘッダーのボタンで出す。配置は localStorage に残る。
      中央のエディタ（タブの帯 › 題名 › 本文）だけは固定。
    - **設定はいつでも画面の最下端**（左下。パネルの配置に関係なく）。
    - 比べる＝並べて開く（分割ビュー）。差分は出さない。要らないタブ・ページ＝ゴミ箱。
    - フォルダの外の録音で「作成」を押したら、録音の題名でフォルダを作って中に入れる。

  このモックで見せたいこと:
    1. 録音ページ: 本文は 録音ブロック・「この録音について」・見出し「文字起こし」の下にタブの一覧だけ。文字起こしは「流れ」の行の「作成 ▾」（エンジン）。
    2. 文字起こしページ: 上の帯に Gemini · Deepgram のタブ。再生バー・話者と時刻つきの本文。次の段階は「流れ」の行の「作成」。
    3. 記事本文: タブが 1 つなら題名と本文だけ（帯は罫線と ＋ だけ）。2 つになると帯にタブ（1 · 2）。
    4. 「ページ」パネル: 流れ（手順の全段階。あるページは名前とタブ、無い段階は「（まだ）」。今のページを強調。右端に 作成／済み）›
       このタブ（役割・何から・ここから・タブ・字数・AI で作ったタブなら 作り直す）。
    5. 記事方針のタブ 2: 流れの「記事本文」の「作成」で、この方針から記事本文のタブができる（済みになる）。
    6. AI チャット: 文字起こし修正で相談した会話が、記事本文に移っても残る。範囲はフォルダ。
    7. ふつうのページ（コラム）のタブ: 下書き · 英語版。役割が無くても流れの「作成」で手順を当てられる。
    8. フォルダを開いた画面: 中身の一覧だけ。
    9. パネルの配置: 既定は 左＝一覧、右＝ページ（上）＋AIと作る（下）。見出しをつかんで置き場へ落とす。

  見かた:
    - 上の黒い帯は mock 用。本物には無い。帯のボタンか ?state=rec|transcript|transcribing|step|two|plan2|split|tabs|folder|wrap で状態を開ける。
      「配置を戻す」でパネルを既定に戻す。
    - 一覧の行を押すとそのページ（最後に見たタブ）。タブを押すと切り替え。帯の右端の ＋ でまっさらなタブ。タブの ▾ で 名前を変える（prompt）・
      複製・同じ入力でもう 1 つ（AI）・並べて開く・削除（本当に消える）。パネルの「タブ」の名前を押しても切り替わる。
    - 幅 720px 以下はスマホの並び（一覧がはじめの画面。ページは全画面で、左上のボタンで一覧へ。パネルは 1 つずつ全画面。ドラッグは無し）。

  作っていない:
    - 本文の保存・公開・AI の送信・検索・ドラッグでの並べ替え・移動の実行・写真の追加・手順の切替は見た目だけ（押すと右上に一言）。
    - 音声の再生・文字起こしの実行・段階の実行は動かない（「作成」はタブやページを 1 つ足して開くだけ）。波形は飾り。レールの幅は固定。
    - 版の履歴・公開のシート・AI の返答（会話は作り置き）は出していない。
  参照: Issue #288 / docs/architecture/editor-recipes-and-folders.md §3 / docs/mockups/editor-folders-v1.html（土台）/
        docs/mockups/editor-transcript-candidates-v1.html（採らない形）
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NIHO editor フォルダ › ページ › タブ v1</title>
<style>
:root{
  --ink:#2a2a26;--ink2:#54544d;--mute:#6e6d66;--faint:#898880;
  --white:#fff;--canvas:#fffdfa;--shell:#fcfaf5;--sand:#f7f7f4;--sand2:#f5f3ee;
  --line:#f1f1ed;--line2:#e7e7e2;--line3:#dbdbd5;--track:#f2efe8;
  --moss:#56751e;--pale:#EEF6E1;--leaf:#B2D67C;--deep:#63A109;
  --grad:linear-gradient(140deg,#7DBA3A 0%,#63A109 100%);--grad-h:linear-gradient(140deg,#74B033 0%,#5C9508 100%);
  --amber:#C8713A;--amber-ink:#a55827;--amber-pale:#FAF0E6;
  --red:#B42318;--red-pale:#fdebec;
  --sans:"Hiragino Maru Gothic ProN","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
  --sbw:252px;--aiw:320px;--bar:40px;--rw:0px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:14px/1.6 var(--sans);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
b,strong{font-weight:600}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
kbd{font:12px var(--mono);color:var(--faint)}

/* ===== 共通の部品 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 15px;border-radius:999px;background:var(--grad);color:#fff;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--grad-h)}
.btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line3)}
.btn.line:hover{background:var(--sand);box-shadow:inset 0 0 0 1.5px var(--line3)}
.btn.quiet{background:none;color:var(--ink2)}
.btn.quiet:hover{background:var(--sand)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn .ico{width:15px;height:15px}
.btn .ico.dn{width:13px;height:13px;margin-left:-2px}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none;position:relative}
.ib:hover,.ib.on{background:var(--sand2);color:var(--ink)}
.ib[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:60}
.ib[data-tip]:hover::after,.ib[data-tip]:focus-visible::after{opacity:1}
.ib[data-tip].tip-l::after{left:0;transform:none}
.ib[data-tip].tip-r::after{left:auto;right:0;transform:none}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:50;min-width:210px;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 36px rgba(28,28,26,.12);padding:6px;display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;font-size:13.5px;color:var(--ink)}
.menu button:hover{background:var(--sand)}
.menu button[disabled]{color:var(--faint);cursor:default}
.menu button[disabled]:hover{background:none}
.menu button .ico{width:16px;height:16px;color:var(--ink2)}
.menu button small{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap}
.menu button.danger{color:var(--red)}
.menu button.danger .ico{color:var(--red)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu .hd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mute);padding:4px 10px 6px}
.menu .hd .ico{width:14px;height:14px}
.menu.at{position:fixed;top:0;left:0;right:auto;z-index:130}
.newwrap{position:relative;display:inline-grid}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;color:var(--faint);background:var(--sand2);white-space:nowrap;flex:none}
.tag.ok{color:var(--moss);background:var(--pale)}
.tag .ico{width:12px;height:12px}
.toast{position:fixed;top:52px;right:16px;z-index:140;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(28,28,26,.2);opacity:0;transition:opacity .15s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.seg{display:inline-flex;background:var(--sand2);border-radius:999px;padding:3px;flex:none;max-width:100%}
.seg button{height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--moss);box-shadow:0 1px 2px rgba(28,28,26,.08)}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{width:12px;height:12px;border:2px solid var(--leaf);border-top-color:var(--deep);border-radius:50%;animation:sp 1s linear infinite;flex:none;display:inline-block;vertical-align:-1px}
.none{color:var(--faint)}

/* ===== mock bar（本物には無い） ===== */
.mock{position:sticky;top:0;z-index:100;overflow:hidden;display:flex;align-items:center;gap:10px;height:var(--bar);padding:0 12px;background:#141413;color:#fff;font-size:12.5px}
.mock .url{flex:1;min-width:0;background:rgba(255,255,255,.08);border-radius:8px;padding:4px 10px;font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mock .url b{color:#fff;font-weight:600}
.mock .sw{display:flex;align-items:center;gap:6px;overflow:auto}
.mock .sw button{height:24px;padding:0 10px;border-radius:999px;color:rgba(255,255,255,.75);font-weight:600;font-size:12px;border:1px solid rgba(255,255,255,.18);white-space:nowrap;flex:none}
.mock .sw button.on{background:#fff;color:#141413;border-color:#fff}
.mock .sw button.reset{border-style:dashed;color:rgba(255,255,255,.55)}
@media (max-width:820px){.mock .url{display:none}}

/* ===== shell: 左レール › 中央 › 右レール。レールにはパネルが縦に並ぶ ===== */
.ws{display:grid;grid-template-columns:auto minmax(0,1fr) auto;min-height:calc(100vh - var(--bar))}
.rail{position:sticky;top:var(--bar);height:calc(100vh - var(--bar));display:flex;flex-direction:column;min-width:0;width:var(--sbw);background:var(--shell);border-right:1px solid var(--line)}
#rail-left{padding-bottom:48px}
#rail-right{width:var(--aiw);background:var(--canvas);border-right:0;border-left:1px solid var(--line)}
.panel{display:flex;flex-direction:column;min-height:0;flex:1 1 0;overflow:hidden;background:inherit}
.ph{display:flex;align-items:center;gap:4px;height:38px;padding:0 6px 0 8px;font-size:12.5px;font-weight:600;color:var(--ink2);flex:none;user-select:none;cursor:grab}
.ph:active{cursor:grabbing}
.ph .grip{width:14px;height:14px;color:var(--line3);flex:none}
.ph:hover .grip{color:var(--faint)}
.ph .pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.ph .ib{width:28px;height:28px;color:var(--faint)}
.ph .ib:hover{color:var(--ink)}
.ph .ib .ico{width:16px;height:16px}
.pb{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.split{height:6px;flex:none;cursor:row-resize;position:relative;touch-action:none}
.split::after{content:"";position:absolute;left:10px;right:10px;top:2px;height:2px;border-radius:2px;background:var(--line2)}
.split:hover::after,.split.on::after{background:var(--leaf)}
#park{display:none}
/* ドラッグ中の置き場 */
.dz{position:fixed;z-index:95;display:none;align-items:center;justify-content:center;border:2px dashed var(--leaf);border-radius:12px;background:rgba(178,214,124,.16);color:var(--moss);font-size:13px;font-weight:600;pointer-events:none}
body.dragging .dz{display:flex;pointer-events:auto}
.dz.over{background:rgba(178,214,124,.42);border-style:solid}
body.dragging .ph{cursor:grabbing}
/* 設定: いつでも画面の最下端（左下）。パネルの配置に関係なく */
.setbtn{position:fixed;left:12px;bottom:12px;z-index:16;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);background:color-mix(in srgb,var(--shell) 92%,transparent);box-shadow:0 1px 2px rgba(28,28,26,.08),0 0 0 1px var(--line2);text-decoration:none}
.setbtn:hover{color:var(--ink);background:var(--sand2)}
.setbtn .ico{width:17px;height:17px;color:var(--mute)}

/* 一覧のパネル */
.sb-list{flex:1;min-height:0;overflow:auto;padding:2px 8px 10px}
.row{position:relative;display:flex;align-items:center;gap:6px;min-height:34px;padding:4px 4px 4px calc(8px + var(--d,0) * 16px);border-radius:8px;cursor:pointer;user-select:none;flex-wrap:wrap}
.row:hover{background:var(--sand2)}
.row.on{background:#fff;box-shadow:0 1px 2px rgba(28,28,26,.06),0 0 0 1px var(--line)}
.row b{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-size:12px;color:var(--faint);white-space:nowrap;width:40px;text-align:right}
.row .n{font-size:12px;font-weight:600;color:var(--moss);background:var(--pale);border-radius:999px;padding:0 6px;line-height:18px;flex:none}
.row .sub{flex-basis:100%;font-size:12px;color:var(--mute);margin-top:-2px;padding:0 0 2px 22px;display:flex;align-items:center;gap:6px}
.row .tw{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--faint);flex:none}
.row .tw:hover{background:var(--line2);color:var(--ink)}
.row .tw .ico{width:14px;height:14px;transition:transform .12s}
.row.closed .tw .ico{transform:rotate(-90deg)}
.row .tw.none{visibility:hidden}
.row .ki{width:17px;height:17px;flex:none;color:var(--ink2)}
.row.folder b{font-weight:600}
.row.step .ki{width:13px;height:13px;color:var(--faint)}
.row.transcript .ki{width:15px;height:15px;color:var(--mute)}
.row .more{width:24px;height:24px;border-radius:6px;display:none;place-items:center;color:var(--faint);flex:none}
.row .more .ico{width:16px;height:16px}
.row .more:hover,.row .more.on{background:var(--line2);color:var(--ink)}
.row:hover .when,.row.menu-on .when{display:none}
.row:hover .more,.row.menu-on .more{display:grid}
.row:hover .more{margin-left:16px}
.row.menu-on .more{margin-left:16px;background:var(--line2);color:var(--ink)}
@media (hover:none){.row .when{display:none}.row .more{display:grid}.ib[data-tip]::after{display:none}}

/* ===== 中央: ページ ===== */
.doc{position:relative;display:flex;flex-direction:column;min-width:0;min-height:calc(100vh - var(--bar))}
.dt{position:sticky;top:var(--bar);z-index:20;display:flex;align-items:center;gap:2px;height:52px;padding:0 10px 0 8px;background:var(--canvas)}
.brand{display:flex;align-items:center;gap:7px;min-width:0;font-weight:600;font-size:14px;letter-spacing:.01em;color:var(--ink);padding:3px 6px 3px 2px;border-radius:8px;white-space:nowrap;flex:none;margin-right:4px}
.brand .logo{width:22px;height:22px;flex:none;border-radius:6px;box-shadow:0 1px 2px rgba(28,28,26,.14)}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;margin:0 4px;font-size:13px;color:var(--mute)}
.crumbs button{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:22vw;padding:3px 7px;border-radius:7px;color:var(--mute)}
.crumbs button:hover{background:var(--sand);color:var(--ink)}
.crumbs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs i{color:var(--line3);font-style:normal;flex:none}
.crumbs .ico{width:14px;height:14px}
.loc{display:none}
.dt .ins{display:flex;align-items:center;gap:2px;margin-left:6px;padding-left:10px;border-left:1px solid var(--line2)}
.dt .ins .ib{color:var(--faint)}
.dt .ins .ib:hover{color:var(--ink)}
.dt .tg{display:flex;align-items:center;gap:2px;margin-left:4px;padding-left:8px;border-left:1px solid var(--line2)}
.dt .tg .ib{color:var(--faint)}
.dt .tg .ib.on{color:var(--ink);background:var(--sand2)}
.pubbtn{height:30px;padding:0 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.pubbtn:hover{background:var(--sand)}
/* タブの帯: ページ名の上、本文のコンテンツ幅（680px）と同じ薄い罫線。右端に ＋。タブが 2 つ以上なら左にタブ */
.tabbar{position:sticky;top:calc(var(--bar) + 52px);z-index:19;padding:0 56px;background:var(--canvas)}
.tabbar .in{display:flex;align-items:flex-end;gap:2px;height:38px;border-bottom:1px solid var(--line2)}
.tabbar .tb{display:flex;align-items:flex-end;flex:none;position:relative}
.tabbar [role=tab]{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;margin-bottom:-1px;border-bottom:2px solid transparent;border-radius:8px 8px 0 0;font-size:13.5px;font-weight:600;color:var(--mute);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.tabbar [role=tab]:hover{background:var(--sand);color:var(--ink)}
.tabbar [role=tab][aria-selected=true]{color:var(--ink);border-bottom-color:var(--moss)}
.tabbar .tm{width:22px;height:36px;margin:0 0 -1px -8px;display:none;place-items:center;color:var(--faint);border-radius:8px 8px 0 0;border-bottom:2px solid var(--moss)}
.tabbar .tm .ico{width:13px;height:13px}
.tabbar .tb.on .tm{display:grid}
.tabbar .tm:hover{color:var(--ink);background:var(--sand)}
.tabbar .add{margin-left:auto;width:30px;height:30px;margin-bottom:3px;display:grid;place-items:center;color:var(--faint);border-radius:8px;flex:none}
.tabbar .add:hover{background:var(--sand);color:var(--ink)}
.tabbar .add .ico{width:16px;height:16px}
.canvas{padding:36px 56px 140px;min-width:0;flex:1}
.canvas .in{max-width:680px;margin:auto}
.tt{font-weight:600;font-size:32px;line-height:1.25;letter-spacing:-.01em;min-height:1.25em;outline:none}
.tt.fh{display:flex;align-items:center;gap:12px}
.tt.fh .ico{width:30px;height:30px;color:var(--ink2);stroke-width:1.5}
.bd{font-size:16px;line-height:1.95;margin-top:14px;min-height:30vh;outline:none}
.bd h2{font-size:20px;margin:26px 0 6px}
.bd p+p{margin-top:10px}
.bd ol{list-style:decimal;padding-left:1.5em}
.ph-text:empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.count{position:fixed;right:calc(var(--rw) + 18px);bottom:14px;z-index:15;font-size:12px;color:var(--faint);padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--canvas) 85%,transparent)}
.count:hover{color:var(--ink);background:var(--sand2)}
.runnote{display:flex;align-items:center;gap:8px;margin-top:14px;padding:8px 12px;border-radius:10px;background:var(--pale);color:var(--moss);font-size:13px;font-weight:600}

/* 録音ブロック */
.recblk{display:flex;align-items:center;gap:12px;margin-top:18px;padding:10px 12px;border-radius:12px;background:var(--sand);flex-wrap:wrap}
.recblk .src{flex-basis:100%;font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:6px;margin-top:-2px}
.recblk .src button{color:var(--ink2);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.recblk .src button:hover{text-decoration:underline}
.recblk .src .ico{width:13px;height:13px}
.play{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.play .ico{width:16px;height:16px;fill:#fff;stroke:none;margin-left:2px}
.wave{flex:1;min-width:120px;height:26px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--line3) 0 2px,transparent 2px 5px);mask:linear-gradient(90deg,#000 0 55%,rgba(0,0,0,.35) 55%)}
.time{font:12px var(--mono);color:var(--mute);white-space:nowrap}

/* この録音について（録音ブロックの直下。畳める） */
.recinfo{margin-top:10px;border:1px solid var(--line2);border-radius:12px;background:#fff}
.ri-hd{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;font-size:13px;border-radius:12px}
.ri-hd:hover{background:var(--sand)}
.ri-hd b{font-weight:600;white-space:nowrap}
.ri-hd .ico.mic{color:var(--ink2)}
.ri-hd .sum{flex:1;min-width:0;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri-hd .chev{width:16px;height:16px;color:var(--faint);transition:transform .12s}
.recinfo.closed .ri-hd .chev{transform:rotate(-90deg)}
.recinfo:not(.closed) .ri-hd .sum{visibility:hidden}
.recinfo.closed .ri-body{display:none}
.ri-body{border-top:1px solid var(--line);padding:2px 12px 8px}
.ri-r{display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px 12px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.ri-r:first-child{border-top:0}
.ri-r label{font-size:12.5px;font-weight:600;color:var(--ink2);padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;height:27px;padding:0 4px 0 10px;border-radius:999px;background:var(--sand2);font-size:12.5px;max-width:100%}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{color:var(--faint);font-size:12px;white-space:nowrap}
.chip .x{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:var(--faint);flex:none}
.chip .x:hover{background:var(--line2);color:var(--ink)}
.chip .x .ico{width:11px;height:11px;stroke-width:2.2}
.chip.add{background:none;color:var(--moss);font-weight:600;padding:0 9px;box-shadow:inset 0 0 0 1px var(--line2)}
.chip.add:hover{background:var(--pale)}
.chip.add .ico{width:13px;height:13px;stroke-width:2.2}
.chips .tag{height:27px;padding:0 9px}
.ri-r textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:13px;line-height:1.6;resize:vertical;min-height:58px;background:#fff;outline:none;display:block}
.ri-r textarea:focus{border-color:var(--leaf)}
.ri-r textarea::placeholder{color:var(--faint)}

/* 録音ページの「文字起こし」: 文字起こしページのタブの一覧 */
.txhd{display:flex;align-items:center;gap:8px;margin-top:28px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.txhd h2{font-size:14px;font-weight:600;color:var(--ink2);margin-right:2px}
.txlist{margin-top:8px}
.txlist li{display:flex;align-items:center;gap:10px;min-height:42px;padding:6px 10px;border-radius:10px;cursor:pointer}
.txlist li:hover{background:var(--sand)}
.txlist li .ki{width:16px;height:16px;color:var(--mute)}
.txlist li .t{flex:1;min-width:0}
.txlist li .t b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txlist li .t small{display:block;font-size:12.5px;color:var(--mute)}
.txlist li .when{font-size:12px;color:var(--faint);white-space:nowrap}
.txlist li .ico.chev{width:14px;height:14px;color:var(--line3)}
.txempty{margin-top:10px;padding:26px 16px;border:1px dashed var(--line3);border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.txempty small{color:var(--faint);font-size:12.5px}

/* 文字起こしページの本文 */
.txmeta{display:flex;align-items:center;gap:8px;margin-top:22px;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.txmeta .btn{height:28px;padding:0 10px;font-size:12.5px}
.txmeta .btn.quiet{margin-left:auto}
.tx{margin-top:10px;font-size:15.5px;line-height:1.9}
.tx p{padding:6px 0}
.tx .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);line-height:1.4;margin-bottom:1px}
.tx .meta b{color:var(--ink2);font-size:12.5px}
.tx .meta small{font:12px var(--mono);color:var(--faint)}
.tx .meta button{font:12px var(--mono);color:var(--faint)}
.tx .meta button:hover{color:var(--moss)}

/* フォルダを開いた画面: 中身の一覧だけ */
.facts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.frows{margin-top:18px;border:1px solid var(--line2);border-radius:14px;background:#fff}
.frows li{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer}
.frows li:first-child{border-top:0;border-radius:13px 13px 0 0}
.frows li:last-child{border-radius:0 0 13px 13px}
.frows li:hover{background:var(--sand)}
.frows li .ki{width:17px;height:17px;color:var(--ink2)}
.frows li.step .ki{width:13px;height:13px;color:var(--faint)}
.frows li.transcript .ki{width:15px;height:15px;color:var(--mute)}
.frows li .t{flex:1;min-width:0}
.frows li .t b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frows li .t small{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frows li .when{font-size:12px;color:var(--faint);white-space:nowrap}
.empty{margin-top:28px;padding:36px 16px;border:1px dashed var(--line3);border-radius:14px;text-align:center;color:var(--faint);font-size:13.5px}

/* 並べて開く（分割ビュー） */
.canvas.wide .in{max-width:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.cols>section{min-width:0;border-left:1px solid var(--line);padding-left:24px}
.cols>section:first-child{border-left:0;padding-left:0}
.cols .ch{display:flex;align-items:center;gap:6px;margin:-12px 0 10px;font-size:12.5px;color:var(--faint)}
.cols .ch .ib{width:26px;height:26px;margin-left:auto}
.cols .tt{font-size:24px}
.cols .bd{font-size:15px;min-height:0}

/* AI のパネル: アプリ全体で 1 つの会話。上に範囲（今のページのフォルダ）と今のタブ */
.scope{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:4px 14px 8px;font-size:12px;color:var(--faint);flex:none}
.scope .tag{font-weight:500;color:var(--mute);background:var(--sand)}
.scope .tag.now{color:var(--moss);background:var(--pale)}
.scope .tag .ico{color:var(--faint)}
.scope .tag.now .ico{color:var(--moss)}
.thread{flex:1;overflow:auto;padding:2px 14px 6px}
.msg{font-size:13px;line-height:1.65;margin:8px 0}
.msg.me{margin-left:28px;padding:8px 11px;border-radius:12px 12px 4px 12px;background:var(--sand)}
.msg.ai{padding:0 2px}
.msg .at{display:block;font-size:12px;color:var(--faint);margin-bottom:2px}
.msg .at .ico{width:12px;height:12px;vertical-align:-2px;margin-right:3px}
.msg .did{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font-size:12px;font-weight:600;color:var(--moss);background:var(--pale);border-radius:999px;padding:1px 9px}
.msg .did .ico{width:12px;height:12px;stroke-width:2.2}
.composer{padding:0 12px 12px;flex:none}
.composer .box{border:1px solid var(--line2);border-radius:14px;background:#fff;padding:9px 10px 7px}
.composer textarea{width:100%;border:0;outline:none;resize:none;font-size:13.5px;line-height:1.6;min-height:48px;background:none;padding:0 2px;display:block}
.composer textarea::placeholder{color:var(--faint)}
.composer .foot{display:flex;align-items:center;gap:4px;margin-top:4px}
.composer .foot .ib{width:28px;height:28px;color:var(--faint)}
.send{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin-left:auto}
.send .ico{width:15px;height:15px;stroke-width:2.2}

/* ページのパネル: 流れ（手順。各行の右端に 作成／済み）› このタブ */
.ibody{padding:0 14px 16px;font-size:13px}
.sec{padding:12px 0 10px;border-top:1px solid var(--line2)}
.sec:first-child{border-top:0;padding-top:4px}
.sec h3{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:6px;min-width:0}
.sec h3 .wf{display:inline-flex;align-items:center;gap:3px;color:var(--ink2);border-radius:6px;padding:1px 4px 1px 6px}
.sec h3 .wf:hover{background:var(--sand)}
.sec h3 .wf .ico{width:12px;height:12px}
.sec h3 .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.fl{display:flex;flex-direction:column;gap:1px}
.fl li{display:flex;align-items:center;gap:4px;min-width:0}
.fl li .go{display:flex;align-items:center;gap:8px;flex:1;min-width:0;min-height:34px;padding:4px 8px;border-radius:8px;color:var(--ink2);font-weight:500}
.fl li .go:hover{background:var(--sand)}
.fl li .go .ico{width:14px;height:14px;color:var(--moss);stroke-width:2.2}
.fl li .go .ki{color:var(--mute);stroke-width:1.7}
.fl li .go span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl li .go small{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap;padding-left:8px}
.fl li.cur .go{background:var(--pale);color:var(--ink);font-weight:600}
.fl li.none .go{color:var(--faint);font-weight:500;cursor:default}
.fl li.none .go:hover{background:none}
.fl li.none .go .ico{color:var(--line3)}
.fl li .mk{display:inline-flex;align-items:center;gap:3px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--grad);color:#fff;flex:none;white-space:nowrap}
.fl li .mk:hover{background:var(--grad-h)}
.fl li .mk .ico{width:11px;height:11px;stroke-width:2.4}
.fl li .mk[disabled]{background:var(--sand2);color:var(--faint);cursor:default}
.ir{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.ir:first-of-type{border-top:0}
.ir dt{font-size:12px;font-weight:600;color:var(--mute);padding-top:3px}
.ir dd{min-width:0;color:var(--ink);line-height:1.65}
.lk{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;margin-left:-6px;border-radius:6px;color:var(--ink2);font-weight:500;max-width:100%}
.lk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk+.lk{margin-left:0}
.lk:hover{background:var(--sand);color:var(--ink)}
.lk.cur{color:var(--ink);font-weight:600;background:var(--sand);box-shadow:inset 0 0 0 1px var(--line3)}
.lk .ico{width:13px;height:13px;color:var(--moss);stroke-width:2.2}
.sep{color:var(--line3);margin:0 3px}
.lineage{display:flex;flex-direction:column;gap:1px}
.lineage li{display:flex;align-items:center;gap:4px;min-width:0}
.lineage li+li::before{content:"↳";color:var(--line3);font-size:12px;flex:none}
.lineage li .cur{font-weight:600}

/* 写真のパネル（このページの写真 #265） */
.photos{padding:4px 14px 14px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pho{aspect-ratio:1;border-radius:10px;background:var(--sand2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--faint);font-size:12px;font-weight:600;cursor:grab}
.pho.a{background:linear-gradient(160deg,#dfe8cf,#b8c9a2)}
.pho.b{background:linear-gradient(160deg,#e8e0cf,#cdbfa0)}
.pho.c{background:linear-gradient(160deg,#d6e1e8,#a7bcc9)}
.pho.add{background:none;border-style:dashed;color:var(--moss);cursor:pointer}
.pho.add .ico{width:18px;height:18px;stroke-width:2.2}
.photos .hint{margin-top:10px;font-size:12px;color:var(--faint)}

/* ===== シート（削除） ===== */
.veil{position:fixed;inset:0;z-index:110;background:rgba(28,28,26,.28);display:none;align-items:center;justify-content:center;padding:16px}
.veil.open{display:flex}
.sheet{width:min(440px,100%);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(28,28,26,.24);padding:22px 22px 18px}
.sheet h2{font-size:17px;font-weight:600;margin-bottom:8px}
.sheet p{font-size:13.5px;color:var(--ink2)}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* ===== スマホ（720px 以下）: レールは出さず、一覧は最初の画面、ほかのパネルは 1 つずつ全画面 ===== */
@media (max-width:720px){
  .ws{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .ws[data-screen="list"] #rail-left{display:flex;position:static;height:auto;min-height:calc(100vh - var(--bar));width:auto;border:0}
  .ws[data-screen="list"] .doc{display:none}
  #rail-right.mob{display:flex;position:fixed;top:var(--bar);left:0;right:0;bottom:0;height:auto;width:auto;z-index:90;border:0;padding-bottom:0}
  .ph{cursor:default}
  .ph .grip{display:none}
  .split{display:none}
  .dt .brand{display:none}
  .dt .ins{display:none}
  .dt .crumbs{display:none}
  .dt .tg{padding-left:4px;margin-left:2px}
  .pubbtn{padding:0 9px}
  #tg-list{display:none}
  .loc{display:flex;flex-wrap:wrap;margin:0 auto 4px;min-height:0}
  .loc:empty{display:none}
  .loc button{max-width:60vw;margin-left:-7px}
  .loc button+i{margin-left:0}
  .tabbar{padding:0 16px}
  .tabbar [role=tab]{max-width:none}
  .canvas{padding:22px 16px 120px}
  .tt{font-size:25px}
  .count{right:12px}
  .setbtn{bottom:10px;left:10px;height:30px;padding:0 10px 0 8px}
  .ri-r{grid-template-columns:minmax(0,1fr);gap:4px}
  .ri-r label{padding-top:0}
  .frows li .when,.txlist li .when{display:none}
  .cols{grid-template-columns:minmax(0,1fr);gap:20px}
  .cols>section{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}
  .cols>section:first-child{border-top:0;padding-top:0}
  .cols .ch{margin-top:0}
}
</style>
</head>
<body>

<div class="mock">
  <div class="url"><b>editor.niho.life</b><span id="url">/p/r1</span></div>
  <div class="sw" id="sw">
    <button data-state="rec" class="on">録音ページ</button>
    <button data-state="transcript">文字起こし</button>
    <button data-state="transcribing">2 つ目のタブを作成中</button>
    <button data-state="step">記事本文</button>
    <button data-state="two">記事本文のタブ 2</button>
    <button data-state="plan2">記事方針のタブ 2</button>
    <button data-state="split">並べて開く</button>
    <button data-state="tabs">ふつうのページのタブ</button>
    <button data-state="folder">フォルダ</button>
    <button data-state="wrap">フォルダの外の録音</button>
    <button class="reset" id="btn-reset-layout">配置を戻す</button>
  </div>
</div>

<div class="ws" id="ws" data-screen="page">
  <div class="rail" id="rail-left" aria-label="左のレール"></div>

  <!-- 中央: タブの帯 › ページ（題名 › 本文）／フォルダ -->
  <main class="doc" id="doc">
    <header class="dt">
      <button class="ib tip-l" id="btn-list" data-tip="一覧" aria-label="一覧へ" hidden></button>
      <div class="brand" id="brand-hd"></div>
      <nav class="crumbs" id="crumbs" aria-label="場所"></nav>
      <div class="ins" id="ins">
        <button class="ib" data-tip="ブロック" aria-label="ブロックを挿入" data-toast="ブロックの一覧（モック）"><span data-ic="plus"></span></button>
        <button class="ib" data-tip="画像" aria-label="画像" data-toast="画像（モック）"><span data-ic="img"></span></button>
        <button class="ib" data-tip="録音" aria-label="録音" data-toast="録音（モック）"><span data-ic="mic"></span></button>
      </div>
      <span class="sp"></span>
      <button class="pubbtn" id="pubbtn" data-toast="公開のシート（モック）">公開</button>
      <div class="tg" aria-label="パネル">
        <button class="ib" id="tg-list" data-panel="list" data-tip="一覧" aria-label="一覧のパネル" aria-pressed="true"><span data-ic="side"></span></button>
        <button class="ib" id="tg-ai" data-panel="ai" data-tip="AIと作る" aria-label="AIと作るのパネル" aria-pressed="true"><span data-ic="panel"></span></button>
        <button class="ib" id="tg-page" data-panel="page" data-tip="ページ" aria-label="ページのパネル" aria-pressed="true"><span data-ic="info"></span></button>
        <button class="ib" id="tg-photos" data-panel="photos" data-tip="写真" aria-label="写真のパネル" aria-pressed="false"><span data-ic="img"></span></button>
      </div>
      <span class="newwrap">
        <button class="ib tip-r" data-menu="dots" data-tip="その他" aria-label="その他"><span data-ic="more"></span></button>
        <div class="menu" id="menu-dots" role="menu" aria-label="ページのメニュー"></div>
      </span>
    </header>
    <div class="tabbar" id="tabbar"><div class="in" id="tabs" role="tablist" aria-label="タブ"></div></div>
    <div class="canvas" id="cv"><nav class="in loc crumbs" id="loc" aria-label="場所"></nav><div class="in" id="canvas"></div></div>
    <button class="count" id="count" aria-label="字数。押すとページのパネル">0 字</button>
  </main>

  <div class="rail" id="rail-right" aria-label="右のレール"></div>
</div>

<a class="setbtn" href="#" data-toast="設定（モック）" aria-label="設定"><span data-ic="gear"></span>設定</a>

<!-- パネル（レールへ移して使う。ここは置き場） -->
<div id="park">
  <section class="panel" id="panel-list" data-panel="list" aria-label="一覧">
    <div class="ph" draggable="true"><span data-ic="grip" class="grip"></span><span class="pt">一覧</span>
      <button class="ib" id="btn-search" data-tip="検索 ⌘K" aria-label="検索（⌘K）"></button>
      <button class="ib" id="btn-new" data-menu="new" data-tip="新しいページ ⌘N" aria-label="新しいページ（⌘N）" aria-haspopup="menu"></button>
      <button class="ib tip-r" data-close-panel="list" data-tip="閉じる" aria-label="一覧を閉じる"><span data-ic="x"></span></button>

    ? `<ul class="txlist">${txs.map((t) => `<li data-open="${t.id}">${svg("lines", "ico ki")}<div class="t"><b>${tl(t)}</b><small>${t.st === "run" ? '<i class="spin"></i> 文字起こし中… · 残り 3 分ほど' : `${t.engine} · 42:10 · 1,240 字`}</small></div><span class="when">${t.when}</span>${svg("chev", "ico chev")}</li>`).join("")}</ul>`
    : `<div class="txempty"><small>まだありません。「ページ」パネルの「流れ」で、文字起こしの「作成」を押すと、同じフォルダに「文字起こし」のページができます</small><button class="btn quiet sm" data-show-panel="page">${svg("info")}パネルを開く</button></div>`;
  return `<h1 class="tt" contenteditable="true" spellcheck="false">${p.t}</h1>
  <div class="recblk"><button class="play" aria-label="再生" data-toast="再生（モック）">${svg("play")}</button><div class="wave" aria-hidden="true"></div><span class="time">00:00 / 42:10</span><span class="tag">2 ファイル</span></div>
  <section class="recinfo${closed ? " closed" : ""}" id="recinfo" aria-label="この録音について">
    <button class="ri-hd" aria-expanded="${!closed}" aria-controls="ri-body">${svg("mic", "ico mic")}<b>この録音について</b><span class="sum">${info.sum}</span>${svg("down", "ico chev")}</button>
    <div class="ri-body" id="ri-body">
      <div class="ri-r"><label>話者人数</label>${seg(["自動", "1人", "2人", "3人", "4人以上"], info.speakers)}</div>
      <div class="ri-r"><label>言語</label>${seg(["日本語", "English"], 0)}</div>
      <div class="ri-r"><label>登場人物</label><div class="chips">${info.people}${addChip("追加")}</div></div>
      <div class="ri-r"><label>固有名詞</label><div class="chips">${info.terms}${addChip("追加")}<span class="tag" title="設定の固有名詞">${svg("gear")}共通 5</span></div></div>
      <div class="ri-r"><label>背景</label><textarea rows="3" aria-label="背景" placeholder="取材の目的、相手、場所など">${info.bg}</textarea></div>
    </div>
  </section>
  <div class="txhd"><h2>文字起こし</h2>${txs.length > 1 ? `<span class="tag">${txs.length} タブ</span>` : ""}</div>
  ${list}`;
}

function transcriptHtml(p, tab) {
  const r = madeFrom(tab);
  const body = tab.st === "run"
    ? `<p><i class="spin"></i> 文字起こし中… 残り 3 分ほど。終わるとここに出ます。</p>`
    : TX.map(([who, at, text]) => `<p><span class="meta"><b>${who}</b><button data-toast="${at} から再生（モック）">${at}</button></span>${text}</p>`).join("");
  return `<h1 class="tt" contenteditable="true" spellcheck="false">${p.t}</h1>
  <div class="recblk"><button class="play" aria-label="再生" data-toast="再生（モック）">${svg("play")}</button><div class="wave" aria-hidden="true"></div><span class="time">00:00 / 42:10</span>${r ? `<span class="src">音声:<button data-open="${r.page.id}">${svg("mic")}${r.page.t}</button></span>` : ""}</div>
  <div class="txmeta"><span>${tab.engine} · 日本語 · 2人</span><button class="btn quiet" data-toast="話者の名前（モック）">話者の名前</button></div>
  <div class="tx" contenteditable="${tab.st === "run" ? "false" : "true"}" spellcheck="false">${body}</div>`;
}

function stepHtml(p, tab) {
  const role = p.role;
  const note = tab.st === "run" ? `<p class="runnote"><i class="spin"></i> 作成中… 残り 2 分ほど。終わるとここに出ます。</p>` : tab.st === "wait" ? `<p class="runnote">前の段階が終わると作ります。</p>` : "";
  const body = tab.st ? "" : role === 1 ? (tab.id === "s2b" ? `
    <h2>狙い</h2><p>珈琲店主・佐藤さんの二十年を、朝の散歩という一本の線で描く人物記事。</p>
    <h2>読者</h2><p>店の常連と、これから鎌倉に通う人。</p>
    <h2>構成</h2><ol><li>店を開ける前の一時間、何を見ているか</li><li>二十年の変化と、変わらない道</li><li>最後に、店の一杯へ</li></ol>
    <h2>書かないこと</h2><p>観光案内、営業情報。</p>` : `
    <h2>狙い</h2><p>北鎌倉の「観光客が来る前の一時間」を、珈琲店主の二十年の習慣から描く。</p>
    <h2>読者</h2><p>鎌倉に住んでみたい人。観光ガイドではなく、暮らしの手触りを求めている。</p>
    <h2>構成</h2><ol><li>朝 6 時の総門の匂い（春と秋の対比）</li><li>二十年の散歩が店の味にどうつながるか</li><li>読者が同じ道を歩くための、短い案内</li></ol>
    <h2>書かないこと</h2><p>店の営業情報、紫陽花の時期の混雑。</p>`)
    : role === 0 ? TX.map(([who, , text]) => `<p><b>${who}</b>：${text}</p>`).join("")
    : tab.id === "s3b" ? `<p>北鎌倉の朝は、駅を降りた瞬間に始まる。空気が、もう違う。</p><p>珈琲店を開ける前の一時間、佐藤さんは二十年、同じ道を歩いてきた。円覚寺の総門の前で季節の匂いを確かめ、明月院へ抜ける。紫陽花の季節だけは避ける。</p><p>観光の人が来る前の一時間だけ、町は自分のものになる——その言葉が、この店の一杯の味を決めている。</p>`
    : `<h2>観光客が来る前の一時間</h2><p>北鎌倉の駅を降りると、朝の空気がもう違う。珈琲店を開ける前にこの道を歩くのが、佐藤さんの二十年の習慣だ。</p><p>円覚寺の総門のあたりは、季節で匂いが変わる。春は土と梅、秋は金木犀。「観光の方が来る前の一時間だけ、町が自分のものになる」。</p><h2>二十年の散歩と、一杯の珈琲</h2><p>その一時間が、店の味をつくってきた。散歩の途中で見た光と匂いが、その日の豆の挽き方を決める。</p><h2>同じ道を歩くなら</h2><p>北鎌倉駅から円覚寺の総門へ。建長寺の前を通って明月院まで、歩いて四十分ほど。朝六時台なら、人はいない。</p>`;
  return `<h1 class="tt" contenteditable="true" spellcheck="false">${p.t}</h1>${note}<div class="bd" contenteditable="true" spellcheck="false">${body}</div>`;
}

function noteHtml(p, tab) {
  const body = tab.blank ? "" : {
    w1a: `<p>材木座の冬の海は、朝の七時でもまだ青くない。灰色の水面に、サーファーが二人、点のように浮いている。</p><p>海辺の町で冬を過ごすと、海は見るものではなく、天気のように「ある」ものになる。</p>`,
    w1b: `<p>The winter sea at Zaimokuza is not yet blue at seven in the morning. On the grey water, two surfers float like dots.</p><p>Spend a winter in a seaside town and the sea stops being something you look at. It becomes something that is simply there, like the weather.</p>`,
    d1a: `<p>北鎌倉駅 → 円覚寺の総門 → 建長寺の前を通って → 明月院。徒歩で 40 分ほど。</p><p>朝 6 時台は人がいない。総門の前の坂で振り返ると、線路の向こうに朝日。</p>`,
    p2a: `<p>鎌倉が大好きです。</p>`,
  }[tab.id] ?? "";
  return `<h1 class="tt" contenteditable="true" spellcheck="false">${p.t}</h1><div class="bd ph-text" contenteditable="true" data-ph="書きはじめる。「/」でブロック" spellcheck="false">${body}</div>`;
}

/* 本文: まっさらなタブは空の本文。複製は元のタブの本文。ほかは役割で決まる */
function bodyHtml(p, tab) {
  if (tab.blank) return noteHtml(p, tab);
  if (tab.dupOf) return bodyHtml(p, srcOf(tab));
  const k = kindOf(p);
  return k === "rec" ? recHtml(p, tab) : k === "transcript" ? transcriptHtml(p, tab) : k === "step" ? stepHtml(p, tab) : noteHtml(p, tab);
}

/* フォルダを開いた画面: 中身の一覧だけ（録音 › 文字起こし › 段階の順。タブの名前つき） */
function folderHtml(f) {
  const kids = sorted(kidsOf(f));
  const rows = kids.map((k) => { const ts = tabsOf(k); const sub = [ts.length > 1 || k.role === "transcript" ? ts.map(tl).join(" · ") : "", roleSay(k)].filter(Boolean).join(" · "); return `<li class="${kindOf(k)}" data-open="${k.id}">${k.role === "rec" ? svg("mic", "ico ki") : k.role === "transcript" ? svg("lines", "ico ki") : typeof k.role === "number" ? svg("spark", "ico ki") : svg("doc", "ico ki")}<div class="t"><b>${k.t}</b>${sub ? `<small>${ts.some((t) => t.st === "run") ? '<i class="spin"></i> ' : ""}${sub}</small>` : ""}</div><span class="when">${k.when}</span></li>`; });
  return `<h1 class="tt fh" contenteditable="true" spellcheck="false">${svg("folder")}${f.t}</h1>
  <div class="facts"><button class="btn sm" data-toast="このフォルダに空のページを作ります（モック）">${svg("plus")}新しいページ</button><button class="btn line sm" data-toast="このフォルダに録音のページを作ります（モック）">${svg("mic")}録音から</button></div>
  ${rows.length ? `<ul class="frows">${rows.join("")}</ul>` : `<div class="empty">まだページがありません</div>`}`;
}

/* 流れ: このフォルダの手順の全段階（録音 › 文字起こし › 段階…）。あるページは名前とタブ、無い段階は「（まだ）」。
   各行の右端に「作成」: 今開いているタブを入力に、その段階まで作る。この入力から作成済みなら「済み」で押せない */
function flowHtml(p, tab) {
  const f = folderOf(p);
  const kids = f ? sorted(kidsOf(f)) : [];
  const role = p.role;
  const pos = role === "rec" ? -1 : role === "transcript" ? -0.5 : typeof role === "number" ? role : -0.5; /* 役割の無いページは文字起こしの位置（段階の入力になれる） */
  const rows = [];
  const rowHtml = (page, label, icon, mk, cur) => `<li class="${cur ? "cur" : page ? "" : "none"}">${page ? `<button class="go" data-open="${page.id}"${cur ? ' aria-current="page"' : ""}>${icon}<span>${page.t}</span>${tabsOf(page).length > 1 || page.role === "transcript" ? `<small>${tabsOf(page).map(tl).join(" · ")}</small>` : ""}</button>` : `<span class="go">${icon}<span>${label}（まだ）</span></span>`}${mk}</li>`;
  const mkBtn = (state, attrs = "") => state === "done" ? `<button class="mk" disabled aria-disabled="true">${svg("check")}済み</button>` : state === "go" ? `<button class="mk" ${attrs}>${svg("plus")}作成</button>` : "";
  /* 録音 */
  const rec = kids.find((k) => k.role === "rec") || (role === "rec" ? p : null);
  rows.push(rowHtml(rec, "録音", svg("mic", "ico ki"), rec ? "" : `<button class="mk" data-toast="録音のページを作ります（モック）">${svg("plus")}録音</button>`, rec && rec.id === p.id));
  /* 文字起こし: 録音があれば作れる。エンジンを選ぶ。今のタブ（録音）から作成済みのエンジンはメニューの中で済み */
  const txp = kids.find((k) => k.role === "transcript") || (role === "transcript" ? p : null);
  const txRun = txp && tabsOf(txp).some((t) => t.st === "run");
  const txIcon = txRun ? '<i class="spin"></i>' : txp ? svg("check") : svg("lines", "ico ki");
  const canTx = !!(rec || role === "rec");
  rows.push(rowHtml(txp, "文字起こし", txIcon, canTx && pos <= -1 ? `<button class="mk" data-menu="tx" aria-haspopup="menu">${svg("plus")}作成${svg("down")}</button>` : canTx && !txp ? `<button class="mk" data-menu="tx" aria-haspopup="menu">${svg("plus")}作成${svg("down")}</button>` : "", txp && txp.id === p.id));
  /* 段階 */
  RECIPE.steps.forEach((name, i) => {
    const sp = kids.find((k) => k.role === i) || (role === i ? p : null);
    const run = sp && tabsOf(sp).some((t) => t.st === "run");
    const icon = run ? '<i class="spin"></i>' : sp ? svg("check") : svg("spark", "ico ki");
    let st = "";
    if (i > pos && !(role === "rec")) st = sp && tabsOf(sp).some((t) => derivedFrom(t, tab)) ? "done" : "go";
    rows.push(rowHtml(sp, name, icon, mkBtn(st, `data-make="step:${i}"`), sp && sp.id === p.id));
  });
  return `<section class="sec"><h3><button class="wf" data-menu="flow" aria-haspopup="menu">${RECIPE.name}${svg("down")}</button><span class="fn">· ${f ? f.t : "（フォルダの外。作成するとフォルダに入ります）"}</span></h3><ol class="fl" aria-label="流れ">${rows.join("")}</ol></section>`;
}

/* 「ページ」パネル（オーナーの言う「エディタパネル」）: 流れ › このタブ */
function infoHtml(p, tab) {
  const role = p.role;
  const roleTxt = role === "rec" ? "録音" : role === "transcript" ? `文字起こし${tab.engine ? ` · ${tab.engine}` : ""}` : typeof role === "number" ? `${RECIPE.name} › ${RECIPE.steps[role]}（${role + 1} / ${RECIPE.steps.length}）` : '<span class="none">なし</span>';
  const up = []; for (let a = madeFrom(tab); a; a = madeFrom(a)) up.unshift(a);
  const down = madeHere(tab);
  const ts = tabsOf(p);
  const rows = [["役割", roleTxt]];
  if (up.length) rows.push(["何から", `<ol class="lineage">${up.map((a) => `<li><button class="lk" data-open="${a.id}"><span>${fullLabel(a)}</span></button></li>`).join("")}<li><span class="cur">このタブ</span></li></ol>`]);
  if (down.length) rows.push(["ここから", down.map((d) => `<button class="lk" data-open="${d.id}">${d.st === "run" ? '<i class="spin"></i>' : ""}<span>${fullLabel(d)}</span></button>`).join('<span class="sep">·</span>')]);
  rows.push(["タブ", ts.length > 1 ? ts.map((t) => `<button class="lk${t === tab ? " cur" : ""}" data-open="${t.id}"${t === tab ? ' aria-current="true"' : ""}><span>${tl(t)}</span></button>`).join('<span class="sep">·</span>') : '<span class="none">1 つ（帯の右端の ＋ で足す）</span>']);
  rows.push(["字数", `${countOf(tab)} · ${tab.when ?? "今"}`]);
  if (tab.from) rows.push(["AI", `<button class="lk" data-toast="このタブを作り直します。前の本文は版に残ります（モック）">${svg("redo")}<span>作り直す</span></button><span class="sep">·</span><button class="lk" data-make="sibling">${svg("copy")}<span>同じ入力でもう 1 つ</span></button>`]);
  return `${flowHtml(p, tab)}<section class="sec"><h3>このタブ</h3><dl>${rows.map(([k, v]) => `<div class="ir"><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl></section>`;
}

/* AI チャット: アプリ全体で 1 つ。会話は作り置きで、ページを移っても残る。上の「範囲」と「今のタブ」だけ変わる */
const THREAD = [
  { me: true, at: "文字起こし修正", text: "佐藤さんの発言の「二十年」を「20年」にそろえて。" },
  { me: false, text: "文字起こし修正の 3 か所を「20年」にしました。「二十年の習慣」「二十年の散歩」も同じです。", did: "文字起こし修正を書き換え" },
  { me: true, at: "記事本文 2", text: "この本文も同じ表記に。見出しはそのままで。" },
  { me: false, text: "記事本文 2 の本文 2 か所を「20年」にしました。見出しは触っていません。", did: "記事本文 2 を部分置換" },
];
function renderThread() {
  $("#thread").innerHTML = THREAD.map((m) => `<div class="msg ${m.me ? "me" : "ai"}">${m.me && m.at ? `<span class="at">${svg("doc")}${m.at} で</span>` : ""}${m.text}${m.did ? `<br><span class="did">${svg("check")}${m.did}</span>` : ""}</div>`).join("");
}
function scopeHtml(p, tab) {
  const f = folderOf(p);
  const tags = [];
  tags.push(f ? `<span class="tag">${svg("folder")}範囲: ${f.t}（${kidsOf(f).length} ページ）</span>` : `<span class="tag">${svg("doc")}範囲: このページだけ</span>`);
  if (p.kind !== "folder") tags.push(`<span class="tag now">${svg("doc")}今: ${tabsOf(p).length > 1 ? `${p.t} ${tl(tab)}` : p.t}</span>`);
  if (p.role !== undefined) tags.push(`<span class="tag">${svg("mic")}この録音について</span>`);
  if (typeof p.role === "number") tags.push(`<span class="tag">${svg("spark")}文書ガイド</span>`);
  return tags.join("");
}

/* パンくずは場所（親のフォルダ）だけ。 */
function crumbsHtml(p) {
  const f = p.kind === "folder" ? null : folderOf(p);
  return f ? `<button data-open="${f.id}">${svg("folder")}<span>${f.t}</span></button>` : "";
}

/* ページを開く: id はページでもタブでもよい。ページなら最後に見たタブ（初回は 1 つ目） */
function open(id) {
  const n = BY.get(id);
  if (!n) return;
  const p = pageOf(n);
  const folder = p.kind === "folder";
  let tab = null;
  if (!folder) {
    tab = isTab(n) ? n : (p.last && BY.get(p.last) && shown(BY.get(p.last)) ? BY.get(p.last) : tabsOf(p)[0]);
    p.last = tab.id;
  }
  curPage = p.id; curTab = tab ? tab.id : null;
  $("#cv").classList.remove("wide");
  $("#tabbar").hidden = folder;
  $("#tabs").innerHTML = folder ? "" : tabbarHtml(p, tab);
  $("#canvas").innerHTML = folder ? folderHtml(p) : bodyHtml(p, tab);
  $("#crumbs").innerHTML = crumbsHtml(p);
  $("#loc").innerHTML = crumbsHtml(p);
  $("#ins").hidden = folder || (p.role === "transcript" && !tab.blank);
  $("#pubbtn").hidden = folder;
  $("#count").hidden = folder;
  $("#scope").innerHTML = scopeHtml(p, tab);
  $("#info-body").innerHTML = folder ? `<section class="sec"><p class="none">フォルダには操作がありません。ページを開くと、流れとタブが出ます。</p></section>` : infoHtml(p, tab);
  $("#count").textContent = countOf(tab);
  $("#menu-dots").innerHTML = folder
    ? `<button data-menu="flow">${svg("spark")}このフォルダの手順<small>${RECIPE.name}</small></button><button data-toast="フォルダの中を .zip に書き出します（モック）">${svg("doc")}書き出し<small>.zip</small></button><hr><button class="danger" data-del="${p.id}">${svg("trash")}削除</button>`
    : `<button data-toast="共有のリンク（モック）">${svg("link")}リンクで共有</button><button data-toast="書き出し（モック）">${svg("doc")}書き出し<small>.md · Google ドキュメント</small></button><button data-toast="履歴（モック）">${svg("cal")}履歴</button><hr><button data-toast="並べて開く相手を選びます（モック）">${svg("cols")}並べて開く…</button><button data-toast="移動（モック）">${svg("move")}移動…</button><hr><button class="danger" data-del="${p.id}">${svg("trash")}削除</button>`;
  $("#url").textContent = "/p/" + (tab ? tab.id : p.id);
  renderList();
  $("#ws").dataset.screen = "page";
  if (mq.matches) { mobilePanel = null; renderLayout(); }
  window.scrollTo(0, 0);
}

/* 並べて開く: 2 つのタブを横に（スマホは縦）。帯は出さない */
function openSplit(a, b) {
  const A = BY.get(a), B = BY.get(b);
  curPage = A.page.id; curTab = a;
  $("#cv").classList.add("wide");
  $("#tabbar").hidden = true;
  $("#canvas").innerHTML = `<div class="cols">${[A, B].map((t) => `<section><div class="ch">${svg("doc")}${fullLabel(t)}<button class="ib" aria-label="閉じる" data-open="${t === A ? b : a}">${svg("x")}</button></div>${bodyHtml(t.page, t)}</section>`).join("")}</div>`;
  $("#crumbs").innerHTML = crumbsHtml(A.page);
  $("#loc").innerHTML = crumbsHtml(A.page);
  $("#ins").hidden = true; $("#pubbtn").hidden = true; $("#count").hidden = true;
  $("#scope").innerHTML = scopeHtml(A.page, A);
  $("#info-body").innerHTML = infoHtml(A.page, A);
  $("#url").textContent = `/p/${a}?with=${b}`;
  renderList();
  $("#ws").dataset.screen = "page";
  window.scrollTo(0, 0);
}

/* 固定のメニューの中身（開くときに今のページ・タブで作る） */
const MENUS = {
  new: () => { const n = BY.get(curPage); const f = n ? folderOf(n) : null; return `${f ? `<div class="hd">${svg("folder")}「${f.t}」の中に</div>` : ""}<button data-toast="空のページを作ります（モック）">${svg("doc")}空のページ<small>⌘N</small></button><button data-toast="録音のページを作ります（モック）">${svg("mic")}録音から</button><hr><button data-toast="フォルダを作ります（モック）">${svg("folder")}フォルダ</button>`; },
  tx: () => {
    const n = BY.get(curTab); const r = recTabOf(n);
    const f = r ? folderOf(r.page) : null; const txp = f ? findRole(f, "transcript") : null;
    const used = txp && r ? tabsOf(txp).filter((t) => t.from === r.id).map((t) => t.engine) : [];
    const item = (eng, note) => used.includes(eng) ? `<button disabled>${eng}<small>済み</small></button>` : `<button data-make="tx:${eng}">${eng}${note ? `<small>${note}</small>` : ""}</button>`;
    return `<div class="hd">エンジンを選ぶ · 「文字起こし」のタブになります</div>${item("Gemini", "既定")}${item("Deepgram")}${item("この Mac", "オフライン")}`;
  },
  flow: () => `<div class="hd">${svg("spark")}このフォルダの手順（1 つ）</div>${FLOWS.map((n) => n === RECIPE.name ? `<button disabled>${n}<small>今の手順</small></button>` : `<button data-toast="手順を「${n}」に変えます（モック）">${n}</button>`).join("")}`,
  tab: () => {
    const t = BY.get(curTab);
    const others = tabsOf(t.page).filter((x) => x !== t);
    return `<button data-rename="${t.id}">${svg("edit")}名前を変える</button><button data-make="dup">${svg("copy")}複製</button>${t.from ? `<button data-make="sibling">${svg("spark")}同じ入力でもう 1 つ<small>AI</small></button>` : ""}${others.length ? `<button data-split="${others[0].id}">${svg("cols")}並べて開く<small>${tl(others[0])}</small></button>` : ""}<button data-toast="別のページへ移します（モック）">${svg("move")}別のページへ移す</button><hr><button class="danger" data-del="${t.id}">${svg("trash")}削除<small>ゴミ箱に 30 日</small></button>`;
  },
};

/* タブの名前を変える（モックは prompt）。タブ・ページを本当に消す（ゴミ箱の代わり） */
function renameTab(id) {
  const t = BY.get(id);
  const name = window.prompt("タブの名前", tl(t));
  if (name === null) return;
  t.t = name.trim() || tl(t);
  open(t.id);
  toast("名前を変えました（モック）");
}
function remove(n) {
  if (isTab(n)) {
    const p = n.page, ts = tabsOf(p);
    if (ts.length <= 1) { remove(p); return; }
    p.tabs.splice(p.tabs.indexOf(n), 1);
    if (p.last === n.id) delete p.last;
    index();
    open(p.id);
    return;
  }
  const list = n.parent ? n.parent.children : TREE;
  list.splice(list.indexOf(n), 1);
  index();
  open(n.parent ? n.parent.id : (TREE.find((x) => x.kind !== "folder") ?? TREE[0]).id);
}

/* ===== 機能がページとタブを作る（モック: 1 つ足して開くだけ） ===== */
let seq = 10;
function wrapFolder(p) {
  let f = folderOf(p);
  if (f) return f;
  /* フォルダの外の録音: 録音の題名でフォルダを作って中に入れる */
  f = { id: "f" + (seq++), kind: "folder", t: p.t, open: true, children: [] };
  TREE.splice(TREE.indexOf(p), 1, f);
  f.children.push(p);
  toast(`フォルダ「${p.t}」を作って、録音を中に入れました`);
  return f;
}
function rolePage(f, role, title) {
  let p = findRole(f, role);
  if (!p) { p = { id: "p" + (seq++), kind: "page", role, t: title, when: "今", tabs: [] }; f.children.push(p); }
  return p;
}
function addTab(p, tab) { p.tabs.push(tab); index(); open(tab.id); return tab; }
/* 文字起こしの元の録音タブ。録音のタブならそれ自身、文字起こしのタブなら作った元（from）→ 複製元（dupOf）の順にたどる。
   空のタブ・複製には from が無いので、たどれなければフォルダの録音ページの最初のタブ。それも無ければ null（Codex P2, #288） */
function recTabOf(n) {
  if (n.page.role === "rec") return n;
  for (let t = n, hops = 0; t && hops < 8; hops++) {
    const up = madeFrom(t) || (t.dupOf ? BY.get(t.dupOf) : null);
    if (!up) break;
    if (up.page.role === "rec") return up;
    t = up;
  }
  const f = folderOf(n);
  const rec = f ? findRole(f, "rec") : null;
  return rec ? tabsOf(rec)[0] ?? null : null;
}
function makeTranscript(engine) {
  const n = BY.get(curTab);
  const recTab = recTabOf(n);
  if (!recTab) { toast("元の録音が見つからないので、文字起こしできません（モック）"); return; }
  const f = wrapFolder(recTab.page);
  const p = rolePage(f, "transcript", "文字起こし");
  addTab(p, { id: "t" + (seq++), t: engine, engine, from: recTab.id, when: "今", st: "run" });
  toast(tabsOf(p).length > 1 ? `「文字起こし」に ${engine} のタブを足しました（モック）` : "「文字起こし」のページができました（モック）");
}
/* 流れの「作成」: 今のタブを入力に、その段階まで作る（間の段階が無ければ一緒に）。同じ役割のページがあればタブ、無ければページ */
function makeChain(tab, k) {
  const f = wrapFolder(tab.page);
  const role = tab.page.role;
  const start = typeof role === "number" ? role + 1 : 0;
  let from = tab.id, last = null, made = 0;
  for (let i = start; i <= k; i++) {
    const p = rolePage(f, i, RECIPE.steps[i]);
    const t = { id: "s" + (seq++), t: String(tabsOf(p).length + 1), from, when: "今", st: i === start ? "run" : "wait" };
    p.tabs.push(t); from = t.id; last = t; made++;
  }
  index();
  open(last.id);
  toast(made > 1 ? `「${fullLabel(tab)}」から ${RECIPE.steps[k]} まで ${made} 段階を作っています（モック）` : `「${fullLabel(tab)}」から ${RECIPE.steps[k]} を作っています（モック）`);
}
function makeSibling(tab) {
  const p = tab.page;
  addTab(p, { id: "s" + (seq++), t: String(tabsOf(p).length + 1), from: tab.from, when: "今", st: "run" });
  toast("同じ入力から、もう 1 つ作っています（モック）");
}
/* タブを足す: ＋ はまっさら（本文なし）。複製は元のタブの本文をそのまま */
function makeTab(dup) {
  const p = BY.get(curPage), cur = BY.get(curTab);
  const t = { id: "n" + (seq++), t: String(tabsOf(p).length + 1), when: "今" };
  if (dup) { t.dupOf = srcOf(cur).id; t.t = `${tl(cur)} のコピー`; } else t.blank = true;
  addTab(p, t);
  toast(dup ? "タブを複製しました（モック）" : "まっさらなタブを足しました（モック）");
}

/* ===== パネルの配置（Cursor のように動かせる）: レールごとの並びと高さの割合 ===== */
const PANELS = { list: "一覧", ai: "AIと作る", page: "ページ", photos: "写真" };
const HOME = { list: "left", ai: "right", page: "right", photos: "right" };
const DEFAULT_LAYOUT = () => ({ left: ["list"], right: ["page", "ai"] });
let layout = DEFAULT_LAYOUT();
let sizes = { list: 1, ai: 1, page: 1, photos: 1 };
let mobilePanel = null;
const mq = matchMedia("(max-width:720px)");
const placed = (id) => layout.left.includes(id) || layout.right.includes(id);
function loadLayout() { try { const s = JSON.parse(localStorage.getItem("mock-layout") || "null"); if (s && s.layout && s.layout.left && s.layout.right) { layout = s.layout; sizes = { ...sizes, ...(s.sizes || {}) }; } } catch {} }
function saveLayout() { try { localStorage.setItem("mock-layout", JSON.stringify({ layout, sizes })); } catch {} }
function renderLayout() {
  const mob = mq.matches;
  const park = $("#park");
  for (const id of Object.keys(PANELS)) park.appendChild($("#panel-" + id));
  for (const side of ["left", "right"]) {
    const rail = $("#rail-" + side);
    rail.innerHTML = "";
    const ids = mob ? (side === "left" ? ["list"] : (mobilePanel ? [mobilePanel] : [])) : layout[side];
    ids.forEach((id, i) => {
      if (i) { const s = document.createElement("div"); s.className = "split"; s.dataset.side = side; s.dataset.i = i; s.setAttribute("role", "separator"); s.setAttribute("aria-orientation", "horizontal"); rail.appendChild(s); }
      const el = $("#panel-" + id); el.style.flex = `${sizes[id]} 1 0`; rail.appendChild(el);
    });
    rail.hidden = ids.length === 0;
    rail.classList.toggle("mob", mob && side === "right" && ids.length > 0);
  }
  document.documentElement.style.setProperty("--rw", !mob && layout.right.length ? getComputedStyle(document.documentElement).getPropertyValue("--aiw") : "0px");
  for (const id of Object.keys(PANELS)) {
    const b = $("#tg-" + id); if (!b) continue;
    const on = mob ? mobilePanel === id : placed(id);
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on));
  }
}
function showPanel(id) {
  if (mq.matches) { mobilePanel = id; renderLayout(); return; }
  if (!placed(id)) { layout[HOME[id]].push(id); saveLayout(); }
  renderLayout();
}
function togglePanel(id) {
  if (mq.matches) { mobilePanel = mobilePanel === id ? null : id; renderLayout(); return; }
  if (placed(id)) hidePanel(id); else showPanel(id);
}
function hidePanel(id) {
  if (mq.matches) { if (mobilePanel === id) mobilePanel = null; renderLayout(); return; }
  layout.left = layout.left.filter((x) => x !== id); layout.right = layout.right.filter((x) => x !== id);
  saveLayout(); renderLayout();
}
function movePanel(id, side, pos) {
  layout.left = layout.left.filter((x) => x !== id); layout.right = layout.right.filter((x) => x !== id);
  if (pos === "top") layout[side].unshift(id); else layout[side].push(id);
  saveLayout(); renderLayout();
  toast(`「${PANELS[id]}」を${side === "left" ? "左" : "右"}の${pos === "top" ? "上" : "下"}に置きました`);
}
/* ドラッグ: パネルの見出しをつかむと、置き場（各レールの上／下、空のレール）が現れる */
let dragId = null;
function placeZones() {
  const zones = $("#zones"); zones.innerHTML = "";
  const docR = $("#doc").getBoundingClientRect();
  for (const side of ["left", "right"]) {
    const rail = $("#rail-" + side);
    const others = layout[side].filter((x) => x !== dragId);
    const r = rail.hidden ? null : rail.getBoundingClientRect();
    if (others.length && r) {
      const h = r.height / 2;
      zones.insertAdjacentHTML("beforeend", `<div class="dz" data-side="${side}" data-pos="top" style="left:${r.left + 6}px;top:${r.top + 6}px;width:${r.width - 12}px;height:${h - 9}px">上に置く</div><div class="dz" data-side="${side}" data-pos="bottom" style="left:${r.left + 6}px;top:${r.top + h + 3}px;width:${r.width - 12}px;height:${h - 9}px">下に置く</div>`);
    } else {
      const w = 150;
      const left = side === "left" ? (r ? r.left + 6 : docR.left + 6) : (r ? r.right - w - 6 : docR.right - w - 6);
      zones.insertAdjacentHTML("beforeend", `<div class="dz" data-side="${side}" data-pos="top" style="left:${left}px;top:${docR.top + 6}px;width:${w}px;height:${docR.height - 12}px">${side === "left" ? "左" : "右"}のレールに</div>`);
    }
  }
}
document.addEventListener("dragstart", (e) => {
  const ph = e.target.closest && e.target.closest(".ph");
  if (!ph || mq.matches) return;
  dragId = ph.parentElement.dataset.panel;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragId);
  document.body.classList.add("dragging");
  placeZones();
});
document.addEventListener("dragend", () => { dragId = null; document.body.classList.remove("dragging"); $("#zones").innerHTML = ""; });
document.addEventListener("dragover", (e) => { const z = e.target.closest && e.target.closest(".dz"); if (!z || !dragId) return; e.preventDefault(); e.dataTransfer.dropEffect = "move"; $$(".dz.over").forEach((x) => x.classList.remove("over")); z.classList.add("over"); });
document.addEventListener("dragleave", (e) => { const z = e.target.closest && e.target.closest(".dz"); if (z) z.classList.remove("over"); });
document.addEventListener("drop", (e) => { const z = e.target.closest && e.target.closest(".dz"); if (!z || !dragId) return; e.preventDefault(); movePanel(dragId, z.dataset.side, z.dataset.pos); });
/* 境目をドラッグして高さを変える */
document.addEventListener("pointerdown", (e) => {
  const s = e.target.closest(".split"); if (!s) return;
  e.preventDefault();
  const side = s.dataset.side, i = +s.dataset.i, ids = layout[side];
  const a = $("#panel-" + ids[i - 1]), b = $("#panel-" + ids[i]);
  const ha = a.getBoundingClientRect().height, hb = b.getBoundingClientRect().height, y0 = e.clientY;
  const tot = sizes[ids[i - 1]] + sizes[ids[i]];
  s.classList.add("on");
  const move = (ev) => { const dy = Math.max(-(ha - 90), Math.min(hb - 90, ev.clientY - y0)); const fa = (ha + dy) / (ha + hb); sizes[ids[i - 1]] = tot * fa; sizes[ids[i]] = tot * (1 - fa); a.style.flex = `${sizes[ids[i - 1]]} 1 0`; b.style.flex = `${sizes[ids[i]]} 1 0`; };
  const up = () => { s.classList.remove("on"); document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up); saveLayout(); };
  document.addEventListener("pointermove", move); document.addEventListener("pointerup", up);
});
document.addEventListener("click", (e) => {
  const tg = e.target.closest("[data-panel].ib"); if (tg) { togglePanel(tg.dataset.panel); return; }
  const cl = e.target.closest("[data-close-panel]"); if (cl) { hidePanel(cl.dataset.closePanel); return; }
  const sp = e.target.closest("[data-show-panel]"); if (sp) { showPanel(sp.dataset.showPanel); return; }
});
$("#btn-reset-layout").addEventListener("click", () => { layout = DEFAULT_LAYOUT(); sizes = { list: 1, ai: 1, page: 1, photos: 1 }; try { localStorage.removeItem("mock-layout"); } catch {} mobilePanel = null; renderLayout(); toast("パネルの配置を既定に戻しました"); });

/* ===== 画面の切替（mock 用） ===== */
const STATES = {
  rec: () => open("r1"),
  transcribing: () => open("t2"),
  transcript: () => open("t1"),
  step: () => open("s3a"),
  two: () => open("s3b"),
  plan2: () => open("s2b"),
  split: () => openSplit("s3a", "s3b"),
  tabs: () => open("w1b"),
  folder: () => open("f1"),
  wrap: () => open("r9"),
};
function go(name) {
  closeMenus();
  state = STATES[name] ? name : "rec";
  STATES[state]();
  $$("#sw button[data-state]").forEach((b) => b.classList.toggle("on", b.dataset.state === state));
  history.replaceState(null, "", "?state=" + state);
}

document.addEventListener("click", (e) => {
  const st = e.target.closest("[data-state]");
  if (st) { go(st.dataset.state); return; }
  const o = e.target.closest("[data-open]");
  if (o) { closeMenus(); open(o.dataset.open); return; }
  const sp = e.target.closest("[data-split]");
  if (sp) { closeMenus(); openSplit(curTab, sp.dataset.split); return; }
  const mk = e.target.closest("[data-make]");
  if (mk) {
    const t = BY.get(curTab); closeMenus();
    const [what, arg] = mk.dataset.make.split(":");
    if (what === "tx") makeTranscript(arg);
    else if (what === "step") makeChain(t, +arg);
    else if (what === "sibling") makeSibling(t);
    else if (what === "tab") makeTab(false);
    else if (what === "dup") makeTab(true);
    return;
  }
  const rn = e.target.closest("[data-rename]");
  if (rn) { closeMenus(); renameTab(rn.dataset.rename); return; }
  const c = e.target.closest("[data-close]");
  if (c) $("#" + c.dataset.close).classList.remove("open");
  const t = e.target.closest("[data-toast]");
  if (t && !e.target.closest("[data-del]")) { e.preventDefault(); toast(t.dataset.toast); closeMenus(); }
});

/* この録音について: 畳む・開く */
document.addEventListener("click", (e) => {
  const hd = e.target.closest(".ri-hd");
  if (!hd) return;
  const box = hd.closest(".recinfo");
  box.classList.toggle("closed");
  hd.setAttribute("aria-expanded", String(!box.classList.contains("closed")));
});
document.addEventListener("click", (e) => {
  const b = e.target.closest(".seg button");
  if (!b) return;
  $$("button", b.parentElement).forEach((x) => { x.classList.toggle("on", x === b); x.toggleAttribute("aria-pressed", x === b); });
});

/* ===== メニュー ===== */
function closeMenus() {
  $$(".menu.open").forEach((m) => m.classList.remove("open"));
  $$("[data-menu].on").forEach((b) => { b.classList.remove("on"); b.setAttribute("aria-expanded", "false"); });
  $$(".row.menu-on").forEach((r) => r.classList.remove("menu-on"));
}
function placeMenu(m, x, y) {
  m.classList.add("open");
  const w = m.offsetWidth || 230, h = m.offsetHeight || 160;
  m.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + "px";
  m.style.top = Math.max(8, Math.min(y, window.innerHeight - h - 8)) + "px";
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-menu]");
  if (!b) return;
  e.stopPropagation();
  const name = b.dataset.menu;
  const m = $("#menu-" + name);
  const was = m.classList.contains("open");
  closeMenus();
  if (was) return;
  if (MENUS[name]) m.innerHTML = MENUS[name]();
  b.classList.add("on"); b.setAttribute("aria-expanded", "true");
  if (m.classList.contains("at")) { const r = b.getBoundingClientRect(); placeMenu(m, Math.min(r.left, window.innerWidth - 240), r.bottom + 4); }
  else m.classList.add("open");
}, true);
document.addEventListener("click", (e) => { if (!e.target.closest(".menu") && !e.target.closest("[data-menu]")) closeMenus(); }, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeMenus(); $$(".veil.open").forEach((v) => v.classList.remove("open")); } });

/* 行: 押すと開く。▾ で開閉。「…」と右クリックでメニュー */
function openRowMenu(row, x, y) {
  closeMenus();
  const n = BY.get(row.dataset.id);
  row.classList.add("menu-on");
  const m = $("#menu-row");
  m.innerHTML = n.kind === "folder"
    ? `<button data-toast="このフォルダに空のページを作ります（モック）">${svg("plus")}中に新しいページ</button><button data-toast="フォルダの中を .zip に書き出します（モック）">${svg("doc")}書き出し<small>.zip</small></button><hr><button class="danger" data-del="${n.id}">${svg("trash")}削除<small>中のページも</small></button>`
    : `<button data-toast="並べて開く相手を選びます（モック）">${svg("cols")}右に並べて開く…</button><button data-toast="移動（モック）">${svg("move")}移動…</button><hr><button class="danger" data-del="${n.id}">${svg("trash")}削除<small>ゴミ箱に 30 日</small></button>`;
  placeMenu(m, x, y);
}
$("#list").addEventListener("click", (e) => {
  const row = e.target.closest(".row");
  if (!row) return;
  const tw = e.target.closest(".tw");
  if (tw) { e.stopPropagation(); const n = BY.get(row.dataset.id); n.open = n.open === false; renderList(); return; }
  const more = e.target.closest(".more");
  if (more) { e.stopPropagation(); const r = more.getBoundingClientRect(); openRowMenu(row, r.left, r.bottom + 4); return; }
  open(row.dataset.id);
});
$("#list").addEventListener("contextmenu", (e) => { const row = e.target.closest(".row"); if (!row) return; e.preventDefault(); openRowMenu(row, e.clientX, e.clientY); });

/* 削除の確認（ページ・タブ・フォルダ） */
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-del]");
  if (!d) return;
  e.stopPropagation();
  const n = BY.get(d.dataset.del);
  closeMenus();
  let h, ps = [];
  if (n.kind === "folder") { h = `「${n.t}」と中の ${kidsOf(n).length} ページを削除しますか？`; }
  else if (isTab(n)) { h = `タブ「${tl(n)}」を削除しますか？`; if (madeHere(n).length) ps.push("このタブから作ったものは残ります。"); }
  else {
    h = `「${n.t}」を削除しますか？`;
    const ts = tabsOf(n);
    if (ts.length > 1) ps.push(`${ts.length} つのタブも消えます。`);
    if (n.role === "rec") ps.push("文字起こしのページは残ります（再生はできなくなります）。");
    else if (ts.some((t) => madeHere(t).length)) ps.push("このページから作ったものは残ります。");
  }
  ps.push("ゴミ箱に 30 日残ります。");
  $("#del-h").textContent = h;
  $("#del-p").textContent = ps.join("");
  $("#veil-del").classList.add("open");
  $("#del-ok").onclick = () => { $("#veil-del").classList.remove("open"); remove(n); toast("ゴミ箱に入れました（30 日で消えます）"); };
});
$$(".veil").forEach((v) => v.addEventListener("click", (e) => { if (e.target === v) v.classList.remove("open"); }));

/* 検索（見た目だけ）・スマホ・字数 */
$("#btn-search").addEventListener("click", () => toast("検索（モック）"));
const ws = $("#ws");
$("#btn-list").addEventListener("click", () => { mobilePanel = null; renderLayout(); ws.dataset.screen = "list"; });
function onMq() { $("#btn-list").hidden = !mq.matches; renderLayout(); }
mq.addEventListener("change", onMq);
$("#count").addEventListener("click", () => showPanel("page"));

let tt;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2200); }

/* ===== URL の指定（確認用） ===== */
const q = new URLSearchParams(location.search);
loadLayout();
onMq();
renderThread();
go(q.get("state") || "rec");
if (q.get("screen")) ws.dataset.screen = q.get("screen");
if (q.get("layout") === "default") { layout = DEFAULT_LAYOUT(); renderLayout(); }
</script>
