<!doctype html>
<!--
  mock: フォルダ › ページ › タブ。本文はタブにある。機能（文字起こし・手順の段階）はページとタブを作る v1（PC と 320px）。Issue #288
  土台: docs/mockups/editor-folders-v1.html（フォルダ・この録音について）。色は :root の仮値（hex）。実装では packages/ui の token を引く。

  決めたこと（オーナー 2026-11-06。#288）:
    - 「案」という語も概念も置かない。あるのは フォルダ › ページ › タブ の 3 つ。
    - 本文はタブにある。タブが 1 つだけのページは、今までのページと同じに見える（タブの帯は出ない）。どのページでもタブを足せる。
    - 機能の出力はフォルダの中へ。同じ役割のページがあればそのページに**タブ**が増え、無ければページができる（文字起こし › Gemini · Deepgram、記事本文 › 1 · 2）。
    - 手順（AI の生成・整理）はどのページ・タブにも当てられる。入力は「今見ているタブ」。
    - ページ名の下に帯を置かない。系譜・作り直す・もう 1 つ作る・ここから続きを作る は右の「ページの情報」。工程の全体はフォルダの画面。
    - 比べる＝並べて開く（分割ビュー）。差分は出さない。要らないタブ・ページ＝ゴミ箱。
    - フォルダの外の録音で「文字起こしする」を押したら、録音の題名でフォルダを作って中に入れる。

  このモックで見せたいこと:
    1. 録音ページ: 録音ブロック・「この録音について」・見出し「文字起こし」の下にタブの一覧と「文字起こしする ▾」（エンジン）。
    2. 文字起こしページ: 上部に Gemini · Deepgram のタブ。再生バー（元の録音の音声）・話者と時刻つきの本文・「記事にする ▾」。
    3. 記事本文: タブが 1 つなら帯も何も無いふつうのページ。2 つになると上部にタブ（1 · 2）。
    4. 右の「ページの情報」: 役割・何から作られたか・ここから作ったもの・タブ・字数と、作り直す／もう 1 つ作る／ここから続きを作る。
    5. 記事方針のタブ 2: 「ここから続きを作る」で、この方針から記事本文のタブができる。
    6. ふつうのページ（コラム）のタブ: 下書き · 英語版。役割が無くても「ここから作る ▾」で手順を当てられる。
    7. フォルダを開いた画面: 流れ（録音 › 文字起こし 2 › 文字起こし修正 › 記事方針 2 › 記事本文）と中身の一覧。
    8. フォルダの外の録音: 「文字起こしする」を押すとフォルダができて中に入る（押して確かめる）。

  見かた:
    - 上の黒い帯は mock 用。本物には無い。帯のボタンか ?state=rec|transcribing|transcript|step|two|plan2|split|tabs|folder|wrap で状態を開ける。
    - 一覧の行を押すとそのページ（最後に見たタブ）。タブを押すと切り替え。右上の ⓘ で「ページの情報」、パネルの AI と切り替わる。
    - 幅 720px 以下はスマホの並び（一覧がはじめの画面。ページは全画面で、左上のボタンで一覧へ。ページの情報は全画面。並べて開くは縦に積む）。

  作っていない:
    - 本文の保存・公開・AI の送信・検索・ドラッグ・並べ替え・削除の実行は見た目だけ（押すと右上に一言）。
    - 音声の再生・文字起こしの実行・段階の実行は動かない（「文字起こしする」「記事にする」「もう 1 つ作る」「ここから続きを作る」「タブを足す」は
      タブやページを 1 つ足して開くだけ）。波形は飾り。
    - 版の履歴・公開のシート・AI の返答は出していない。
  参照: Issue #288 / docs/architecture/editor-recipes-and-folders.md §3 / docs/mockups/editor-folders-v1.html（土台）/
        docs/mockups/editor-transcript-candidates-v1.html（採らない形）
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NIHO editor フォルダ › ページ › タブ v1</title>
<style>
:root{
  --ink:#2a2a26;--ink2:#54544d;--mute:#6e6d66;--faint:#898880;
  --white:#fff;--canvas:#fffdfa;--shell:#fcfaf5;--sand:#f7f7f4;--sand2:#f5f3ee;
  --line:#f1f1ed;--line2:#e7e7e2;--line3:#dbdbd5;--track:#f2efe8;
  --moss:#56751e;--pale:#EEF6E1;--leaf:#B2D67C;--deep:#63A109;
  --grad:linear-gradient(140deg,#7DBA3A 0%,#63A109 100%);--grad-h:linear-gradient(140deg,#74B033 0%,#5C9508 100%);
  --amber:#C8713A;--amber-ink:#a55827;--amber-pale:#FAF0E6;
  --red:#B42318;--red-pale:#fdebec;
  --sans:"Hiragino Maru Gothic ProN","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
  --sbw:252px;--aiw:320px;--bar:40px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:14px/1.6 var(--sans);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
b,strong{font-weight:600}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
kbd{font:12px var(--mono);color:var(--faint)}

/* ===== 共通の部品 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 15px;border-radius:999px;background:var(--grad);color:#fff;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--grad-h)}
.btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line3)}
.btn.line:hover{background:var(--sand);box-shadow:inset 0 0 0 1.5px var(--line3)}
.btn.quiet{background:none;color:var(--ink2)}
.btn.quiet:hover{background:var(--sand)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn .ico{width:15px;height:15px}
.btn .ico.dn{width:13px;height:13px;margin-left:-2px}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none;position:relative}
.ib:hover,.ib.on{background:var(--sand2);color:var(--ink)}
.ib[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:60}
.ib[data-tip]:hover::after,.ib[data-tip]:focus-visible::after{opacity:1}
.ib[data-tip].tip-l::after{left:0;transform:none}
.ib[data-tip].tip-r::after{left:auto;right:0;transform:none}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:50;min-width:210px;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 36px rgba(28,28,26,.12);padding:6px;display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;font-size:13.5px;color:var(--ink)}
.menu button:hover{background:var(--sand)}
.menu button .ico{width:16px;height:16px;color:var(--ink2)}
.menu button small{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap}
.menu button.danger{color:var(--red)}
.menu button.danger .ico{color:var(--red)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu .hd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mute);padding:4px 10px 6px}
.menu .hd .ico{width:14px;height:14px}
.menu.at{position:fixed;top:0;left:0;right:auto;z-index:130}
.newwrap{position:relative;display:inline-grid}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;color:var(--faint);background:var(--sand2);white-space:nowrap;flex:none}
.tag.ok{color:var(--moss);background:var(--pale)}
.tag.no{color:var(--amber-ink);background:var(--amber-pale)}
.tag .ico{width:12px;height:12px}
.toast{position:fixed;top:52px;right:16px;z-index:140;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(28,28,26,.2);opacity:0;transition:opacity .15s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.seg{display:inline-flex;background:var(--sand2);border-radius:999px;padding:3px;flex:none;max-width:100%}
.seg button{height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--moss);box-shadow:0 1px 2px rgba(28,28,26,.08)}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{width:12px;height:12px;border:2px solid var(--leaf);border-top-color:var(--deep);border-radius:50%;animation:sp 1s linear infinite;flex:none;display:inline-block;vertical-align:-1px}
.none{color:var(--faint)}

/* ===== mock bar（本物には無い） ===== */
.mock{position:sticky;top:0;z-index:100;overflow:hidden;display:flex;align-items:center;gap:10px;height:var(--bar);padding:0 12px;background:#141413;color:#fff;font-size:12.5px}
.mock .url{flex:1;min-width:0;background:rgba(255,255,255,.08);border-radius:8px;padding:4px 10px;font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mock .url b{color:#fff;font-weight:600}
.mock .sw{display:flex;align-items:center;gap:6px;overflow:auto}
.mock .sw button{height:24px;padding:0 10px;border-radius:999px;color:rgba(255,255,255,.75);font-weight:600;font-size:12px;border:1px solid rgba(255,255,255,.18);white-space:nowrap;flex:none}
.mock .sw button.on{background:#fff;color:#141413;border-color:#fff}
@media (max-width:820px){.mock .url{display:none}}

/* ===== shell ===== */
.ws{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:calc(100vh - var(--bar))}
.ws.nosb{grid-template-columns:minmax(0,1fr)}
.ws.nosb .sb{display:none}
.sb{position:sticky;top:var(--bar);height:calc(100vh - var(--bar));display:flex;flex-direction:column;background:var(--shell);border-right:1px solid var(--line);min-width:0}
.sb-top{display:flex;align-items:center;gap:2px;height:52px;padding:10px 8px 6px 12px;flex:none}
.brand{display:flex;align-items:center;gap:7px;min-width:0;flex:1;font-weight:600;font-size:14px;letter-spacing:.01em;color:var(--ink);padding:3px 6px 3px 2px;border-radius:8px;white-space:nowrap}
.brand .logo{width:22px;height:22px;flex:none;border-radius:6px;box-shadow:0 1px 2px rgba(28,28,26,.14)}
.sb-top .ib{width:30px;height:30px;color:var(--mute)}
.sb-top .ib:hover,.sb-top .ib.on{color:var(--ink)}
.sb-top .ib .ico{width:17px;height:17px}
.sb-list{flex:1;min-height:0;overflow:auto;padding:4px 8px 10px}

/* 一覧の行: フォルダ › ページ の 2 段。タブは行にしない（2 つ以上なら数だけ） */
.row{position:relative;display:flex;align-items:center;gap:6px;min-height:34px;padding:4px 4px 4px calc(8px + var(--d,0) * 16px);border-radius:8px;cursor:pointer;user-select:none;flex-wrap:wrap}
.row:hover{background:var(--sand2)}
.row.on{background:#fff;box-shadow:0 1px 2px rgba(28,28,26,.06),0 0 0 1px var(--line)}
.row b{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-size:12px;color:var(--faint);white-space:nowrap;width:40px;text-align:right}
.row .n{font-size:12px;font-weight:600;color:var(--moss);background:var(--pale);border-radius:999px;padding:0 6px;line-height:18px;flex:none}
.row .sub{flex-basis:100%;font-size:12px;color:var(--mute);margin-top:-2px;padding:0 0 2px 22px;display:flex;align-items:center;gap:6px}
.row .tw{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--faint);flex:none}
.row .tw:hover{background:var(--line2);color:var(--ink)}
.row .tw .ico{width:14px;height:14px;transition:transform .12s}
.row.closed .tw .ico{transform:rotate(-90deg)}
.row .tw.none{visibility:hidden}
.row .ki{width:17px;height:17px;flex:none;color:var(--ink2)}
.row.folder b{font-weight:600}
.row.step .ki{width:13px;height:13px;color:var(--faint)}
.row.transcript .ki{width:15px;height:15px;color:var(--mute)}
.row .more{width:24px;height:24px;border-radius:6px;display:none;place-items:center;color:var(--faint);flex:none}
.row .more .ico{width:16px;height:16px}
.row .more:hover,.row .more.on{background:var(--line2);color:var(--ink)}
.row:hover .when,.row.menu-on .when{display:none}
.row:hover .more,.row.menu-on .more{display:grid}
.row:hover .more{margin-left:16px}
.row.menu-on .more{margin-left:16px;background:var(--line2);color:var(--ink)}
@media (hover:none){.row .when{display:none}.row .more{display:grid}.ib[data-tip]::after{display:none}}

.sb-foot{border-top:1px solid var(--line);padding:8px 10px;flex:none}
.sb-set{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink2);text-decoration:none}
.sb-set:hover{background:var(--sand2);color:var(--ink)}
.sb-set .ico{width:18px;height:18px;color:var(--mute)}

/* ===== ページ ===== */
.doc{position:relative;display:flex;flex-direction:column;min-width:0;min-height:calc(100vh - var(--bar))}
.dt{position:sticky;top:var(--bar);z-index:20;display:flex;align-items:center;gap:2px;height:52px;padding:0 10px 0 8px;background:var(--canvas)}
.dt .brand{flex:none;margin-right:4px}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;margin:0 4px;font-size:13px;color:var(--mute)}
.crumbs button{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:22vw;padding:3px 7px;border-radius:7px;color:var(--mute)}
.crumbs button:hover{background:var(--sand);color:var(--ink)}
.crumbs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs i{color:var(--line3);font-style:normal;flex:none}
.crumbs .ico{width:14px;height:14px}
.loc{display:none}
.dt .ins{display:flex;align-items:center;gap:2px;margin-left:6px;padding-left:10px;border-left:1px solid var(--line2)}
.dt .ins .ib{color:var(--faint)}
.dt .ins .ib:hover{color:var(--ink)}
.pubbtn{height:30px;padding:0 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.pubbtn:hover{background:var(--sand)}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) 0;flex:1;transition:grid-template-columns .2s}
.dbody.open{grid-template-columns:minmax(0,1fr) var(--aiw)}
.canvas{padding:44px 56px 140px;min-width:0}
.canvas .in{max-width:680px;margin:auto}
.tt{font-weight:600;font-size:32px;line-height:1.25;letter-spacing:-.01em;min-height:1.25em;outline:none}
.tt.fh{display:flex;align-items:center;gap:12px}
.tt.fh .ico{width:30px;height:30px;color:var(--ink2);stroke-width:1.5}
.bd{font-size:16px;line-height:1.95;margin-top:14px;min-height:30vh;outline:none}
.bd h2{font-size:20px;margin:26px 0 6px}
.bd p+p{margin-top:10px}
.bd ol{list-style:decimal;padding-left:1.5em}
.ph:empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.count{position:fixed;right:18px;bottom:14px;z-index:15;font-size:12px;color:var(--faint);padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--canvas) 85%,transparent)}
.count:hover{color:var(--ink);background:var(--sand2)}
.dbody.open .count{right:calc(var(--aiw) + 18px)}
.runnote{display:flex;align-items:center;gap:8px;margin-top:14px;padding:8px 12px;border-radius:10px;background:var(--pale);color:var(--moss);font-size:13px;font-weight:600}

/* タブ（中央レールの上部。ページにタブが 2 つ以上あるときだけ出る） */
.tabs{display:flex;align-items:flex-end;gap:2px;margin:-18px 0 18px;border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .tb{display:flex;align-items:flex-end;flex:none;position:relative}
.tabs [role=tab]{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;margin-bottom:-1px;border-bottom:2px solid transparent;border-radius:8px 8px 0 0;font-size:13.5px;font-weight:600;color:var(--mute);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.tabs [role=tab]:hover{background:var(--sand);color:var(--ink)}
.tabs [role=tab][aria-selected=true]{color:var(--ink);border-bottom-color:var(--moss)}
.tabs .tm{width:22px;height:36px;margin:0 0 -1px -8px;display:none;place-items:center;color:var(--faint);border-radius:8px 8px 0 0;border-bottom:2px solid var(--moss)}
.tabs .tm .ico{width:13px;height:13px}
.tabs .tb.on .tm{display:grid}
.tabs .tm:hover{color:var(--ink);background:var(--sand)}
.tabs .add{width:34px;height:36px;margin-bottom:-1px;display:grid;place-items:center;color:var(--faint);flex:none;border-radius:8px 8px 0 0}
.tabs .add:hover{background:var(--sand);color:var(--ink)}
.tabs .add .ico{width:16px;height:16px}

/* 録音ブロック */
.recblk{display:flex;align-items:center;gap:12px;margin-top:18px;padding:10px 12px;border-radius:12px;background:var(--sand);flex-wrap:wrap}
.recblk .src{flex-basis:100%;font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:6px;margin-top:-2px}
.recblk .src button{color:var(--ink2);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.recblk .src button:hover{text-decoration:underline}
.recblk .src .ico{width:13px;height:13px}
.play{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.play .ico{width:16px;height:16px;fill:#fff;stroke:none;margin-left:2px}
.wave{flex:1;min-width:120px;height:26px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--line3) 0 2px,transparent 2px 5px);mask:linear-gradient(90deg,#000 0 55%,rgba(0,0,0,.35) 55%)}
.time{font:12px var(--mono);color:var(--mute);white-space:nowrap}

/* この録音について（録音ブロックの直下。畳める） */
.recinfo{margin-top:10px;border:1px solid var(--line2);border-radius:12px;background:#fff}
.ri-hd{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;font-size:13px;border-radius:12px}
.ri-hd:hover{background:var(--sand)}
.ri-hd b{font-weight:600;white-space:nowrap}
.ri-hd .ico.mic{color:var(--ink2)}
.ri-hd .sum{flex:1;min-width:0;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri-hd .chev{width:16px;height:16px;color:var(--faint);transition:transform .12s}
.recinfo.closed .ri-hd .chev{transform:rotate(-90deg)}
.recinfo:not(.closed) .ri-hd .sum{visibility:hidden}
.recinfo.closed .ri-body{display:none}
.ri-body{border-top:1px solid var(--line);padding:2px 12px 8px}
.ri-r{display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px 12px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.ri-r:first-child{border-top:0}
.ri-r label{font-size:12.5px;font-weight:600;color:var(--ink2);padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;height:27px;padding:0 4px 0 10px;border-radius:999px;background:var(--sand2);font-size:12.5px;max-width:100%}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{color:var(--faint);font-size:12px;white-space:nowrap}
.chip .x{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:var(--faint);flex:none}
.chip .x:hover{background:var(--line2);color:var(--ink)}
.chip .x .ico{width:11px;height:11px;stroke-width:2.2}
.chip.add{background:none;color:var(--moss);font-weight:600;padding:0 9px;box-shadow:inset 0 0 0 1px var(--line2)}
.chip.add:hover{background:var(--pale)}
.chip.add .ico{width:13px;height:13px;stroke-width:2.2}
.chips .tag{height:27px;padding:0 9px}
.ri-r textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:13px;line-height:1.6;resize:vertical;min-height:58px;background:#fff;outline:none;display:block}
.ri-r textarea:focus{border-color:var(--leaf)}
.ri-r textarea::placeholder{color:var(--faint)}

/* 録音ページの「文字起こし」: 文字起こしページのタブの一覧 ＋「文字起こしする ▾」 */
.txhd{display:flex;align-items:center;gap:8px;margin-top:28px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.txhd h2{font-size:14px;font-weight:600;color:var(--ink2);margin-right:2px}
.txhd .btn{margin-left:auto;height:28px;padding:0 11px;font-size:12.5px}
.txlist{margin-top:8px}
.txlist li{display:flex;align-items:center;gap:10px;min-height:42px;padding:6px 10px;border-radius:10px;cursor:pointer}
.txlist li:hover{background:var(--sand)}
.txlist li .ki{width:16px;height:16px;color:var(--mute)}
.txlist li .t{flex:1;min-width:0}
.txlist li .t b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txlist li .t small{display:block;font-size:12.5px;color:var(--mute)}
.txlist li .when{font-size:12px;color:var(--faint);white-space:nowrap}
.txlist li .ico.chev{width:14px;height:14px;color:var(--line3)}
.txempty{margin-top:10px;padding:26px 16px;border:1px dashed var(--line3);border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.txempty small{color:var(--faint);font-size:12.5px}

/* 文字起こしページの本文 */
.txmeta{display:flex;align-items:center;gap:8px;margin-top:22px;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.txmeta .btn{height:28px;padding:0 10px;font-size:12.5px}
.txmeta .btn.quiet{margin-left:auto}
.tx{margin-top:10px;font-size:15.5px;line-height:1.9}
.tx p{padding:6px 0}
.tx .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);line-height:1.4;margin-bottom:1px}
.tx .meta b{color:var(--ink2);font-size:12.5px}
.tx .meta small{font:12px var(--mono);color:var(--faint)}
.tx .meta button{font:12px var(--mono);color:var(--faint)}
.tx .meta button:hover{color:var(--moss)}

/* フォルダを開いた画面: 流れ ＋ 中身の一覧 */
.facts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.flow{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin-top:22px;font-size:13px}
.flow li{display:flex;align-items:center}
.flow li+li::before{content:"›";color:var(--faint);font-size:15px;margin:0 6px}
.flow li button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--sand);font-weight:600;color:var(--ink2);white-space:nowrap}
.flow li button:hover{background:var(--sand2);color:var(--ink)}
.flow li button .n{font-size:12px;color:var(--moss);background:var(--pale);border-radius:999px;padding:0 6px;line-height:18px}
.flow li .none{padding:0 4px;font-weight:500}
.frows{margin-top:14px;border:1px solid var(--line2);border-radius:14px;background:#fff}
.frows li{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer}
.frows li:first-child{border-top:0;border-radius:13px 13px 0 0}
.frows li:last-child{border-radius:0 0 13px 13px}
.frows li:hover{background:var(--sand)}
.frows li .ki{width:17px;height:17px;color:var(--ink2)}
.frows li.step .ki{width:13px;height:13px;color:var(--faint)}
.frows li.transcript .ki{width:15px;height:15px;color:var(--mute)}
.frows li .t{flex:1;min-width:0}
.frows li .t b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frows li .t small{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frows li .when{font-size:12px;color:var(--faint);white-space:nowrap}
.empty{margin-top:28px;padding:36px 16px;border:1px dashed var(--line3);border-radius:14px;text-align:center;color:var(--faint);font-size:13.5px}

/* 並べて開く（分割ビュー） */
.canvas.wide .in{max-width:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.cols>section{min-width:0;border-left:1px solid var(--line);padding-left:24px}
.cols>section:first-child{border-left:0;padding-left:0}
.cols .ch{display:flex;align-items:center;gap:6px;margin:-20px 0 10px;font-size:12.5px;color:var(--faint)}
.cols .ch .ib{width:26px;height:26px;margin-left:auto}
.cols .tt{font-size:24px}
.cols .bd{font-size:15px;min-height:0}
.cols .tabs{display:none}

/* 右: AI ／ ページの情報（どちらか 1 つ） */
.ai,.info{position:sticky;top:calc(var(--bar) + 52px);align-self:start;height:calc(100vh - var(--bar) - 52px);border-left:1px solid var(--line);background:var(--canvas);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ai .hd,.info .hd{display:flex;align-items:center;gap:2px;height:40px;padding:0 8px 0 16px;font-size:13px;font-weight:600;flex:none}
.ai .hd span,.info .hd span{flex:1}
.thread{flex:1;overflow:auto;padding:4px 16px}
.ctx{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:0 14px 8px;font-size:12px;color:var(--faint)}
.ctx .tag{font-weight:500;color:var(--mute);background:var(--sand)}
.ctx .tag .ico{color:var(--faint)}
.composer{padding:0 12px 12px;flex:none}
.composer .box{border:1px solid var(--line2);border-radius:14px;background:#fff;padding:9px 10px 7px}
.composer textarea{width:100%;border:0;outline:none;resize:none;font-size:13.5px;line-height:1.6;min-height:48px;background:none;padding:0 2px;display:block}
.composer textarea::placeholder{color:var(--faint)}
.composer .foot{display:flex;align-items:center;gap:4px;margin-top:4px}
.composer .foot .ib{width:28px;height:28px;color:var(--faint)}
.send{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin-left:auto}
.send .ico{width:15px;height:15px;stroke-width:2.2}
.ibody{flex:1;overflow:auto;padding:0 16px 16px;font-size:13px}
.ir{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.ir:first-child{border-top:0}
.ir dt{font-size:12px;font-weight:600;color:var(--mute);padding-top:3px}
.ir dd{min-width:0;color:var(--ink);line-height:1.65}
.lk{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;margin-left:-6px;border-radius:6px;color:var(--ink2);font-weight:500;max-width:100%}
.lk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk+.lk{margin-left:0}
.lk:hover{background:var(--sand);color:var(--ink)}
.lk.cur{color:var(--ink);font-weight:600;background:var(--sand);box-shadow:inset 0 0 0 1px var(--line3)}
.lk.add{color:var(--moss);font-weight:600}
.lk .ico{width:13px;height:13px;color:var(--moss);stroke-width:2.2}
.sep{color:var(--line3);margin:0 3px}
.lineage{display:flex;flex-direction:column;gap:1px}
.lineage li{display:flex;align-items:center;gap:4px;min-width:0}
.lineage li+li::before{content:"↳";color:var(--line3);font-size:12px;flex:none}
.lineage li .cur{font-weight:600}
.iacts{display:flex;flex-wrap:wrap;gap:6px;padding-top:14px;border-top:1px solid var(--line)}
.iacts .btn.quiet{padding:0 10px;box-shadow:inset 0 0 0 1px var(--line2)}

/* ===== シート（削除） ===== */
.veil{position:fixed;inset:0;z-index:110;background:rgba(28,28,26,.28);display:none;align-items:center;justify-content:center;padding:16px}
.veil.open{display:flex}
.sheet{width:min(440px,100%);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(28,28,26,.24);padding:22px 22px 18px}
.sheet h2{font-size:17px;font-weight:600;margin-bottom:8px}
.sheet p{font-size:13.5px;color:var(--ink2)}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* ===== スマホ（720px 以下） ===== */
@media (max-width:720px){
  .ws,.ws.nosb{grid-template-columns:minmax(0,1fr)}
  .sb{position:static;height:auto;min-height:calc(100vh - var(--bar));border-right:0}
  .ws[data-screen="page"] .sb{display:none}
  .ws[data-screen="list"] .doc{display:none}
  .sb-top{padding-left:10px}
  #btn-collapse{display:none}
  .dt .brand{display:none}
  .dt .ins{margin-left:0;padding-left:6px}
  .dt .crumbs{display:none}
  .loc{display:flex;flex-wrap:wrap;margin:0 auto 4px;min-height:0}
  .loc:empty{display:none}
  .loc button{max-width:60vw;margin-left:-7px}
  .loc button+i{margin-left:0}
  .dbody,.dbody.open{grid-template-columns:minmax(0,1fr)}
  .ai{display:none}
  .info{position:fixed;top:var(--bar);left:0;right:0;bottom:0;height:auto;border-left:0;z-index:90}
  .canvas{padding:24px 16px 120px}
  .tt{font-size:25px}
  .tabs{margin:-6px -16px 14px;padding:0 10px}
  .tabs [role=tab]{max-width:none}
  .count,.dbody.open .count{right:12px}
  #aitoggle{display:none}
  .ri-r{grid-template-columns:minmax(0,1fr);gap:4px}
  .ri-r label{padding-top:0}
  .frows li .when,.txlist li .when{display:none}
  .cols{grid-template-columns:minmax(0,1fr);gap:20px}
  .cols>section{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}
  .cols>section:first-child{border-top:0;padding-top:0}
  .cols .ch{margin-top:0}
}
</style>
</head>
<body>

<div class="mock">
  <div class="url"><b>editor.niho.life</b><span id="url">/p/r1</span></div>
  <div class="sw" id="sw">
    <button data-state="rec" class="on">録音ページ</button>
    <button data-state="transcript">文字起こし</button>
    <button data-state="transcribing">2 つ目のタブを作成中</button>
    <button data-state="step">記事本文</button>
    <button data-state="two">記事本文のタブ 2</button>
    <button data-state="plan2">記事方針のタブ 2</button>
    <button data-state="split">並べて開く</button>
    <button data-state="tabs">ふつうのページのタブ</button>
    <button data-state="folder">フォルダ</button>
    <button data-state="wrap">フォルダの外の録音</button>
  </div>
</div>

<div class="ws" id="ws" data-screen="page">
  <!-- 左: 一覧（フォルダ › ページ。タブは行にしない） -->
  <aside class="sb" aria-label="ページ">
    <div class="sb-top" id="sbtop">
      <div class="brand" id="brand"></div>
      <button class="ib tip-r" id="btn-search" data-tip="検索 ⌘K" aria-label="検索（⌘K）"></button>
      <span class="newwrap">
        <button class="ib tip-r" id="btn-new" data-menu="new" data-tip="新しいページ ⌘N" aria-label="新しいページ（⌘N）" aria-haspopup="menu"></button>
        <div class="menu" id="menu-new" role="menu" aria-label="新しいページ"></div>
      </span>
      <button class="ib tip-r" id="btn-collapse" data-tip="一覧をしまう" aria-label="一覧をしまう"></button>
    </div>
    <ul class="sb-list" id="list" aria-label="ページの一覧"></ul>
    <div class="sb-foot">
      <a class="sb-set" href="#" data-toast="設定（モック）"><span id="gear"></span>設定</a>
    </div>
  </aside>

  <!-- 中央: ページ（タブ › 題名 › 本文）／フォルダ -->
  <main class="doc" id="doc">
    <header class="dt">
      <button class="ib tip-l" id="btn-expand" data-tip="一覧を出す" aria-label="一覧を出す" hidden></button>
      <button class="ib tip-l" id="btn-list" data-tip="一覧" aria-label="一覧へ" hidden></button>
      <div class="brand" id="brand-hd" hidden></div>
      <nav class="crumbs" id="crumbs" aria-label="場所"></nav>
      <div class="ins" id="ins">
        <button class="ib" data-tip="ブロック" aria-label="ブロックを挿入" data-toast="ブロックの一覧（モック）"><span data-ic="plus"></span></button>
        <button class="ib" data-tip="画像" aria-label="画像" data-toast="画像（モック）"><span data-ic="img"></span></button>
        <button class="ib" data-tip="録音" aria-label="録音" data-toast="録音（モック）"><span data-ic="mic"></span></button>
      </div>
      <span class="sp"></span>
      <button class="pubbtn" id="pubbtn" data-toast="公開のシート（モック）">公開</button>
      <button class="ib on" id="aitoggle" data-tip="AIと作る" aria-label="AIと作る" aria-pressed="true"><span data-ic="panel"></span></button>
      <button class="ib" id="infotoggle" data-tip="ページの情報" aria-label="ページの情報" aria-pressed="false"><span data-ic="info"></span></button>
      <span class="newwrap">
        <button class="ib tip-r" data-menu="dots" data-tip="その他" aria-label="その他"><span data-ic="more"></span></button>
        <div class="menu" id="menu-dots" role="menu" aria-label="ページのメニュー"></div>
      </span>
    </header>
    <div class="dbody open" id="dbody">
      <div class="canvas" id="cv"><nav class="in loc crumbs" id="loc" aria-label="場所"></nav><div class="in" id="canvas"></div></div>
      <aside class="ai" id="ai" aria-label="AIと作る">
        <div class="hd"><span>AIと作る</span>
          <button class="ib" data-tip="新しい会話" aria-label="新しい会話" data-toast="新しい会話（モック）"><span data-ic="edit"></span></button>
          <button class="ib tip-r" data-tip="会話の履歴" aria-label="会話の履歴" data-toast="会話の履歴（モック）"><span data-ic="more"></span></button>
        </div>
        <div class="thread"></div>
        <div class="ctx" id="ctx" aria-label="AI が読むもの"></div>
        <div class="composer">
          <div class="box">
            <textarea rows="2" placeholder="直したいこと・作りたいもの…" aria-label="AI への依頼"></textarea>
            <div class="foot">
              <button class="ib" data-tip="工程・スキル" aria-label="工程・スキル" data-toast="工程・スキル（モック）"><span data-ic="plus"></span></button>
              <button class="send" aria-label="送る" data-toast="送信（モック）"><span data-ic="up"></span></button>
            </div>
          </div>
        </div>
      </aside>
      <aside class="info" id="info" aria-label="ページの情報" hidden>
        <div class="hd"><span>ページの情報</span>
          <button class="ib tip-r" id="info-close" data-tip="閉じる" aria-label="閉じる"><span data-ic="x"></span></button>
        </div>
        <dl class="ibody" id="info-body"></dl>
      </aside>
      <button class="count" id="count" aria-label="字数。押すとページの情報">0 字</button>
    </div>
  </main>
</div>

<!-- 固定のメニュー（scroll する箱の中からでも出せるように、画面に対して置く） -->
<div class="menu at" id="menu-row" role="menu" aria-label="行のメニュー"></div>
<div class="menu at" id="menu-tab" role="menu" aria-label="タブのメニュー"></div>
<div class="menu at" id="menu-addtab" role="menu" aria-label="タブを足す"></div>
<div class="menu at" id="menu-start" role="menu" aria-label="手順"></div>
<div class="menu at" id="menu-tx" role="menu" aria-label="文字起こしのエンジン"></div>

<!-- 削除の確認 -->
<div class="veil" id="veil-del">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="del-h">
    <h2 id="del-h">削除しますか？</h2>
    <p id="del-p">ゴミ箱に 30 日残ります。</p>
    <div class="foot"><button class="btn line sm" data-close="veil-del">やめる</button><button class="btn danger sm" id="del-ok">削除</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
/* ===== アイコン（packages/docs-ui/src/shell/icons.tsx の写し ＋ フォルダ・✦・行・再生・✓・列・ⓘ） ===== */
const IC = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  chev: '<path d="m9.5 6 6 6-6 6"/>',
  down: '<path d="m6 9.5 6 6 6-6"/>',
  back: '<path d="m14.5 6-6 6 6 6"/>',

  mic: '<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M6 11.5a6 6 0 0 0 12 0M12 17.5v3"/>',

  trash: '<path d="M5 7h14M9 7V4.5h6V7M7 7l1 13h8l1-13"/>',

  cal: '<rect x="4" y="5.5" width="16" height="14" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',
  edit: '<path d="M4.5 19.5h4l10-10a2.8 2.8 0 0 0-4-4l-10 10z"/><path d="m13 7 4 4M4.5 19.5l1-4"/>',
  move: '<path d="M4 12h16M13 5l7 7-7 7"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  redo: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',

  tab: '<rect x="3.5" y="5.5" width="17" height="14" rx="2.5"/><path d="M3.5 10h17M10 5.5V10"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
};

/* ===== 木（合成データ）: フォルダ › ページ › タブ。本文はタブにある。
   ページは role（"rec"／"transcript"／段階の番号／無し）を持ち、タブは from（何から作られたか）を持つ ===== */
const RECIPE = { name: "記事制作", steps: ["文字起こし修正", "記事方針", "記事本文"] };
const TREE = [
  { id: "f1", kind: "folder", t: "鎌倉の朝の散歩", open: true, children: [
    { id: "r1", kind: "page", role: "rec", t: "取材 11/3 北鎌倉", when: "2日前", tabs: [{ id: "r1a", when: "2日前" }] },
    { id: "tx1", kind: "page", role: "transcript", t: "文字起こし", when: "2日前", tabs: [
      { id: "t1", t: "Gemini", engine: "Gemini", from: "r1a", when: "2日前" },
      { id: "t2", t: "Deepgram", engine: "Deepgram", from: "r1a", when: "今", st: "run", only: ["transcribing"] },
    ] },
    { id: "s1", kind: "page", role: 0, t: "文字起こし修正", when: "2日前", tabs: [{ id: "s1a", from: "t1", when: "2日前" }] },
    { id: "s2", kind: "page", role: 1, t: "記事方針", when: "2日前", tabs: [
      { id: "s2a", t: "1", from: "s1a", when: "2日前" },
      { id: "s2b", t: "2", from: "s1a", when: "今", only: ["plan2", "folder"] },
    ] },
    { id: "s3", kind: "page", role: 2, t: "記事本文", when: "昨日", tabs: [
      { id: "s3a", t: "1", from: "s2a", when: "昨日" },
      { id: "s3b", t: "2", from: "s2a", when: "今", only: ["two", "split", "folder"] },
    ] },
    { id: "d1", kind: "page", t: "散歩コースのメモ", when: "3日前", tabs: [{ id: "d1a", when: "3日前" }] },
    { id: "d2", kind: "page", t: "円覚寺の資料", when: "3日前", tabs: [{ id: "d2a", when: "3日前" }] },
  ] },
  { id: "f2", kind: "folder", t: "コラム執筆", open: true, children: [
    { id: "w1", kind: "page", t: "冬の鎌倉、海辺の朝", when: "昨日", tabs: [{ id: "w1a", t: "下書き", when: "昨日" }, { id: "w1b", t: "英語版", when: "今", only: ["tabs"] }] },
    { id: "w2", kind: "page", t: "文体のメモ", when: "4日前", tabs: [{ id: "w2a", when: "4日前" }] },
  ] },
  { id: "r9", kind: "page", role: "rec", t: "取材 11/5 材木座", when: "今日", tabs: [{ id: "r9a", when: "今日" }] },
  { id: "p2", kind: "page", t: "鎌倉大好き", when: "昨日", tabs: [{ id: "p2a", when: "昨日" }] },
  { id: "p4", kind: "page", t: "合成記事：鎌倉の朝の散歩", when: "2日前", pub: "NIHO", tabs: [{ id: "p4a", when: "2日前" }] },
];
const BY = new Map();
function index() {
  BY.clear();
  (function walk(nodes, parent) {
    for (const n of nodes) {
      n.parent = parent; BY.set(n.id, n);
      if (n.children) walk(n.children, n);
      if (n.tabs) for (const t of n.tabs) { t.page = n; BY.set(t.id, t); }
    }
  })(TREE, null);
}
index();

let state = "rec";
let curPage = "r1", curTab = "r1a";
let rail = "ai"; /* "ai" | "info" | null */
const shown = (n) => !n.only || n.only.includes(state);
const isTab = (n) => !!n.page;
const pageOf = (n) => (n.page ? n.page : n);
const folderOf = (n) => { const p = pageOf(n); return p.kind === "folder" ? p : p.parent && p.parent.kind === "folder" ? p.parent : null; };
const kidsOf = (f) => (f.children ?? []).filter(shown);
const tabsOf = (p) => (p.tabs ?? []).filter(shown);
const allPages = () => { const out = []; (function walk(ns) { for (const n of ns) { if (n.kind === "folder") walk(kidsOf(n)); else out.push(n); } })(TREE); return out; };
/* フォルダの中の並び: 録音 › 文字起こし › 段階の順 › ほかのページ */
const roleOrder = (p) => (p.role === "rec" ? 0 : p.role === "transcript" ? 1 : typeof p.role === "number" ? 2 + p.role : 99);
const sorted = (kids) => [...kids].sort((a, b) => roleOrder(a) - roleOrder(b));
const kindOf = (p) => (p.role === "rec" ? "rec" : p.role === "transcript" ? "transcript" : typeof p.role === "number" ? "step" : "note");
const tl = (t) => t.t ?? "1";
const roleSay = (p) => (p.role === "rec" ? "録音 · 42:10" : p.role === "transcript" ? "42:10" : typeof p.role === "number" ? `${RECIPE.name} ${p.role + 1} / ${RECIPE.steps.length}` : p.pub ? p.pub : "");
/* 系譜で呼ぶ名前: 文字起こしはエンジン名、ほかはタブが 2 つ以上あるときだけタブの名前を添える */
const fullLabel = (t) => { const p = t.page; return p.role === "transcript" ? `文字起こし（${t.engine}）` : tabsOf(p).length > 1 ? `${p.t} ${tl(t)}` : p.t; };
const madeFrom = (t) => (t && t.from ? BY.get(t.from) : null);
const madeHere = (t) => allPages().flatMap((p) => tabsOf(p)).filter((x) => x.from === t.id);
const nextName = (p) => (p.role === "transcript" ? RECIPE.steps[0] : typeof p.role === "number" && p.role + 1 < RECIPE.steps.length ? RECIPE.steps[p.role + 1] : null);
const findRole = (f, role) => kidsOf(f).find((k) => k.role === role);
const countOf = (t) => {
  if (!t) return "0 字";
  const p = t.page;
  if (t.st === "run" || t.st === "wait") return "0 字";
  if (p.role === "transcript") return "1,240 字";
  if (p.role === 0) return "1,240 字";
  if (p.role === 1) return "380 字";
  if (p.role === 2) return t.id === "s3b" ? "2,010 字" : "1,980 字";
  return { w1a: "132 字", w1b: "740 字", d1a: "96 字", p2a: "8 字" }[t.id] ?? "0 字";
};

/* ===== 一覧 ===== */
function renderList() {
  const out = [];
  const row = (n, d) => {
    const isFolder = n.kind === "folder";
    const kids = isFolder ? sorted(kidsOf(n)) : [];
    const open = isFolder ? n.open !== false : true;
    const ts = isFolder ? [] : tabsOf(n);
    const running = ts.some((t) => t.st === "run");
    const sub = isFolder ? "" : running ? (n.role === "transcript" ? "文字起こし中…" : "作成中…") : n.role === "rec" ? "録音 · 42:10" : n.pub ? n.pub : "";
    out.push(`<li class="row ${isFolder ? "folder" : kindOf(n)}${n.id === curPage ? " on" : ""}${isFolder && !open ? " closed" : ""}" data-id="${n.id}" style="--d:${d}" tabindex="0" draggable="true">
      ${isFolder ? `<button class="tw${kids.length ? "" : " none"}" aria-label="${open ? "閉じる" : "開く"}" aria-expanded="${open}">${svg("down")}</button>${svg("folder", "ico ki")}` : ""}
      ${n.role === "rec" ? svg("mic", "ico ki") : n.role === "transcript" ? svg("lines", "ico ki") : typeof n.role === "number" ? svg("spark", "ico ki") : ""}
      <b>${n.t}</b>${ts.length > 1 ? `<span class="n" aria-label="${ts.length} タブ">${ts.length}</span>` : ""}<span class="when">${isFolder ? "" : n.when}</span>
      <button class="more" aria-label="${n.t} のメニュー" aria-haspopup="menu">${svg("more")}</button>
      ${sub ? `<span class="sub">${running ? '<i class="spin"></i>' : ""}${sub}</span>` : ""}</li>`);
    if (isFolder && open) for (const k of kids) row(k, d + 1);
  };
  for (const n of TREE) row(n, 0);
  $("#list").innerHTML = out.join("");
}

const TX = [
  ["Mika", "00:12", "北鎌倉の駅を降りると、朝の空気がもう違いますね。"],
  ["佐藤", "00:21", "ええ。店を開ける前にこの道を歩くのが、もう二十年の習慣で。円覚寺の総門のあたりは、季節で匂いが変わるんです。"],

  ["佐藤", "02:43", "行きます。紫陽花の季節は避けますけど。"],

const chip = (name, note) => `<span class="chip"><span>${name}</span>${note ? `<small>${note}</small>` : ""}<button class="x" aria-label="${name} を外す" data-toast="外しました（モック）">${svg("x")}</button></span>`;

const seg = (labels, on) => `<div class="seg" role="group">${labels.map((l, i) => `<button class="${i === on ? "on" : ""}"${i === on ? ' aria-pressed="true"' : ""}>${l}</button>`).join("")}</div>`;

/* タブの帯（2 つ以上のときだけ）。開いているタブに ▾（名前・複製・並べて開く・移す・削除）。右端の ＋ でタブを足す */
function tabsHtml(p, tab) {
  const ts = tabsOf(p);
  if (ts.length < 2) return "";
  return `<div class="tabs" role="tablist" aria-label="${p.t} のタブ">${ts.map((t) => `<span class="tb${t === tab ? " on" : ""}"><button role="tab" aria-selected="${t === tab}" data-open="${t.id}">${t.st === "run" ? '<i class="spin"></i>' : ""}${tl(t)}</button>${t === tab ? `<button class="tm" data-menu="tab" aria-label="タブ「${tl(t)}」のメニュー" aria-haspopup="menu">${svg("down")}</button>` : ""}</span>`).join("")}<button class="add" data-menu="addtab" aria-label="タブを足す" aria-haspopup="menu">${svg("plus")}</button></div>`;
}

function recHtml(p, tab) {
  const f = folderOf(p);
  const txp = f ? findRole(f, "transcript") : null;
  const txs = txp ? tabsOf(txp).filter((t) => t.from === tab.id) : [];
  const info = p.id === "r9"
    ? { sum: "未入力", speakers: 0, people: "", terms: "", bg: "" }
    : { sum: "2人 · 日本語 · 登場人物 2 · 固有名詞 3 · 背景あり", speakers: 2, people: chip("Mika", "聞き手") + chip("佐藤さん", "北鎌倉の珈琲店主"), terms: chip("北鎌倉") + chip("円覚寺", "えんがくじ") + chip("明月院", "めいげついん"), bg: "北鎌倉で二十年続く珈琲店の店主に、開店前の散歩の習慣を聞いた。観光ガイドではなく、暮らしの手触りを伝える記事にしたい。" };
  const closed = p.id !== "r9" && txs.length > 0;
  const list = txs.length
    ? `<ul class="txlist">${txs.map((t) => `<li data-open="${t.id}">${svg("lines", "ico ki")}<div class="t"><b>${tl(t)}</b><small>${t.st === "run" ? '<i class="spin"></i> 文字起こし中… · 残り 3 分ほど' : `${t.engine} · 42:10 · 1,240 字`}</small></div><span class="when">${t.when}</span>${svg("chev", "ico chev")}</li>`).join("")}</ul>`
    : `<div class="txempty">${txBtn("btn")}<small>42 分 · 同じフォルダに「文字起こし」のページができます</small></div>`;
  return `<h1 class="tt" contenteditable="true" spellcheck="false">${p.t}</h1>
  <div class="recblk"><button class="play" aria-label="再生" data-toast="再生（モック）">${svg("play")}</button><div class="wave" aria-hidden="true"></div><span class="time">00:00 / 42:10</span><span class="tag">2 ファイル</span></div>
  <section class="recinfo${closed ? " closed" : ""}" id="recinfo" aria-label="この録音について">
    <button class="ri-hd" aria-expanded="${!closed}" aria-controls="ri-body">${svg("mic", "ico mic")}<b>この録音について</b><span class="sum">${info.sum}</span>${svg("down", "ico chev")}</button>
    <div class="ri-body" id="ri-body">
      <div class="ri-r"><label>話者人数</label>${seg(["自動", "1人", "2人", "3人", "4人以上"], info.speakers)}</div>
      <div class="ri-r"><label>言語</label>${seg(["日本語", "English"], 0)}</div>
      <div class="ri-r"><label>登場人物</label><div class="chips">${info.people}${addChip("追加")}</div></div>
      <div class="ri-r"><label>固有名詞</label><div class="chips">${info.terms}${addChip("追加")}<span class="tag" title="設定の固有名詞">${svg("gear")}共通 5</span></div></div>
      <div class="ri-r"><label>背景</label><textarea rows="3" aria-label="背景" placeholder="取材の目的、相手、場所など">${info.bg}</textarea></div>
    </div>
  </section>
  <div class="txhd"><h2>文字起こし</h2>${txs.length > 1 ? `<span class="tag">${txs.length} タブ</span>` : ""}${txs.length ? txBtn() : ""}</div>
  ${list}`;
}

function transcriptHtml(p, tab) {
  const r = madeFrom(tab);
  const body = tab.st === "run"
    ? `<p><i class="spin"></i> 文字起こし中… 残り 3 分ほど。終わるとここに出ます。</p>`
    : TX.map(([who, at, text]) => `<p><span class="meta"><b>${who}</b><button data-toast="${at} から再生（モック）">${at}</button></span>${text}</p>`).join("");
  return `<h1 class="tt" contenteditable="true" spellcheck="false">${p.t}</h1>
  <div class="recblk"><button class="play" aria-label="再生" data-toast="再生（モック）">${svg("play")}</button><div class="wave" aria-hidden="true"></div><span class="time">00:00 / 42:10</span>${r ? `<span class="src">音声:<button data-open="${r.page.id}">${svg("mic")}${r.page.t}</button></span>` : ""}</div>
  <div class="txmeta"><span>${tab.engine} · 日本語 · 2人</span><button class="btn quiet" data-toast="話者の名前（モック）">話者の名前</button>${startBtn("記事にする")}</div>
  <div class="tx" contenteditable="${tab.st === "run" ? "false" : "true"}" spellcheck="false">${body}</div>`;
}

function stepHtml(p, tab) {
  const role = p.role;
  const note = tab.st === "run" ? `<p class="runnote"><i class="spin"></i> 作成中… 残り 2 分ほど。終わるとここに出ます。</p>` : tab.st === "wait" ? `<p class="runnote">前の段階が終わると作ります。</p>` : "";
  const body = tab.st ? "" : role === 1 ? (tab.id === "s2b" ? `
    <h2>狙い</h2><p>珈琲店主・佐藤さんの二十年を、朝の散歩という一本の線で描く人物記事。</p>
    <h2>読者</h2><p>店の常連と、これから鎌倉に通う人。</p>
    <h2>構成</h2><ol><li>店を開ける前の一時間、何を見ているか</li><li>二十年の変化と、変わらない道</li><li>最後に、店の一杯へ</li></ol>
    <h2>書かないこと</h2><p>観光案内、営業情報。</p>` : `
    <h2>狙い</h2><p>北鎌倉の「観光客が来る前の一時間」を、珈琲店主の二十年の習慣から描く。</p>
    <h2>読者</h2><p>鎌倉に住んでみたい人。観光ガイドではなく、暮らしの手触りを求めている。</p>
    <h2>構成</h2><ol><li>朝 6 時の総門の匂い（春と秋の対比）</li><li>二十年の散歩が店の味にどうつながるか</li><li>読者が同じ道を歩くための、短い案内</li></ol>
    <h2>書かないこと</h2><p>店の営業情報、紫陽花の時期の混雑。</p>`)
    : role === 0 ? TX.map(([who, , text]) => `<p><b>${who}</b>：${text}</p>`).join("")
    : tab.id === "s3b" ? `<p>北鎌倉の朝は、駅を降りた瞬間に始まる。空気が、もう違う。</p><p>珈琲店を開ける前の一時間、佐藤さんは二十年、同じ道を歩いてきた。円覚寺の総門の前で季節の匂いを確かめ、明月院へ抜ける。紫陽花の季節だけは避ける。</p><p>観光の人が来る前の一時間だけ、町は自分のものになる——その言葉が、この店の一杯の味を決めている。</p>`
    : `<h2>観光客が来る前の一時間</h2><p>北鎌倉の駅を降りると、朝の空気がもう違う。珈琲店を開ける前にこの道を歩くのが、佐藤さんの二十年の習慣だ。</p><p>円覚寺の総門のあたりは、季節で匂いが変わる。春は土と梅、秋は金木犀。「観光の方が来る前の一時間だけ、町が自分のものになる」。</p><h2>二十年の散歩と、一杯の珈琲</h2><p>その一時間が、店の味をつくってきた。散歩の途中で見た光と匂いが、その日の豆の挽き方を決める。</p><h2>同じ道を歩くなら</h2><p>北鎌倉駅から円覚寺の総門へ。建長寺の前を通って明月院まで、歩いて四十分ほど。朝六時台なら、人はいない。</p>`;
  return `<h1 class="tt" contenteditable="true" spellcheck="false">${p.t}</h1>${note}<div class="bd" contenteditable="true" spellcheck="false">${body}</div>`;
}

function noteHtml(p, tab) {
  const body = {
    w1a: `<p>材木座の冬の海は、朝の七時でもまだ青くない。灰色の水面に、サーファーが二人、点のように浮いている。</p><p>海辺の町で冬を過ごすと、海は見るものではなく、天気のように「ある」ものになる。</p>`,
    w1b: `<p>The winter sea at Zaimokuza is not yet blue at seven in the morning. On the grey water, two surfers float like dots.</p><p>Spend a winter in a seaside town and the sea stops being something you look at. It becomes something that is simply there, like the weather.</p>`,
    d1a: `<p>北鎌倉駅 → 円覚寺の総門 → 建長寺の前を通って → 明月院。徒歩で 40 分ほど。</p><p>朝 6 時台は人がいない。総門の前の坂で振り返ると、線路の向こうに朝日。</p>`,
    p2a: `<p>鎌倉が大好きです。</p>`,
  }[tab.id] ?? "";
  return `<h1 class="tt ph" contenteditable="true" data-ph="無題" spellcheck="false">${p.t}</h1><div class="bd ph" contenteditable="true" data-ph="書きはじめる。「/」でブロック" spellcheck="false">${body}</div>`;
}

function bodyHtml(p, tab) {
  const k = kindOf(p);
  return k === "rec" ? recHtml(p, tab) : k === "transcript" ? transcriptHtml(p, tab) : k === "step" ? stepHtml(p, tab) : noteHtml(p, tab);
}

/* フォルダを開いた画面: 流れ（役割のあるページを順に。タブの数つき）＋ 中身の一覧 */
function folderHtml(f) {
  const kids = sorted(kidsOf(f));
  const roles = kids.filter((k) => k.role !== undefined);
  const flow = roles.map((k) => { const ts = tabsOf(k); return `<li><button data-open="${k.id}">${ts.some((t) => t.st === "run") ? '<i class="spin"></i>' : ""}${k.t}${ts.length > 1 ? `<span class="n">${ts.length}</span>` : ""}</button></li>`; });
  if (roles.length) {
    const hasTx = roles.some((k) => k.role === "transcript");
    const last = Math.max(-1, ...roles.filter((k) => typeof k.role === "number").map((k) => k.role));
    const missing = !hasTx ? "文字起こし" : last + 1 < RECIPE.steps.length ? RECIPE.steps[last + 1] : null;
    if (missing) flow.push(`<li><span class="none">${missing}（まだ）</span></li>`);
  }
  const rows = kids.map((k) => { const ts = tabsOf(k); const sub = [ts.length > 1 || k.role === "transcript" ? ts.map(tl).join(" · ") : "", roleSay(k)].filter(Boolean).join(" · "); return `<li class="${kindOf(k)}" data-open="${k.id}">${k.role === "rec" ? svg("mic", "ico ki") : k.role === "transcript" ? svg("lines", "ico ki") : typeof k.role === "number" ? svg("spark", "ico ki") : svg("doc", "ico ki")}<div class="t"><b>${k.t}</b>${sub ? `<small>${ts.some((t) => t.st === "run") ? '<i class="spin"></i> ' : ""}${sub}</small>` : ""}</div><span class="when">${k.when}</span></li>`; });
  return `<h1 class="tt fh" contenteditable="true" spellcheck="false">${svg("folder")}${f.t}</h1>
  <div class="facts"><button class="btn sm" data-toast="このフォルダに空のページを作ります（モック）">${svg("plus")}新しいページ</button><button class="btn line sm" data-toast="このフォルダに録音のページを作ります（モック）">${svg("mic")}録音から</button></div>
  ${flow.length ? `<ol class="flow" aria-label="流れ">${flow.join("")}</ol>` : ""}
  ${rows.length ? `<ul class="frows">${rows.join("")}</ul>` : `<div class="empty">まだページがありません</div>`}`;
}

/* 右の「ページの情報」: 役割 › 何から › ここから › タブ › 字数 ＋ 操作 */
function infoHtml(p, tab) {
  const role = p.role;
  const roleTxt = role === "rec" ? "録音" : role === "transcript" ? `文字起こし · ${tab.engine}` : typeof role === "number" ? `${RECIPE.name} › ${RECIPE.steps[role]}（${role + 1} / ${RECIPE.steps.length}）` : '<span class="none">なし</span>';
  const up = []; for (let a = madeFrom(tab); a; a = madeFrom(a)) up.unshift(a);
  const down = madeHere(tab);
  const ts = tabsOf(p);
  const rows = [["役割", roleTxt]];
  if (up.length) rows.push(["何から", `<ol class="lineage">${up.map((a) => `<li><button class="lk" data-open="${a.id}"><span>${fullLabel(a)}</span></button></li>`).join("")}<li><span class="cur">このタブ</span></li></ol>`]);
  if (role === "rec" || role === "transcript" || typeof role === "number") {
    const nx = nextName(p);
    rows.push(["ここから", down.length ? down.map((d) => `<button class="lk" data-open="${d.id}">${d.st === "run" ? '<i class="spin"></i>' : ""}<span>${fullLabel(d)}</span></button>`).join('<span class="sep">·</span>') : `<span class="none">${role === "rec" ? "文字起こし" : nx ?? ""}${role === "rec" || nx ? "（まだ）" : "まだ"}</span>`]);
  }
  rows.push(["タブ", `${ts.map((t) => `<button class="lk${t === tab ? " cur" : ""}" data-open="${t.id}"><span>${tl(t)}</span></button>`).join('<span class="sep">·</span>')}<span class="sep">·</span><button class="lk add" data-make="tab">${svg("plus")}足す</button>`]);
  rows.push(["字数", `${countOf(tab)} · ${tab.when ?? "今"}`]);
  const acts = [];
  if (role === "rec") acts.push(txBtn());
  else if (role === "transcript") acts.push(startBtn("記事にする"));
  else if (typeof role === "number") {
    acts.push(`<button class="btn quiet sm" data-toast="このタブを作り直します。前の本文は版に残ります（モック）">${svg("redo")}作り直す</button>`);
    acts.push(`<button class="btn quiet sm" data-make="sibling">${svg("copy")}もう 1 つ作る</button>`);
    if (!down.length && nextName(p)) acts.push(`<button class="btn sm" data-make="continue">${svg("spark")}ここから続きを作る</button>`);
  } else acts.push(startBtn("ここから作る"));
  return `${rows.map(([k, v]) => `<div class="ir"><dt>${k}</dt><dd>${v}</dd></div>`).join("")}<div class="iacts">${acts.join("")}</div>`;
}

function ctxHtml(p, tab) {
  const ts = tabsOf(p);
  const tags = [`<span class="tag">${svg("doc")}${ts.length > 1 ? `このタブ（${tl(tab)}）` : "このページ"}</span>`];
  if (p.role !== undefined) tags.push(`<span class="tag">${svg("mic")}この録音について</span>`);
  if (typeof p.role === "number") tags.push(`<span class="tag">${svg("spark")}文書ガイド（${RECIPE.name}）</span>`);
  const f = folderOf(p);
  if (f) {
    const others = kidsOf(f).filter((k) => k.id !== p.id);
    if (others.length) tags.push(`<span class="tag">${svg("folder")}${f.t} の ${others.length} ページ</span>`);
  }
  return `<span>読むもの</span>${tags.join("")}`;
}

/* パンくずは場所（親のフォルダ）だけ。 */
function crumbsHtml(p) {
  const f = p.kind === "folder" ? null : folderOf(p);
  return f ? `<button data-open="${f.id}">${svg("folder")}<span>${f.t}</span></button>` : "";
}

function setRail(r) {

/* ページを開く: id はページでもタブでもよい。ページなら最後に見たタブ（初回は 1 つ目） */
function open(id) {
  const n = BY.get(id);
  if (!n) return;
  const p = pageOf(n);
  const folder = p.kind === "folder";
  let tab = null;
  if (!folder) {
    tab = isTab(n) ? n : (p.last && BY.get(p.last) && shown(BY.get(p.last)) ? BY.get(p.last) : tabsOf(p)[0]);
    p.last = tab.id;
  }
  curPage = p.id; curTab = tab ? tab.id : null;
  $("#cv").classList.remove("wide");
  $("#canvas").innerHTML = folder ? folderHtml(p) : tabsHtml(p, tab) + bodyHtml(p, tab);
  $("#crumbs").innerHTML = crumbsHtml(p);
  $("#loc").innerHTML = crumbsHtml(p);
  $("#ins").hidden = folder || p.role === "transcript";
  $("#pubbtn").hidden = folder;
  $("#aitoggle").hidden = folder;
  $("#infotoggle").hidden = folder;
  $("#count").hidden = folder;
  $("#ctx").innerHTML = folder ? "" : ctxHtml(p, tab);
  $("#info-body").innerHTML = folder ? "" : infoHtml(p, tab);
  $("#count").textContent = countOf(tab);
  $("#menu-dots").innerHTML = folder
    ? `<button data-toast="フォルダの中を .zip に書き出します（モック）">${svg("doc")}書き出し<small>.zip</small></button><hr><button class="danger" data-del="${p.id}">${svg("trash")}削除</button>`
    : `<button data-toast="共有のリンク（モック）">${svg("link")}リンクで共有</button><button data-toast="書き出し（モック）">${svg("doc")}書き出し<small>.md · Google ドキュメント</small></button><button data-toast="履歴（モック）">${svg("cal")}履歴</button><hr><button data-make="tab">${svg("tab")}タブを足す</button><button data-toast="並べて開く相手を選びます（モック）">${svg("cols")}並べて開く…</button><button data-toast="移動（モック）">${svg("move")}移動…</button><hr><button class="danger" data-del="${p.id}">${svg("trash")}削除</button>`;
  $("#url").textContent = "/p/" + (tab ? tab.id : p.id);
  setRail(rail);
  renderList();

  $("#ws").dataset.screen = "page";

}

/* 並べて開く: 2 つのタブを横に（スマホは縦）。右のパネルは閉じる */
function openSplit(a, b) {

  $("#cv").classList.add("wide");

/* 固定のメニューの中身（開くときに今のページ・タブで作る） */
const MENUS = {
  tx: () => `<div class="hd">同じフォルダの「文字起こし」にタブができます</div><button data-make="tx:Gemini">Gemini<small>既定</small></button><button data-make="tx:Deepgram">Deepgram</button><button data-make="tx:この Mac">この Mac<small>オフライン</small></button>`,
  start: () => `<div class="hd">${svg("spark")}このタブから作る</div><button data-make="run">${svg("spark")}${RECIPE.name}<small>${RECIPE.steps.join(" › ")}</small></button><button data-toast="議事録にする（モック）">議事録にする</button><button data-toast="インサイト整理（モック）">インサイト整理</button><button data-toast="コーチングにする（モック）">コーチングにする</button>`,
  addtab: () => {
    const p = BY.get(curPage);

    if (p.role === "transcript") extra = `<hr><div class="hd">別のエンジンで文字起こし</div><button data-make="tx:Gemini">Gemini</button><button data-make="tx:Deepgram">Deepgram</button><button data-make="tx:この Mac">この Mac</button>`;
    else if (typeof p.role === "number") extra = `<hr><button data-make="sibling">${svg("spark")}同じ入力でもう 1 つ作る<small>AI</small></button>`;
    return `<button data-make="tab">${svg("tab")}空のタブ</button><button data-make="dup">${svg("copy")}このタブを複製</button>${extra}`;

  },
};

/* ===== 機能がページとタブを作る（モック: 1 つ足して開くだけ） ===== */
let seq = 10;
function wrapFolder(p) {
  let f = folderOf(p);
  if (f) return f;
  /* フォルダの外の録音: 録音の題名でフォルダを作って中に入れる */
  f = { id: "f" + (seq++), kind: "folder", t: p.t, open: true, children: [] };
  TREE.splice(TREE.indexOf(p), 1, f);
  f.children.push(p);
  toast(`フォルダ「${p.t}」を作って、録音を中に入れました`);
  return f;
}
function rolePage(f, role, title) {
  let p = findRole(f, role);
  if (!p) { p = { id: "p" + (seq++), kind: "page", role, t: title, when: "今", tabs: [] }; f.children.push(p); }
  return p;
}
function addTab(p, tab) { p.tabs.push(tab); index(); open(tab.id); return tab; }
function makeTranscript(engine) {
  const n = BY.get(curTab);
  const recTab = n.page.role === "rec" ? n : madeFrom(n);
  const f = wrapFolder(recTab.page);
  const p = rolePage(f, "transcript", "文字起こし");
  addTab(p, { id: "t" + (seq++), t: engine, engine, from: recTab.id, when: "今", st: "run" });
  toast(tabsOf(p).length > 1 ? `「文字起こし」に ${engine} のタブを足しました（モック）` : "「文字起こし」のページができました（モック）");
}
function makeRun(tab) {
  const f = wrapFolder(tab.page);
  let from = tab.id, last = null;
  RECIPE.steps.forEach((name, i) => {
    const p = rolePage(f, i, name);
    const t = { id: "s" + (seq++), t: String(tabsOf(p).length + 1), from, when: "今", st: i === 0 ? "run" : "wait" };
    p.tabs.push(t); from = t.id; last = t;
  });
  index();
  open(last.id);
  toast(`${RECIPE.name}を始めました。段階ごとにページ（同じ段階があればタブ）ができます（モック）`);
}
function makeSibling(tab) {
  const p = tab.page;
  addTab(p, { id: "s" + (seq++), t: String(tabsOf(p).length + 1), from: tab.from, when: "今", st: "run" });
  toast("同じ入力から、もう 1 つ作っています（モック）");
}
function makeContinue(tab) {
  const f = folderOf(tab);
  let from = tab.id, last = null;
  for (let i = tab.page.role + 1; i < RECIPE.steps.length; i++) {
    const p = rolePage(f, i, RECIPE.steps[i]);
    const t = { id: "s" + (seq++), t: String(tabsOf(p).length + 1), from, when: "今", st: i === tab.page.role + 1 ? "run" : "wait" };
    p.tabs.push(t); from = t.id; last = t;
  }
  index();
  open(last.id);
  toast(`「${fullLabel(tab)}」から続きを作っています（モック）`);
}
function makeTab(dup) {
  const p = BY.get(curPage), cur = BY.get(curTab);
  const t = { id: "n" + (seq++), t: String(tabsOf(p).length + 1), when: "今" };
  if (dup) { t.dupOf = cur.id; t.t = `${tl(cur)} のコピー`; }
  addTab(p, t);
  toast(dup ? "タブを複製しました（モック）" : "タブを足しました（モック）");
}

/* ===== 画面の切替（mock 用） ===== */
const STATES = {
  rec: () => { rail = "ai"; open("r1"); },
  transcribing: () => { rail = "ai"; open("t2"); },
  transcript: () => { rail = "ai"; open("t1"); },
  step: () => { rail = "ai"; open("s3a"); },
  two: () => { rail = "ai"; open("s3b"); },
  plan2: () => { rail = "info"; open("s2b"); },
  split: () => openSplit("s3a", "s3b"),
  tabs: () => { rail = "info"; open("w1b"); },
  folder: () => open("f1"),
  wrap: () => { rail = "ai"; open("r9"); },
};
function go(name) {
  closeMenus();
  state = STATES[name] ? name : "rec";
  STATES[state]();
  $$("#sw button").forEach((b) => b.classList.toggle("on", b.dataset.state === state));
  history.replaceState(null, "", "?state=" + state);
}

document.addEventListener("click", (e) => {
  const st = e.target.closest("[data-state]");
  if (st) { go(st.dataset.state); return; }
  const o = e.target.closest("[data-open]");
  if (o) { closeMenus(); open(o.dataset.open); return; }
  const sp = e.target.closest("[data-split]");
  if (sp) { closeMenus(); openSplit(curTab, sp.dataset.split); return; }
  const mk = e.target.closest("[data-make]");
  if (mk) {
    const t = BY.get(curTab); closeMenus();
    const [what, arg] = mk.dataset.make.split(":");
    if (what === "tx") makeTranscript(arg);
    else if (what === "run") makeRun(t);
    else if (what === "sibling") makeSibling(t);
    else if (what === "continue") makeContinue(t);
    else if (what === "tab") makeTab(false);
    else if (what === "dup") makeTab(true);
    return;
  }
  const c = e.target.closest("[data-close]");
  if (c) $("#" + c.dataset.close).classList.remove("open");
  const t = e.target.closest("[data-toast]");
  if (t && !e.target.closest("[data-del]")) { e.preventDefault(); toast(t.dataset.toast); closeMenus(); }
});

/* ===== メニュー ===== */

}
function placeMenu(m, x, y) {
  m.classList.add("open");

  m.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + "px";

}
document.addEventListener("click", (e) => {

/* 行のメニューの「タブを足す」: そのページを開いてから足す */

/* 削除の確認（ページ・タブ・フォルダ） */
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-del]");
  if (!d) return;
  e.stopPropagation();
  const n = BY.get(d.dataset.del);
  closeMenus();
  let h, ps = [];
  if (n.kind === "folder") { h = `「${n.t}」と中の ${kidsOf(n).length} ページを削除しますか？`; }
  else if (isTab(n)) { h = `タブ「${tl(n)}」を削除しますか？`; if (madeHere(n).length) ps.push("このタブから作ったものは残ります。"); }
  else {
    h = `「${n.t}」を削除しますか？`;
    const ts = tabsOf(n);
    if (ts.length > 1) ps.push(`${ts.length} つのタブも消えます。`);
    if (n.role === "rec") ps.push("文字起こしのページは残ります（再生はできなくなります）。");
    else if (ts.some((t) => madeHere(t).length)) ps.push("このページから作ったものは残ります。");
  }
  ps.push("ゴミ箱に 30 日残ります。");
  $("#del-h").textContent = h;
  $("#del-p").textContent = ps.join("");
  $("#veil-del").classList.add("open");
  $("#del-ok").onclick = () => { $("#veil-del").classList.remove("open"); toast("ゴミ箱に入れました（30 日で消えます）"); };
});
$$(".veil").forEach((v) => v.addEventListener("click", (e) => { if (e.target === v) v.classList.remove("open"); }));

/* 検索（見た目だけ）・一覧のしまう／出す・右のパネル・スマホ */
$("#btn-search").addEventListener("click", () => toast("検索（モック）"));
const ws = $("#ws");
function setSidebar(openSb) { ws.classList.toggle("nosb", !openSb); $("#btn-expand").hidden = openSb; $("#brand-hd").hidden = openSb; }
$("#btn-collapse").addEventListener("click", () => setSidebar(false));
$("#btn-expand").addEventListener("click", () => setSidebar(true));
$("#btn-list").addEventListener("click", () => (ws.dataset.screen = "list"));
const mq = matchMedia("(max-width:720px)");
function onMq() { $("#btn-list").hidden = !mq.matches; if (mq.matches) setSidebar(true); }
mq.addEventListener("change", onMq); onMq();
$("#aitoggle").addEventListener("click", () => setRail(rail === "ai" ? null : "ai"));
$("#infotoggle").addEventListener("click", () => setRail(rail === "info" ? null : "info"));
$("#info-close").addEventListener("click", () => setRail(null));
$("#count").addEventListener("click", () => setRail("info"));

let tt;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2200); }

/* ===== URL の指定（確認用） ===== */
const q = new URLSearchParams(location.search);
go(q.get("state") || "rec");
if (q.get("sb") === "closed") setSidebar(false);
if (q.get("screen")) ws.dataset.screen = q.get("screen");
</script>
