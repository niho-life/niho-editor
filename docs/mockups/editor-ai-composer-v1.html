<!doctype html>
<!--
  mock: NIHO editor の AI コンポーザー v1（PC。Cursor の Composer の動きを、右の「AIと作る」と本文で再現）
  色と文字: このモックは単体で開けるよう、色を :root の仮値（hex）で持つ。実装（docs-ui / editor-web）では packages/ui/src/styles/tokens.css の token を引き、生の hex は足さない。文字は 12px 以上にそろえてある。
  mock: NIHO editor の AI コンポーザー v1（PC。Cursor の Composer の動きを、右の「AIと作る」と本文で再現）
  論点（上の帯の「場面」で切り替える。開くと自動で 1 回流れる。「やり直す」で再生）:
    推敲       … 本文全体に「ですます調にそろえて、繰り返しを削って」。右のカードに思考が流れ（折りたたみ）、工程の行が進み、
                 本文の中に差分（消す語＝取り消し線、足す語＝灰色）が 1 か所ずつ置かれる。段落ごとに採用／却下（⌘⏎・⌘⌫・⌥↓⌥↑）。
                 採用した語は灰色のまま残り（AI が書いた印）、その中に自分で打った文字は黒。最初の採用でヘッダーに「版」が出て戻せる。
    肉付け     … 人が 5 行（各章の書き出し）だけ書いた記事。@ で録音の文字起こしを渡し、「各行を章の書き出しにして、録音から肉付けして」。
                 章ごとに見出し案と前後の段落が灰色で流れ込み、人の 5 行は一字も変わらない。資料に無い事実は〔要確認〕。段落の末尾に時刻の出典。
    選んで指示 … 本文の 2 段落を選んで右で「もっと短く」。選択は入力欄のチップになり、差分は選んだ段落だけに出る。
  作っていない:
    - 上の黒い帯は mock 用。保存・公開・検索・新しい会話は動かない（見た目だけ）。
    - 思考・工程・差分・返答は固定の合成文で、モデルは呼ばない。「止める」は流れを止めるだけ。
    - 灰色の文の中で打った文字を黒にするのは、キーボード直打ち（英数）だけ。IME の変換中は扱わない（本物は ProseMirror の transaction で扱う）。
    - 待ちの差分がある段落を打つと、その差分は却下される（本物は mapping で追う）。本文の「/」ブロック一覧・書式の帯は入れていない。
    - ⋯ の「AI の文を灰色で見せる」以外の項目は押しても動かない。320px は崩れない程度で、比較は PC 幅を想定。
  参照: idea/active/2026-11-05-ai-composer-design.md（設計と実現性）/ docs/mockups/editor-writing-support-v1.html（ベース）/
        docs/architecture/editor-niho-life-design.md §6
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NIHO editor AI コンポーザー v1</title>
<style>
:root{
  --ink:#2a2a26;--ink2:#54544d;--mute:#6e6d66;--faint:#898880;
  --white:#fff;--canvas:#fffdfa;--shell:#fcfaf5;--sand:#f7f7f4;--sand2:#f5f3ee;
  --line:#f1f1ed;--line2:#e7e7e2;--line3:#dbdbd5;--track:#f2efe8;
  --moss:#56751e;--pale:#EEF6E1;--leaf:#B2D67C;--deep:#63A109;
  --grad:linear-gradient(140deg,#7DBA3A 0%,#63A109 100%);--grad-h:linear-gradient(140deg,#74B033 0%,#5C9508 100%);
  --amber:#C8713A;--amber-ink:#a55827;--amber-pale:#FAF0E6;
  --sans:"Hiragino Maru Gothic ProN","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
  --sbw:244px;--aiw:380px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.6 var(--sans);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
b,strong{font-weight:600}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px;border-radius:6px}
[contenteditable]:focus{outline:none}
[hidden]{display:none!important}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
kbd{font:12px var(--mono);color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 14px;border-radius:999px;background:var(--grad);color:#fff;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--grad-h)}
.btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line3)}
.btn.line:hover{background:var(--sand)}
.btn.quiet{background:none;color:var(--ink2)}
.btn.quiet:hover{background:var(--sand)}
.btn.sm{height:28px;padding:0 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none;position:relative}
.ib:hover,.ib.on{background:var(--sand2);color:var(--ink)}
.ib[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30}
.ib[data-tip]:hover::after{opacity:1}
.menu{position:absolute;z-index:40;min-width:200px;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 36px rgba(28,28,26,.12);padding:6px;display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:13.5px;color:var(--ink)}
.menu button:hover{background:var(--sand)}
.menu button .ico{width:16px;height:16px;color:var(--ink2)}
.menu button .chk{width:16px;text-align:center;color:var(--moss);font-weight:700}
.menu button small{margin-left:auto;color:var(--faint);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}

/* mock bar */
.mock{position:sticky;top:0;z-index:100;overflow:hidden;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;background:#141413;color:#fff;font-size:12.5px}
.mock .url{flex:1;min-width:0;background:rgba(255,255,255,.08);border-radius:8px;padding:4px 10px;font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mock .url b{color:#fff;font-weight:600}
.variant-switch{display:flex;align-items:center;gap:6px}
.variant-switch span{color:rgba(255,255,255,.5);margin-left:6px}
.variant-switch button{height:24px;padding:0 10px;border-radius:999px;color:rgba(255,255,255,.75);font-weight:600;font-size:12px;border:1px solid rgba(255,255,255,.18);white-space:nowrap;flex:none}
.variant-switch button.on{background:#fff;color:#141413;border-color:#fff}
.variant-switch button.all{border-style:dashed}

/* shell */
.ws{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:calc(100vh - 40px)}
.ws.sbhide{grid-template-columns:minmax(0,1fr)}
.ws.sbhide .sb{display:none}
.sb{position:sticky;top:40px;height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--shell);border-right:1px solid var(--line)}
.sb-top{display:flex;align-items:center;gap:6px;padding:10px 10px 2px 14px}
.sb-top .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;flex:1;min-width:0}
.sb-top .brand i{width:20px;height:20px;border-radius:6px;background:var(--grad);flex:none}
.sb-act{padding:4px 8px 2px}
.sb-act button{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.sb-act button:hover{background:var(--sand2);color:var(--ink)}
.sb-act button .ico{width:16px;height:16px;color:var(--faint)}
.sb-act button kbd{margin-left:auto}
.sb-list{flex:1;overflow:auto;padding:6px 8px 10px}
.row{position:relative;display:flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 calc(8px + var(--d,0) * 18px);border-radius:8px;cursor:pointer;user-select:none}
.row:hover{background:var(--sand2)}
.row.on{background:#fff;box-shadow:0 1px 2px rgba(28,28,26,.06),0 0 0 1px var(--line)}
.row b{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-size:12px;color:var(--faint);white-space:nowrap}
.row .mk{width:14px;height:14px;color:var(--mute)}
.sb-foot{border-top:1px solid var(--line);padding:8px 10px}
.sb-me{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 8px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.sb-me:hover{background:var(--sand2);color:var(--ink)}
.sb-me .av{width:22px;height:22px;border-radius:50%;background:var(--pale);color:var(--moss);display:grid;place-items:center;font-size:12px;font-weight:700}

/* document */
.doc{position:relative;display:flex;flex-direction:column;min-width:0;min-height:calc(100vh - 40px)}
.dt{position:sticky;top:40px;z-index:20;display:flex;align-items:center;gap:4px;height:46px;padding:0 10px 0 8px;background:var(--canvas)}
.dt .crumb{font-size:13px;color:var(--mute);max-width:30vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:4px}
.dt .ins{display:flex;align-items:center;gap:2px;margin-left:8px;padding-left:10px;border-left:1px solid var(--line2)}
.dt .ins .ib{color:var(--faint)}
.dt .ins .ib:hover{color:var(--ink)}
.pubbtn{height:30px;padding:0 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.pubbtn:hover{background:var(--sand)}
.ver{display:none;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--amber-ink);background:var(--amber-pale);white-space:nowrap;position:relative}
.ver.on{display:inline-flex}
.ver .menu{right:0;left:auto;top:32px;min-width:230px}
.working{display:none;align-items:center;gap:7px;height:28px;padding:0 10px 0 8px;border-radius:999px;font-size:12px;font-weight:600;color:var(--moss);background:var(--pale);white-space:nowrap}
.working.on{display:inline-flex}
.working i{width:10px;height:10px;border-radius:50%;border:2px solid var(--moss);border-top-color:transparent;animation:spin .8s linear infinite}
#moremenu{right:10px;left:auto;top:44px}

.dbody{display:grid;grid-template-columns:minmax(0,1fr) 0;flex:1;position:relative}
.dbody.open{grid-template-columns:minmax(0,1fr) var(--aiw)}
.canvas{padding:52px 56px 160px;min-width:0;position:relative}
.canvas .in{max-width:680px;margin:auto;position:relative}
.tt{font-weight:600;font-size:34px;line-height:1.25;letter-spacing:-.01em;min-height:1.25em}
.bd{font-size:16px;line-height:1.95;margin-top:14px;min-height:40vh}
.bd p{margin:0 0 .35em}
.bd h2{font-size:22px;font-weight:600;line-height:1.4;margin:1.2em 0 .3em}
.bd ::selection{background:#dce9f7}
/* AI が書いた印（灰色） */
.bd .ai{color:var(--mute)}
body.nogray .bd .ai{color:inherit}
.bd .ai:not(.pend){position:relative}
.bd span.ai:hover::after{content:"AI が書いた";position:absolute;left:0;top:calc(100% + 2px);font-size:12px;font-weight:600;color:var(--faint);background:#fff;border:1px solid var(--line2);border-radius:6px;padding:1px 7px;white-space:nowrap;z-index:6;pointer-events:none}
/* 差分（hunk） */
.bd .hunk{position:relative}
.bd .hunk::before{content:"";position:absolute;left:-18px;top:5px;bottom:5px;width:3px;border-radius:2px;background:var(--leaf)}
.bd .hunk.cur::before{background:var(--deep);left:-20px;width:4px}
.bd del{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1.5px}
.bd ins{color:var(--mute);text-decoration:none;background:var(--pale);border-radius:3px;box-shadow:0 0 0 2px var(--pale)}
.bd .grp{margin:.2em 0}
.bd .grp .mine{color:var(--ink)}
.bd .pend{color:var(--mute)}
.bd .pend.typing::after{content:"";display:inline-block;width:2px;height:1em;background:var(--mute);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(2) infinite}
.bd cite{font-style:normal;font:12px var(--mono);color:var(--faint);margin-left:8px;user-select:none;vertical-align:1px}
.bd .chk{font-size:12.5px;color:var(--amber-ink);background:var(--amber-pale);border-radius:4px;padding:0 5px;margin:0 2px;user-select:none}
.ht{position:absolute;right:0;top:-30px;display:none;align-items:center;gap:1px;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 6px 18px rgba(28,28,26,.1);padding:2px;font-size:12.5px;z-index:5;user-select:none;line-height:1}
.hunk.cur .ht,.hunk:hover .ht{display:inline-flex}
.ht b{font-weight:600;color:var(--faint);padding:0 8px 0 6px;font-size:12px}
.ht button{height:26px;padding:0 9px;border-radius:7px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.ht button:hover{background:var(--sand)}
.ht button.ok{color:var(--moss)}
.ht kbd{font-size:12px}

/* 文字数 */
.count{position:fixed;right:18px;bottom:14px;z-index:15;font-size:12px;color:var(--faint);padding:4px 9px;border-radius:999px;background:var(--canvas)}
.dbody.open ~ .count,.open .count{right:calc(var(--aiw) + 18px)}

/* 右パネル */
.rp{position:sticky;top:86px;align-self:start;height:calc(100vh - 86px);border-left:1px solid var(--line);background:var(--canvas);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.divider{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5}
.divider:hover,.divider.on{background:linear-gradient(90deg,transparent 3px,var(--line3) 3px,var(--line3) 5px,transparent 5px)}
.rp .hd{display:flex;align-items:center;gap:2px;height:40px;padding:0 8px 0 14px;flex:none;font-weight:600;font-size:13.5px}
.thread{flex:1;overflow:auto;padding:6px 14px 10px;display:flex;flex-direction:column;gap:10px}
.msg{font-size:13.5px;line-height:1.65}
.msg.me{align-self:flex-end;max-width:92%;background:var(--sand);border-radius:14px 14px 4px 14px;padding:8px 12px}
.msg.me .chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
.msg.bot{padding:0 2px;color:var(--ink)}
.pre{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:var(--pale);color:var(--moss);font-size:12px;font-weight:600;margin-right:6px;vertical-align:1px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--pale);color:var(--moss);font-size:12px;font-weight:600;white-space:nowrap}
.chip .ico{width:13px;height:13px}
.chip .x{color:var(--moss);opacity:.7;font-size:14px;margin-left:1px}
/* 実行カード */
.run{border:1px solid var(--line2);border-radius:12px;background:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.think{border-radius:9px;background:var(--sand)}
.think-hd{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--ink2);text-align:left}
.think-hd i.spin{width:11px;height:11px;border-radius:50%;border:2px solid var(--moss);border-top-color:transparent;animation:spin .8s linear infinite;flex:none}
.think.closed .think-hd i.spin{display:none}
.think-hd em{font-style:normal;color:var(--faint);font-weight:500;margin-left:auto}
.think-hd .caret{transition:transform .15s;color:var(--faint);font-size:12px}
.think.closed .caret{transform:rotate(-90deg)}
.think-body{max-height:150px;overflow:auto;padding:0 10px 8px;font-size:12.5px;line-height:1.6;color:var(--mute);white-space:pre-wrap}
.think.closed .think-body{display:none}
.steps{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.steps li{display:flex;align-items:center;gap:9px;min-height:18px}
.steps li i{width:8px;height:8px;border-radius:50%;background:var(--line3);flex:none;margin:0 1px}
.steps li.done i{background:var(--moss)}
.steps li.doing i{width:10px;height:10px;margin:0;background:transparent;border:2px solid var(--moss);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.todo{color:var(--faint)}
.steps li.stopped i{background:var(--amber)}
.sum{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;flex-wrap:wrap}
.sum em{font-style:normal;color:var(--faint);font-weight:500}
.sum .sp{flex:1}
.hks{display:flex;flex-direction:column;gap:1px}
.hk{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 8px;border-radius:8px;font-size:12.5px;color:var(--ink2)}
.hk:hover{background:var(--sand)}
.hk.cur{background:var(--pale)}
.hk b{width:14px;color:var(--faint);font-weight:600;flex:none}
.hk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hk em{font-style:normal;color:var(--faint);font-size:12px;flex:none}
.hk.ok em{color:var(--moss)}
.hk.no span{text-decoration:line-through;color:var(--faint)}
.run-foot{display:flex;gap:6px;align-items:center}
.run .note{font-size:12.5px;color:var(--amber-ink)}
/* 入力欄 */
.composer{padding:10px 12px 12px;flex:none;position:relative}
.composer .box{border:1px solid var(--line2);border-radius:14px;background:#fff;padding:9px 10px 7px}
.composer .box:focus-within{border-color:var(--line3)}
.composer .chips{display:none;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.composer .chips.has{display:flex}
.composer textarea{width:100%;border:0;outline:none;resize:none;font-size:13.5px;line-height:1.6;min-height:48px;background:none;padding:0 2px;display:block}
.composer textarea::placeholder{color:var(--faint)}
.composer .foot{display:flex;align-items:center;gap:4px;margin-top:4px}
.composer .foot .ib{width:28px;height:28px;color:var(--faint)}
.model{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;color:var(--mute)}
.send{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin-left:auto}
.send .ico{width:15px;height:15px;stroke-width:2.2}
#skillmenu{left:12px;bottom:calc(100% - 4px);top:auto;min-width:240px}

@media (max-width:900px){
  :root{--sbw:100vw}
  .ws{grid-template-columns:minmax(0,1fr)}
  .sb{position:fixed;inset:40px 0 0 0;z-index:50;width:min(100vw,300px);box-shadow:0 0 0 100vw rgba(20,20,18,.3);display:none}
  .ws.sbopen .sb{display:flex}
  .dt .crumb{display:none}
  .canvas{padding:28px 18px 120px}
  .tt{font-size:26px}
  .bd .hunk::before{left:-10px}
  .bd .hunk.cur::before{left:-11px}
  .dbody.open{grid-template-columns:minmax(0,1fr) 0}
  .rp{position:fixed;inset:40px 0 0 0;z-index:50;height:calc(100vh - 40px);align-self:auto;border-left:0;display:none}
  .dbody.open .rp{display:flex}
  .divider{display:none}
  .count,.open .count{right:12px;bottom:10px}
}
</style>
</head>
<body>

<div class="mock">
  <span>mock</span>
  <div class="url">editor.niho.life<b id="url">/p/8f2c9a</b></div>
  <div class="variant-switch" id="scenes">
    <span>場面</span>
    <button class="on" data-s="polish">推敲</button>
    <button data-s="fill">肉付け</button>
    <button data-s="select">選んで指示</button>
    <span>速さ</span>
    <button class="on" data-speed="slow">ゆっくり</button>
    <button data-speed="fast">速く</button>
    <button class="all" id="replay">やり直す</button>
  </div>
</div>

<div class="ws" id="ws">

/* ---------- 描画 ---------- */
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function renderPage(doc){
  titleEl.textContent=doc.title;$('#crumb').textContent=doc.title;$('#url').textContent=doc.url;
  $$('#list .row').forEach(r=>r.classList.toggle('on',r.dataset.page===doc.page));
  body.innerHTML=doc.blocks.map(([t,x],i)=>`<${t} data-i="${i}">${esc(x)}</${t}>`).join('');
  updateCount();
}
function updateCount(){const n=Array.from((body.innerText||'').replace(/\s/g,'')).length;$('#count').textContent=n.toLocaleString('ja-JP')+' 字';}
function blockAt(i){return body.querySelector(`[data-i="${i}"]`);}
function markChk(el){el.innerHTML=el.innerHTML.replace(/〔要確認[^〕]*〕/g,m=>`<span class="chk" contenteditable="false">${m}</span>`);}
function chipHtml(c){return `<span class="chip">${c.ico||''}${esc(c.label)}<span class="x">×</span></span>`;}
function setChips(chips){const el=$('#chips');el.innerHTML=chips.map(chipHtml).join('');el.classList.toggle('has',chips.length>0);}
function scrollThread(){thread.scrollTop=thread.scrollHeight;}

/* ---------- 流れ ---------- */
const d=ms=>state.instant?Promise.resolve():sleep(state.fast?Math.max(8,ms*0.12):ms);
async function streamText(el,text,alive,per){
  if(state.instant){el.append(text);return;}
  const step=state.fast?4:1;
  for(let i=0;i<text.length;i+=step){if(!alive())return;el.append(text.slice(i,i+step));if(el.classList.contains('think-body'))el.scrollTop=el.scrollHeight;await sleep(state.fast?6:per);}
}
function addUserMsg(scn){
  const m=document.createElement('div');m.className='msg me';
  m.innerHTML=(scn.chips.length?`<div class="chips">${scn.chips.map(chipHtml).join('')}</div>`:'')+`<p>${scn.preset?`<span class="pre">/${scn.preset}</span>`:''}${esc(scn.instruction)}</p>`;
  thread.append(m);scrollThread();
}
function addBotMsg(text){const m=document.createElement('div');m.className='msg bot';m.innerHTML=`<p>${esc(text)}</p>`;thread.append(m);scrollThread();}
function addRun(scn){
  const el=document.createElement('div');el.className='run';
  el.innerHTML=`<div class="think"><button class="think-hd" aria-expanded="true"><i class="spin"></i><span class="think-t">考えている…</span><em class="think-s">0.0 秒</em><span class="caret">▾</span></button><div class="think-body"></div></div>
  <ol class="steps">${scn.steps.map(s=>`<li class="todo"><i></i><span>${esc(s.todo)}</span></li>`).join('')}</ol>
  <div class="sum" hidden></div><div class="hks" hidden></div>
  <div class="run-foot"><button class="btn sm line stop">止める</button></div>`;
  thread.append(el);scrollThread();
  const card={el,think:$('.think',el),tb:$('.think-body',el),tt:$('.think-t',el),time:$('.think-s',el),steps:$('.steps',el),sum:$('.sum',el),hks:$('.hks',el),foot:$('.run-foot',el)};
  $('.think-hd',el).addEventListener('click',()=>{card.think.classList.toggle('closed');$('.think-hd',el).setAttribute('aria-expanded',String(!card.think.classList.contains('closed')));});
  $('.stop',el).addEventListener('click',()=>{state.abort=true;});
  card.list=()=>renderList(card);
  return card;
}
function setStep(card,i,cls,text){const li=card.steps.children[i];if(!li)return;li.className=cls;if(text)li.lastElementChild.textContent=text;}
function makeTools(h){
  const t=document.createElement('span');t.className='ht';t.contentEditable='false';t.dataset.h=h.id;
  t.innerHTML=`<b>${h.no}/${h.of}</b><button class="ok" data-a="ok">採用<kbd>⌘⏎</kbd></button><button data-a="no">却下<kbd>⌘⌫</kbd></button>`;
  return t;
}
function placeEdit(op,i,n){
  const el=blockAt(op.i);el.innerHTML='';
  for(const p of op.parts){
    if(typeof p==='string')el.append(p);
    else if(p.del){const x=document.createElement('del');x.textContent=p.del;el.append(x);}
    else{const x=document.createElement('ins');x.textContent=p.ins;el.append(x);}
  }
  const ins=op.parts.find(p=>p.ins);
  const h={id:'h'+i,no:i+1,of:n,kind:'edit',el,state:'pending',label:(ins?ins.ins:op.parts.find(p=>p.del)?.del||'').slice(0,22)};
  el.classList.add('hunk');el.dataset.h=h.id;el.append(makeTools(h));
  state.hunks.push(h);el.scrollIntoView({block:'nearest'});if(!state.cur)setCur(h);
}
async function placeGroup(op,i,n,alive){
  const anchor=blockAt(op.i);
  const g=document.createElement('div');g.className='hunk grp';anchor.before(g);
  const h={id:'h'+i,no:i+1,of:n,kind:'grp',el:g,state:'pending',label:op.heading};g.dataset.h=h.id;
  const tools=makeTools(h);g.append(tools);state.hunks.push(h);if(!state.cur)setCur(h);
  const h2=document.createElement('h2');h2.className='ai pend typing';g.insertBefore(h2,tools);
  await streamText(h2,op.heading,alive,26);h2.classList.remove('typing');
  anchor.classList.add('mine');g.insertBefore(anchor,tools);
  for(const para of op.paras){
    if(!alive())break;
    const p=document.createElement('p');p.className='ai pend typing';g.insertBefore(p,tools);
    p.scrollIntoView({block:'nearest'});
    await streamText(p,para.x,alive,14);p.classList.remove('typing');markChk(p);
    if(para.cite){const c=document.createElement('cite');c.contentEditable='false';c.textContent=para.cite;p.append(c);}
    updateCount();
  }
  h.done=alive();
}
function renderList(card){
  const hs=state.hunks;if(!hs.length)return;
  const ok=hs.filter(h=>h.state==='ok').length,no=hs.filter(h=>h.state==='no').length,pend=hs.length-ok-no;
  card.sum.hidden=false;card.hks.hidden=false;
  card.sum.innerHTML=`<span>${card.doneText||''}</span><em>採用 ${ok} · 却下 ${no}${pend?` · 残り ${pend}`:''}</em><span class="sp"></span>`+
    (pend?`<button class="btn sm" data-all="ok">${ok||no?'残りを':''}全部採用</button><button class="btn sm quiet" data-all="no">全部却下</button>`:'');
  card.hks.innerHTML=hs.map(h=>`<button class="hk ${h.state}${state.cur===h?' cur':''}" data-h="${h.id}"><b>${h.no}</b><span>${esc(h.label)}</span><em>${h.state==='ok'?'採用':h.state==='no'?'却下':'待ち'}</em></button>`).join('');
}
function finish(card,scn,stopped,k,n){
  card.foot.innerHTML='';
  $('#working').classList.remove('on');state.running=false;
  if(stopped){const p=document.createElement('p');p.className='note';p.textContent=`途中で止めました（${k}/${n}）`;card.el.insertBefore(p,card.foot);card.doneText='';}
  else card.doneText=scn.done;
  card.list();
  if(!stopped)addBotMsg(scn.reply);
  updateCount();scrollThread();
}
async function run(){
  const id=++state.runId;state.abort=false;state.running=true;const scn=SCN[state.scn];
  renderPage(scn.doc);thread.innerHTML='';state.hunks=[];state.cur=null;hideVer();
  state.snapshot=body.innerHTML;setChips([]);$('#input').value='';
  const alive=()=>id===state.runId&&!state.abort;
  if(scn.select){selectBlocks(scn.select);setChips(scn.chips);$('#input').value=scn.instruction;await d(900);if(!alive())return;getSelection().removeAllRanges();setChips([]);$('#input').value='';}
  addUserMsg(scn);
  const card=addRun(scn);state.card=card;
  $('#workingt').textContent='AI が考えています';$('#working').classList.add('on');
  const t0=Date.now();const timer=setInterval(()=>{card.time.textContent=((Date.now()-t0)/1000).toFixed(1)+' 秒';},100);
  for(const line of scn.think){if(!alive())break;await streamText(card.tb,line+'\n',alive,16);await d(320);}
  clearInterval(timer);
  card.think.classList.add('closed');$('.think-hd',card.el).setAttribute('aria-expanded','false');
  card.tt.textContent='考えた';card.time.textContent=(state.instant?'2.8':((Date.now()-t0)/1000).toFixed(1))+' 秒';
  if(!alive()){setStep(card,0,'stopped');return finish(card,scn,true,0,scn.ops.length);}
  setStep(card,0,'doing');await d(600);setStep(card,0,'done',scn.steps[0].done);
  setStep(card,1,'doing');await d(700);setStep(card,1,'done',scn.steps[1].done);
  $('#workingt').textContent='AI が書いています';
  const n=scn.ops.length;let k=0;
  for(let i=0;i<n;i++){
    if(!alive())break;
    setStep(card,2,'doing',scn.steps[2].doing.replace('%',scn.ops[i].kind==='grp'?String(i+1):`${i+1}/${n}`));
    if(scn.ops[i].kind==='edit'){await d(420);if(!alive())break;placeEdit(scn.ops[i],i,n);}
    else await placeGroup(scn.ops[i],i,n,alive);
    k=i+1;card.list();scrollThread();await d(300);
  }
  if(id!==state.runId)return;
  const stopped=!alive();
  setStep(card,2,stopped?'stopped':'done',stopped?scn.steps[2].stopped.replace('%',scn.ops[0].kind==='grp'?String(Math.min(k+1,n)):`${k}/${n}`):scn.steps[2].done);
  finish(card,scn,stopped,k,n);
}
function selectBlocks([a,b]){const r=document.createRange();r.setStartBefore(blockAt(a));r.setEndAfter(blockAt(b));const s=getSelection();s.removeAllRanges();s.addRange(r);blockAt(a).scrollIntoView({block:'center'});}

/* ---------- 採用・却下 ---------- */
function setCur(h,scroll){
  state.hunks.forEach(x=>x.el.classList.remove('cur'));state.cur=h;
  if(h){h.el.classList.add('cur');if(scroll)h.el.scrollIntoView({block:'center',behavior:'smooth'});}
  state.card?.list();
}
function unwrapPara(b){
  const cite=b.querySelector('cite');const s=document.createElement('span');s.className='ai';
  while(b.firstChild&&b.firstChild!==cite)s.append(b.firstChild);
  b.prepend(s);b.classList.remove('pend','ai','typing');
}
function accept(h){
  if(h.state!=='pending')return;h.state='ok';const el=h.el;
  if(h.kind==='grp'){
    $$('.pend',el).forEach(unwrapPara);$('.ht',el)?.remove();$('.mine',el)?.classList.remove('mine');
    el.replaceWith(...el.childNodes);
  }else{
    $$('del',el).forEach(x=>x.remove());
    $$('ins',el).forEach(x=>{const s=document.createElement('span');s.className='ai';s.textContent=x.textContent;x.replaceWith(s);});
    $('.ht',el)?.remove();el.classList.remove('hunk','cur');delete el.dataset.h;el.normalize();
  }
  showVer();after(h);
}
function reject(h){
  if(h.state!=='pending')return;h.state='no';const el=h.el;
  if(h.kind==='grp'){const mine=$('.mine',el);if(mine){mine.classList.remove('mine');el.replaceWith(mine);}else el.remove();}
  else{$$('ins',el).forEach(x=>x.remove());$$('del',el).forEach(x=>x.replaceWith(x.textContent));$('.ht',el)?.remove();el.classList.remove('hunk','cur');delete el.dataset.h;el.normalize();}
  after(h);
}
function after(h){
  if(state.cur===h){state.cur=null;const next=state.hunks.find(x=>x.state==='pending'&&x.no>h.no)||state.hunks.find(x=>x.state==='pending');setCur(next||null,true);}
  else state.card?.list();
  updateCount();
}
function allPending(act){state.hunks.filter(h=>h.state==='pending').forEach(h=>act==='ok'?accept(h):reject(h));}
function moveCur(dir){const p=state.hunks.filter(h=>h.state==='pending');if(!p.length)return;let i=p.indexOf(state.cur);i=(i+dir+p.length)%p.length;setCur(p[i],true);}
function hunkOf(id){return state.hunks.find(h=>h.id===id);}

body.addEventListener('mousedown',e=>{if(e.target.closest('.ht'))e.preventDefault();});
body.addEventListener('click',e=>{
  const b=e.target.closest('.ht button');if(!b)return;
  const h=hunkOf(b.closest('.ht').dataset.h);if(!h)return;b.dataset.a==='ok'?accept(h):reject(h);
});
thread.addEventListener('click',e=>{
  const all=e.target.closest('[data-all]');if(all){allPending(all.dataset.all);return;}
  const hk=e.target.closest('.hk');if(hk){const h=hunkOf(hk.dataset.h);if(h&&h.state==='pending')setCur(h,true);else h?.el.isConnected&&h.el.scrollIntoView({block:'center',behavior:'smooth'});}
});
document.addEventListener('keydown',e=>{
  const pend=state.hunks.some(h=>h.state==='pending');
  if(e.metaKey&&e.key==='Enter'&&pend){e.preventDefault();if(!state.cur)moveCur(1);if(state.cur)accept(state.cur);return;}
  if(e.metaKey&&e.key==='Backspace'&&pend){e.preventDefault();if(!state.cur)moveCur(1);if(state.cur)reject(state.cur);return;}
  if(e.altKey&&(e.key==='ArrowDown'||e.key==='ArrowUp')&&pend){e.preventDefault();moveCur(e.key==='ArrowDown'?1:-1);return;}
  if(e.key==='Escape'){$$('.menu.open').forEach(m=>m.classList.remove('open'));}
});

/* 灰色の文の中で打った文字は黒。待ちの差分がある段落を打つと、その差分は却下 */
body.addEventListener('beforeinput',e=>{
  if(e.inputType!=='insertText'||typeof e.data!=='string')return;
  const sel=getSelection();if(!sel.rangeCount||!sel.isCollapsed)return;
  const r=sel.getRangeAt(0);const node=r.startContainer;const host=node.nodeType===3?node.parentElement:node;
  const hunkEl=host.closest('.hunk');
  if(hunkEl){const h=hunkOf(hunkEl.dataset.h);if(h&&h.state==='pending'&&h.kind==='edit'){
    e.preventDefault();
    let off=0;const w=document.createTreeWalker(hunkEl,NodeFilter.SHOW_TEXT);let t;
    while((t=w.nextNode())){if(t===node){off+=r.startOffset;break;}if(!t.parentElement.closest('ins,.ht'))off+=t.length;}
    reject(h);
    const w2=document.createTreeWalker(hunkEl,NodeFilter.SHOW_TEXT);let acc=0,placed=false;
    while((t=w2.nextNode())){if(acc+t.length>=off){const rr=document.createRange();rr.setStart(t,off-acc);rr.collapse(true);sel.removeAllRanges();sel.addRange(rr);placed=true;break;}acc+=t.length;}
    if(!placed){const rr=document.createRange();rr.selectNodeContents(hunkEl);rr.collapse(false);sel.removeAllRanges();sel.addRange(rr);}
    document.execCommand('insertText',false,e.data);return;
  }}
  const ai=host.closest('span.ai');if(!ai||node.nodeType!==3)return;
  e.preventDefault();
  const tail=document.createRange();tail.setStart(node,r.startOffset);tail.setEnd(ai,ai.childNodes.length);
  const frag=tail.extractContents();
  const plain=document.createTextNode(e.data);ai.after(plain);
  if(frag.textContent.length){const t2=document.createElement('span');t2.className='ai';t2.append(frag);plain.after(t2);}
  if(!ai.textContent.length)ai.remove();
  const rr=document.createRange();rr.setStart(plain,plain.length);rr.collapse(true);sel.removeAllRanges();sel.addRange(rr);
  updateCount();
});
body.addEventListener('input',updateCount);

/* ---------- 版 ---------- */
function showVer(){if(state.verShown)return;state.verShown=true;state.ver++;$('#verlabel').textContent=`版 ${state.ver}`;$('#verback').textContent=`書き換え前（版 ${state.ver-1}）に戻す`;$('#ver').classList.add('on');}
function hideVer(){state.verShown=false;state.ver=4;$('#ver').classList.remove('on');$('#vermenu').classList.remove('open');}
$('#ver').addEventListener('click',e=>{if(e.target.closest('.menu'))return;$('#vermenu').classList.toggle('open');});
$('#verback').addEventListener('click',()=>{
  body.innerHTML=state.snapshot;state.hunks.forEach(h=>{if(h.state==='pending')h.state='no';});state.cur=null;
  if(state.card){state.card.doneText=`書き換え前（版 ${state.ver-1}）に戻しました`;state.card.list();}
  hideVer();updateCount();
});

/* ---------- 入力欄・メニュー ---------- */
$('#send').addEventListener('click',()=>{if(!state.running)run();});
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!state.running)run();}});
$('#skillbtn').addEventListener('click',e=>{e.stopPropagation();$('#skillmenu').classList.toggle('open');});
$('#skillmenu').addEventListener('click',e=>{const b=e.target.closest('[data-skill]');$('#skillmenu').classList.remove('open');if(!b)return;setScene(b.dataset.skill);run();});
$('#atbtn').addEventListener('click',()=>setChips([{ico:MIC,label:'散歩の録音 11/4 · 文字起こし'}]));
$('#morebtn').addEventListener('click',e=>{e.stopPropagation();$('#moremenu').classList.toggle('open');});
$('#graytoggle').addEventListener('click',()=>{state.gray=!state.gray;document.body.classList.toggle('nogray',!state.gray);$('#graychk').textContent=state.gray?'✓':'';});
document.addEventListener('click',e=>{if(!e.target.closest('.menu,#morebtn,#skillbtn,#ver'))$$('.menu.open').forEach(m=>m.classList.remove('open'));});
$('#stop2').addEventListener('click',()=>{state.abort=true;});
$('#aitoggle').addEventListener('click',()=>{dbody.classList.toggle('open');$('#aitoggle').classList.toggle('on',dbody.classList.contains('open'));});
$('#aiclose').addEventListener('click',()=>{dbody.classList.remove('open');$('#aitoggle').classList.remove('on');});
$('#sbclose').addEventListener('click',()=>{$('#ws').classList.add('sbhide');$('#ws').classList.remove('sbopen');});
$('#sbopen').addEventListener('click',()=>{$('#ws').classList.remove('sbhide');$('#ws').classList.toggle('sbopen');});
$$('#list .row').forEach(r=>r.addEventListener('click',()=>{const s=r.dataset.page==='interview'?'fill':'polish';setScene(s);run();}));

/* 仕切り */
(()=>{const dv=$('#divider');let drag=false;
dv.addEventListener('mousedown',e=>{drag=true;dv.classList.add('on');e.preventDefault();});
document.addEventListener('mousemove',e=>{if(!drag)return;const w=Math.min(560,Math.max(280,window.innerWidth-e.clientX));document.documentElement.style.setProperty('--aiw',w+'px');});
document.addEventListener('mouseup',()=>{drag=false;dv.classList.remove('on');});
dv.addEventListener('dblclick',()=>document.documentElement.style.setProperty('--aiw','380px'));})();

/* ---------- 場面 ---------- */
function setScene(s){state.scn=s;$$('#scenes [data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));}
function setSpeed(f){state.fast=f;$$('#scenes [data-speed]').forEach(b=>b.classList.toggle('on',(b.dataset.speed==='fast')===f));}
$('#scenes').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.s){setScene(b.dataset.s);run();}
  else if(b.dataset.speed){setSpeed(b.dataset.speed==='fast');}
  else if(b.id==='replay'){run();}
});
(()=>{
  const tokens=location.hash.replace(/^#/,'').split('&').filter(Boolean);
  for(const t of tokens){if(SCN[t])setScene(t);if(t==='fast')setSpeed(true);if(t==='done')state.instant=true;if(t==='nogray')$('#graytoggle').click();}
  run().then(()=>{state.instant=false;});
})();
</script>
