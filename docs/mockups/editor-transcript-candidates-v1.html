<!doctype html>
<!--
  mock: 録音ページの文字起こしを複数の案で作る（Gemini の案 1 → Deepgram で案 2 → 比べる → 採用）v1（PC と 320px）
  土台: docs/mockups/editor-folders-v1.html（フォルダ・この録音について・手順の帯）。色は :root の仮値（hex）。実装では token を引く。

  前提（既にある仕組み。Issue #236 / PR #244 の契約 docs/architecture/recording-candidates.md）:
    - 1 つの録音に独立した案（page_recording_candidates）を何本でも持てる。案ごとに engine を持つ。
    - 正本は page_recordings の 1 本だけ。明示した「採用」が選んだ案を正本に写し、既存の工程のサブページは「前提変更」になる。
    - 任意の 2 案を並べて比べる。話者番号・段落の位置は案ごとに独立で、自動で対応づけ・併合はしない。
    - 同じページで走れる文字起こしは 1 つだけ。走っている間は案の編集・復元・採用を受けない。

  このモックで決めたいこと:
    1. 案の切り替えの置き場: 本文の見出し「文字起こし」の直下に案の札（エンジン名・採用中・作成中…）と「＋ 別の案」。
    2. 「別の案」の作り方: シートでエンジンを選ぶ（Gemini／Deepgram）。話者人数・言語は「この録音について」の値を引き継ぐ。
       この案だけの指示（任意）。作ると札に「作成中…」が付き、本文は今の案のまま。
    3. 採用されていない案を見ているときの帯: 「◯◯ の案 · 時刻」「△△ と比べる」「この案を採用」。
    4. 比べる: 2 列（スマホは切替）。各列の上にエンジン名と「採用中」か「この案を採用」。差の強調はしない（契約どおり）。
    5. 採用の確認: 「Deepgram の案を採用しますか？」＋ 工程が前提変更になることを言う。採用後は帯の段階が「前提変更」になり「作り直す」。

  見かた:
    - 上の黒い帯は mock 用。本物には無い。帯のボタンか ?state=one|new|running|two|compare|adopt|adopted で状態を開ける。
    - 案の札を押すとその案の本文。「＋ 別の案」でシート。「比べる」で 2 列。「この案を採用」で確認のシート。
    - 幅 720px 以下はスマホの並び。比べるは 2 案の切替。

  作っていない:
    - 文字起こしの実行・保存・履歴の復元・案の名前の変更・案の削除・案ごとの本文の編集は見た目だけ（押すと右上に一言）。
    - 案の本文は合成データ。2 案の違いは固有名詞の表記と段落の切り方だけを変えてある。
    - 「この録音について」は畳んだ 1 行だけ（中身は editor-folders-v1）。一覧・AI の欄・公開は editor-folders-v1 のまま。
    - Mac の端末内エンジン（Apple）は出していない（Web のモック）。
  参照: docs/architecture/recording-candidates.md / apps/editor-web/src/components/RecordingCandidates.tsx /
        apps/editor-web/src/server/recording-candidates-api.ts / docs/mockups/editor-folders-v1.html
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NIHO editor 文字起こしの複数案 v1</title>
<style>
:root{
  --ink:#2a2a26;--ink2:#54544d;--mute:#6e6d66;--faint:#898880;
  --white:#fff;--canvas:#fffdfa;--shell:#fcfaf5;--sand:#f7f7f4;--sand2:#f5f3ee;
  --line:#f1f1ed;--line2:#e7e7e2;--line3:#dbdbd5;--track:#f2efe8;
  --moss:#56751e;--pale:#EEF6E1;--leaf:#B2D67C;--deep:#63A109;
  --grad:linear-gradient(140deg,#7DBA3A 0%,#63A109 100%);--grad-h:linear-gradient(140deg,#74B033 0%,#5C9508 100%);
  --amber:#C8713A;--amber-ink:#a55827;--amber-pale:#FAF0E6;
  --red:#B42318;--red-pale:#fdebec;
  --sans:"Hiragino Maru Gothic ProN","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
  --sbw:252px;--aiw:300px;--bar:40px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:14px/1.6 var(--sans);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
b,strong{font-weight:600}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 15px;border-radius:999px;background:var(--grad);color:#fff;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--grad-h)}
.btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line3)}
.btn.line:hover{background:var(--sand)}
.btn.quiet{background:none;color:var(--ink2)}
.btn.quiet:hover{background:var(--sand)}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn .ico{width:15px;height:15px}
.btn[disabled]{opacity:.45;cursor:default}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none;position:relative}
.ib:hover,.ib.on{background:var(--sand2);color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--faint);background:var(--sand2);white-space:nowrap;flex:none}
.tag.ok{color:var(--moss);background:var(--pale)}
.tag.no{color:var(--amber-ink);background:var(--amber-pale)}
.tag .ico{width:12px;height:12px}
.toast{position:fixed;top:52px;right:16px;z-index:120;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(28,28,26,.2);opacity:0;transition:opacity .15s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.seg{display:inline-flex;background:var(--sand2);border-radius:999px;padding:3px;flex:none;max-width:100%}
.seg button{height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--moss);box-shadow:0 1px 2px rgba(28,28,26,.08)}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{width:12px;height:12px;border:2px solid var(--leaf);border-top-color:var(--deep);border-radius:50%;animation:sp 1s linear infinite;flex:none;display:inline-block;vertical-align:-1px}

/* mock bar */
.mock{position:sticky;top:0;z-index:100;overflow:hidden;display:flex;align-items:center;gap:10px;height:var(--bar);padding:0 12px;background:#141413;color:#fff;font-size:12.5px}
.mock .url{flex:1;min-width:0;background:rgba(255,255,255,.08);border-radius:8px;padding:4px 10px;font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mock .url b{color:#fff;font-weight:600}
.mock .sw{display:flex;align-items:center;gap:6px;overflow:auto}
.mock .sw button{height:24px;padding:0 10px;border-radius:999px;color:rgba(255,255,255,.75);font-weight:600;font-size:12px;border:1px solid rgba(255,255,255,.18);white-space:nowrap;flex:none}
.mock .sw button.on{background:#fff;color:#141413;border-color:#fff}
@media (max-width:820px){.mock .url{display:none}}

/* shell */
.ws{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:calc(100vh - var(--bar))}
.sb{position:sticky;top:var(--bar);height:calc(100vh - var(--bar));display:flex;flex-direction:column;background:var(--shell);border-right:1px solid var(--line);min-width:0}
.sb-top{display:flex;align-items:center;gap:2px;height:52px;padding:10px 8px 6px 12px;flex:none}
.brand{display:flex;align-items:center;gap:7px;min-width:0;flex:1;font-weight:600;font-size:14px;color:var(--ink);padding:3px 6px 3px 2px;white-space:nowrap}
.brand .logo{width:22px;height:22px;flex:none;border-radius:6px;box-shadow:0 1px 2px rgba(28,28,26,.14)}
.sb-top .ib{width:30px;height:30px;color:var(--mute)}
.sb-top .ib .ico{width:17px;height:17px}
.sb-list{flex:1;min-height:0;overflow:auto;padding:4px 8px 10px}
.row{position:relative;display:flex;align-items:center;gap:6px;min-height:34px;padding:4px 4px 4px calc(8px + var(--d,0) * 16px);border-radius:8px;cursor:pointer;user-select:none;flex-wrap:wrap}
.row:hover{background:var(--sand2)}
.row.on{background:#fff;box-shadow:0 1px 2px rgba(28,28,26,.06),0 0 0 1px var(--line)}
.row b{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-size:12px;color:var(--faint);white-space:nowrap;width:40px;text-align:right}
.row .sub{flex-basis:100%;font-size:12px;color:var(--mute);margin-top:-2px;padding:0 0 2px 22px;display:flex;align-items:center;gap:6px}
.row .sub.stale{color:var(--amber-ink)}
.row .tw{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--faint);flex:none}
.row .tw .ico{width:14px;height:14px}
.row .ki{width:17px;height:17px;flex:none;color:var(--ink2)}
.row.folder b{font-weight:600}
.row.step .ki{width:13px;height:13px;color:var(--faint)}
.row.step b{font-size:13px}
.sb-foot{border-top:1px solid var(--line);padding:8px 10px;flex:none}
.sb-set{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink2);text-decoration:none}
.sb-set .ico{width:18px;height:18px;color:var(--mute)}

/* page */
.doc{position:relative;display:flex;flex-direction:column;min-width:0;min-height:calc(100vh - var(--bar))}
.dt{position:sticky;top:var(--bar);z-index:20;display:flex;align-items:center;gap:2px;height:52px;padding:0 10px 0 8px;background:var(--canvas)}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;margin:0 4px;font-size:13px;color:var(--mute)}
.crumbs button{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:22vw;padding:3px 7px;border-radius:7px;color:var(--mute)}
.crumbs button:hover{background:var(--sand);color:var(--ink)}
.crumbs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .ico{width:14px;height:14px}
.loc{display:none}
.dt .ins{display:flex;align-items:center;gap:2px;margin-left:6px;padding-left:10px;border-left:1px solid var(--line2)}
.dt .ins .ib{color:var(--faint)}
.pubbtn{height:30px;padding:0 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink);display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.pubbtn:hover{background:var(--sand)}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) var(--aiw);flex:1}
.canvas{padding:44px 56px 140px;min-width:0}
.canvas .in{max-width:760px;margin:auto}
.tt{font-weight:600;font-size:32px;line-height:1.25;letter-spacing:-.01em;min-height:1.25em;outline:none}
.count{position:fixed;right:calc(var(--aiw) + 18px);bottom:14px;z-index:15;font-size:12px;color:var(--faint);padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--canvas) 85%,transparent)}

/* 手順の帯 */
.band{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 4px;padding:7px 10px 7px 14px;border:1px solid var(--line2);border-radius:12px;background:#fff;font-size:13px}
.band .bn{font-weight:600;color:var(--ink2);margin-right:2px}
.steps{display:flex;align-items:center;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.steps li{display:flex;align-items:center}
.steps li+li::before{content:"›";color:var(--line3);margin:0 4px}
.steps li button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.steps li button:hover{background:var(--sand)}
.steps li button .ico{width:13px;height:13px;color:var(--moss);stroke-width:2.2}
.steps li.stale button{background:var(--amber-pale);color:var(--amber-ink)}
.steps li.stale button .ico{color:var(--amber-ink)}
.band .btn{margin-left:auto}
.band .note{flex-basis:100%;font-size:12.5px;color:var(--amber-ink);padding:2px 0 0 2px}

/* 録音ブロックと「この録音について」（畳んだ 1 行） */
.recblk{display:flex;align-items:center;gap:12px;margin-top:18px;padding:10px 12px;border-radius:12px;background:var(--sand);flex-wrap:wrap}
.play{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.play .ico{width:16px;height:16px;fill:#fff;stroke:none;margin-left:2px}
.wave{flex:1;min-width:120px;height:26px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--line3) 0 2px,transparent 2px 5px);mask:linear-gradient(90deg,#000 0 55%,rgba(0,0,0,.35) 55%)}
.time{font:12px var(--mono);color:var(--mute);white-space:nowrap}
.recinfo{margin-top:10px;border:1px solid var(--line2);border-radius:12px;background:#fff}
.ri-hd{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;font-size:13px;border-radius:12px}
.ri-hd:hover{background:var(--sand)}
.ri-hd b{font-weight:600;white-space:nowrap}
.ri-hd .sum{flex:1;min-width:0;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri-hd .chev{width:16px;height:16px;color:var(--faint);transform:rotate(-90deg)}

/* 文字起こし: 見出し・案の札・帯・本文 */
.txhd{display:flex;align-items:center;gap:8px;margin-top:28px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.txhd h2{font-size:14px;font-weight:600;color:var(--ink2);margin-right:2px}
.txhd .btn{height:26px;padding:0 9px;font-size:12.5px}
.txhd .btn:first-of-type{margin-left:auto}
.cands{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.cand{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2);background:#fff;white-space:nowrap}
.cand:hover{background:var(--sand)}
.cand.on{box-shadow:inset 0 0 0 1.5px var(--ink2);color:var(--ink)}
.cand .tag{height:18px;padding:0 6px;font-size:11px}
.cand.add{color:var(--moss)}
.cand.add:hover{background:var(--pale)}
.cand.add .ico{width:14px;height:14px;stroke-width:2.2}
.cands .cmpbtn{margin-left:auto}
.meta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.candbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:8px 10px 8px 14px;border-radius:12px;background:var(--pale);font-size:13px}
.candbar b{color:var(--moss)}
.candbar .btn{margin-left:auto}
.candbar .btn+.btn{margin-left:0}
.tx{margin-top:10px;font-size:15.5px;line-height:1.9}
.tx p{padding:6px 0}
.tx .m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);line-height:1.4;margin-bottom:1px}
.tx .m b{color:var(--ink2);font-size:12.5px}
.tx .m small{font:11.5px var(--mono);color:var(--faint)}

/* 比べる（2 列） */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.cmp .col{min-width:0;border:1px solid var(--line2);border-radius:12px;padding:10px 14px 12px;background:#fff}
.cmp .col h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink2);padding-bottom:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cmp .col h3 small{font-weight:500;color:var(--faint);font-size:12px}
.cmp .col h3 .btn{margin-left:auto;height:26px;padding:0 10px;font-size:12.5px}
.cmp .tx{margin-top:2px;font-size:14.5px;line-height:1.8}
.cmpsw{display:none;margin-top:10px}

/* AI（右） */
.ai{position:sticky;top:calc(var(--bar) + 52px);align-self:start;height:calc(100vh - var(--bar) - 52px);border-left:1px solid var(--line);background:var(--canvas);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ai .hd{display:flex;align-items:center;gap:2px;height:40px;padding:0 8px 0 16px;font-size:13px;font-weight:600;flex:none}
.ai .hd span{flex:1}
.thread{flex:1;overflow:auto;padding:4px 16px}
.ctx{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:0 14px 8px;font-size:12px;color:var(--faint)}
.ctx .tag{font-weight:500;color:var(--mute);background:var(--sand)}
.composer{padding:0 12px 12px;flex:none}
.composer .box{border:1px solid var(--line2);border-radius:14px;background:#fff;padding:9px 10px 7px}
.composer textarea{width:100%;border:0;outline:none;resize:none;font-size:13.5px;line-height:1.6;min-height:48px;background:none;padding:0 2px;display:block}
.composer textarea::placeholder{color:var(--faint)}
.composer .foot{display:flex;align-items:center;gap:4px;margin-top:4px}
.composer .foot .ib{width:28px;height:28px;color:var(--faint)}
.send{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin-left:auto}
.send .ico{width:15px;height:15px;stroke-width:2.2}

/* シート */
.veil{position:fixed;inset:0;z-index:110;background:rgba(28,28,26,.28);display:none;align-items:center;justify-content:center;padding:16px}
.veil.open{display:flex}
.sheet{width:min(460px,100%);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(28,28,26,.24);padding:22px 22px 18px}
.sheet h2{font-size:17px;font-weight:600;margin-bottom:8px}
.sheet p{font-size:13.5px;color:var(--ink2)}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.sheet .f{margin-top:14px}
.sheet .f label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer;font-size:13.5px}
.opt:hover{background:var(--sand)}
.opt.on{box-shadow:inset 0 0 0 1.5px var(--moss);background:var(--pale)}
.opt i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line3);flex:none;background:#fff}
.opt.on i{box-shadow:inset 0 0 0 5px var(--moss)}
.opt b{font-weight:600}
.opt small{color:var(--faint);font-size:12px;margin-left:auto;white-space:nowrap}
.sheet textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:13px;line-height:1.6;resize:vertical;min-height:52px;outline:none;display:block}
.sheet textarea::placeholder{color:var(--faint)}
.sheet .inh{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* スマホ */
@media (max-width:720px){
  .ws{grid-template-columns:minmax(0,1fr)}
  .sb{display:none}
  .dt .crumbs{display:none}
  .loc{display:flex;flex-wrap:wrap;margin:0 auto 4px}
  .loc button{max-width:60vw;margin-left:-7px}
  .dt .ins{margin-left:0;padding-left:6px}
  .dbody{grid-template-columns:minmax(0,1fr)}
  .ai{display:none}
  .canvas{padding:24px 16px 120px}
  .canvas .in{max-width:none}
  .tt{font-size:25px}
  .count{right:12px}
  .band{flex-direction:column;align-items:stretch;gap:6px;padding:8px 10px}
  .band .bn{margin:0}
  .band .btn{margin-left:0;align-self:flex-start}
  .cands .cmpbtn{margin-left:0}
  .candbar .btn{margin-left:0}
  .cmp{grid-template-columns:1fr}
  .cmp .col.hide{display:none}
  .cmpsw{display:inline-flex}
}
</style>
</head>
<body>

<div class="mock">
  <div class="url"><b>editor.niho.life</b><span id="url">/p/r1</span></div>
  <div class="sw" id="sw">
    <button data-state="one" class="on">案 1 を見る</button>
    <button data-state="new">別の案を作る</button>
    <button data-state="running">作成中</button>
    <button data-state="two">案 2 を見る</button>
    <button data-state="compare">比べる</button>
    <button data-state="adopt">採用の確認</button>
    <button data-state="adopted">採用後</button>
  </div>
</div>

<div class="ws" id="ws">
  <aside class="sb" aria-label="ページ">
    <div class="sb-top"><div class="brand" id="brand"></div><button class="ib" aria-label="検索" data-toast="検索（モック）"><span data-ic="search"></span></button><button class="ib" aria-label="新しいページ" data-toast="新しいページ（モック）"><span data-ic="plus"></span></button><button class="ib" aria-label="一覧をしまう" data-toast="一覧をしまう（モック）"><span data-ic="side"></span></button></div>
    <ul class="sb-list" id="list" aria-label="ページの一覧"></ul>
    <div class="sb-foot"><a class="sb-set" href="#" data-toast="設定（モック）"><span data-ic="gear"></span>設定</a></div>
  </aside>

  <main class="doc">
    <header class="dt">
      <nav class="crumbs" aria-label="場所"><button data-toast="フォルダへ（モック）"><span data-ic="folder"></span><span>鎌倉の朝の散歩</span></button></nav>
      <div class="ins">
        <button class="ib" aria-label="ブロックを挿入" data-toast="ブロック（モック）"><span data-ic="plus"></span></button>
        <button class="ib" aria-label="画像" data-toast="画像（モック）"><span data-ic="img"></span></button>
        <button class="ib" aria-label="録音" data-toast="録音（モック）"><span data-ic="mic"></span></button>
      </div>
      <span class="sp"></span>
      <button class="pubbtn" data-toast="公開のシート（モック）">公開</button>
      <button class="ib on" aria-label="AIと作る" data-toast="AI の開閉（モック）"><span data-ic="panel"></span></button>
      <button class="ib" aria-label="その他" data-toast="その他（モック）"><span data-ic="more"></span></button>
    </header>
    <div class="dbody">
      <div class="canvas">
        <nav class="in loc crumbs" aria-label="場所"><button data-toast="フォルダへ（モック）"><span data-ic="folder"></span><span>鎌倉の朝の散歩</span></button></nav>
        <div class="in" id="canvas"></div>
      </div>
      <aside class="ai" aria-label="AIと作る">
        <div class="hd"><span>AIと作る</span><button class="ib" aria-label="新しい会話" data-toast="新しい会話（モック）"><span data-ic="edit"></span></button><button class="ib" aria-label="会話の履歴" data-toast="会話の履歴（モック）"><span data-ic="more"></span></button></div>
        <div class="thread"></div>
        <div class="ctx" aria-label="AI が読むもの"><span>読むもの</span><span class="tag" id="ctx-page"></span><span class="tag" id="ctx-rec"></span><span class="tag" id="ctx-folder"></span></div>
        <div class="composer"><div class="box"><textarea rows="2" placeholder="直したいこと・作りたいもの…" aria-label="AI への依頼"></textarea><div class="foot"><button class="ib" aria-label="工程・スキル" data-toast="工程・スキル（モック）"><span data-ic="plus"></span></button><button class="send" aria-label="送る" data-toast="送信（モック）"><span data-ic="up"></span></button></div></div></div>
      </aside>
      <button class="count" data-toast="ページの情報（モック）">1,240 字</button>
    </div>
  </main>
</div>

<!-- 別の案を作る -->
<div class="veil" id="veil-new">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="new-h">
    <h2 id="new-h">別の案を作る</h2>
    <div class="f"><label>エンジン</label>
      <div class="opts" role="radiogroup" aria-label="エンジン">
        <button class="opt" role="radio" aria-checked="false" data-engine="gemini"><i></i><b>Gemini</b><small>案 1 と同じ</small></button>
        <button class="opt on" role="radio" aria-checked="true" data-engine="deepgram"><i></i><b>Deepgram</b><small>話者分離に強い</small></button>
      </div>
    </div>
    <div class="f"><label>この録音について</label><div class="inh"><span class="tag">2人</span><span class="tag">日本語</span><span class="tag">固有名詞 3 ＋ 共通 5</span></div></div>
    <div class="f"><label>この案だけの指示（任意）</label><textarea rows="2" placeholder="例: 店名と寺の名前は漢字で"></textarea></div>
    <div class="foot"><button class="btn line sm" data-close="veil-new">やめる</button><button class="btn sm" data-state="running" data-close="veil-new">作る</button></div>
  </div>
</div>

<!-- 採用の確認 -->
<div class="veil" id="veil-adopt">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="adopt-h">
    <h2 id="adopt-h">Deepgram の案を採用しますか？</h2>
    <p>今の正本（Gemini の案）は案として残ります。文字起こし修正・記事方針・記事本文は「前提変更」になり、「作り直す」で作り直せます。</p>
    <div class="foot"><button class="btn line sm" data-close="veil-adopt">やめる</button><button class="btn sm" data-state="adopted" data-close="veil-adopt">採用</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const IC = {
  plus: '<path d="M12 5v14M5 12h14"/>', down: '<path d="m6 9.5 6 6 6-6"/>', search: '<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/>',
  side: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/>', panel: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15"/>',
  more: '<circle cx="6" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="18" cy="12" r="1.2" fill="currentColor"/>',
  mic: '<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M6 11.5a6 6 0 0 0 12 0M12 17.5v3"/>',
  img: '<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/>',
  doc: '<path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4M10 12h5M10 15.5h5"/>',
  folder: '<path d="M3.5 7.5a2 2 0 0 1 2-2h4.2l2 2h6.8a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
  spark: '<path d="M12 4.5l1.6 4.4 4.4 1.6-4.4 1.6L12 16.5l-1.6-4.4L6 10.5l4.4-1.6z"/>',
  play: '<path d="M8 5.5v13l10-6.5z"/>', check: '<path d="m5.5 12.5 4 4 9-9"/>', up: '<path d="M12 19V6M6 12l6-6 6 6"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.5M12 18v2.5M3.5 12H6M18 12h2.5M6 6l1.8 1.8M16.2 16.2 18 18M6 18l1.8-1.8M16.2 7.8 18 6"/>',
  edit: '<path d="M4.5 19.5h4l10-10a2.8 2.8 0 0 0-4-4l-10 10z"/><path d="m13 7 4 4M4.5 19.5l1-4"/>',
  warn: '<path d="M12 4 2.5 20h19z"/><path d="M12 10v4.5M12 17h.01"/>',
  cols: '<rect x="3.5" y="4.5" width="7" height="15" rx="2"/><rect x="13.5" y="4.5" width="7" height="15" rx="2"/>',
};
const svg = (n, cls = "ico") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const LOGO = `<svg class="logo" viewBox="0 0 256 256" aria-hidden="true"><rect width="256" height="256" fill="#F3F0E8"/><g transform="translate(128 128) scale(2.05) translate(-50 -50)"><path fill="#A6D2DE" d="M22 14 C34 11 46 12 58 11 L79 31 C80 48 81 68 79 87 C60 90 40 88 21 89 C19 66 20 40 22 14 Z"/><path fill="#DCEDF2" d="M58 11 C59 18 58 25 59 31 C66 31 73 31 79 31 Z"/><path fill="#4B5F73" d="M31 42 C38 40 48 40 56 41 C58 43 58 46 56 48 C48 49 38 49 31 48 C29 46 29 44 31 42 Z"/><path fill="#4B5F73" d="M31 56 C36 54 42 54 46 55 C48 57 48 60 46 62 C42 63 36 63 31 62 C29 60 29 58 31 56 Z"/><g transform="translate(78 34.2) rotate(36.4)"><path fill="#EE9B7E" d="M-5.6 -1 C-5.2 -5.4 5.4 -6 6.2 -1.4 C6.6 10 5.6 24 6.4 36 C6.6 41 5.9 45 5.2 47.5 C2 48.6 -2 48.4 -5.4 47.4 C-6.2 44 -5.8 38 -6.4 30 C-6.8 20 -5.4 10 -5.6 -1 Z"/><path fill="#FAF0D6" d="M-4.2 -3.4 C-2.6 -6.6 3.2 -6.4 4.8 -3 C5.4 -0.4 3 2.6 -0.4 2.4 C-3.4 2.2 -5.2 -0.6 -4.2 -3.4 Z"/><path fill="#4B5F73" d="M-5.2 46.4 C-3.6 45 -0.8 45.8 1.6 45.6 C3.4 45.4 4.6 46.2 5.1 47.2 C4.4 48.9 4.9 50.7 3.9 52.3 C3.3 53.6 2.6 54.8 0.8 55.4 C-1 55.8 -2.8 54.9 -3.6 53.6 C-4.1 52.6 -4 51.3 -4.7 50 C-5.3 48.9 -5.6 47.7 -5.2 46.4 Z"/></g></g></svg>`;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
$("#brand").innerHTML = `${LOGO}<span>Editor</span>`;
$$("[data-ic]").forEach((el) => (el.outerHTML = svg(el.dataset.ic)));
$("#ctx-page").innerHTML = `${svg("doc")}このページ`;
$("#ctx-rec").innerHTML = `${svg("mic")}この録音について`;
$("#ctx-folder").innerHTML = `${svg("folder")}鎌倉の朝の散歩 の 2 ページ`;

/* ===== 案（合成データ）。2 案の違いは表記と段落の切り方だけ ===== */
const CANDS = {
  c1: { id: "c1", engine: "Gemini", at: "11/3 20:14", dur: "42 分", tx: [
    ["Mika", "00:12", "北鎌倉の駅を降りると、朝の空気がもう違いますね。"],
    ["佐藤", "00:21", "ええ。店を開ける前にこの道を歩くのが、もう二十年の習慣で。円覚寺の総門のあたりは、季節で匂いが変わるんです。"],
    ["Mika", "01:04", "匂い、ですか。"],
    ["佐藤", "01:06", "春は土と梅、秋は金木犀。観光の方が来る前の一時間だけ、町が自分のものになる。"],
    ["Mika", "02:40", "明月院の方へも行かれますか。"],
    ["佐藤", "02:43", "行きます。紫陽花の季節は避けますけど。"],
  ] },
  c2: { id: "c2", engine: "Deepgram", at: "今日 15:02", dur: "42 分", tx: [
    ["Mika", "00:11", "北鎌倉の駅を降りると、朝の空気がもう違いますね。"],
    ["佐藤", "00:20", "ええ、店を開ける前にこの道を歩くのが、もう二十年の習慣で。"],
    ["佐藤", "00:38", "円覚寺の惣門のあたりは、季節で匂いが変わるんです。"],
    ["Mika", "01:04", "匂いですか。"],
    ["佐藤", "01:05", "春は土と梅、秋はキンモクセイ。観光の方が来る前の一時間だけ、町が自分のものになる。"],
    ["Mika", "02:39", "明月院のほうへも行かれますか。"],
    ["佐藤", "02:42", "行きます。あじさいの季節は避けますけど。"],
  ] },
};
const STEPS = ["文字起こし修正", "記事方針", "記事本文"];
/* 状態: view = single|compare、viewing = 見ている案、adopted = 採用中の案、ready = 案 2 ができているか、running = 案 2 を作成中 */
let S = { view: "single", viewing: "c1", adopted: "c1", ready: false, running: false, cmpShow: "c1" };
const isStale = () => S.adopted === "c2";

const txHtml = (c) => `<div class="tx">${c.tx.map(([w, at, t]) => `<p><span class="m"><b>${w}</b><small>${at}</small></span>${t}</p>`).join("")}</div>`;

function bandHtml() {
  const stale = isStale();
  const li = STEPS.map((name) => `<li class="${stale ? "stale" : "done"}"><button data-toast="${name} のページ（モック）">${stale ? svg("warn") : svg("check")}${name}</button></li>`).join("");
  return `<div class="band"><span class="bn">記事制作</span><ol class="steps">${li}</ol>${stale ? `<button class="btn sm" data-toast="文字起こし修正から作り直します（モック）">作り直す</button><span class="note">元の文字起こしが変わりました。</span>` : `<button class="btn quiet sm" data-toast="作り直す（モック）">作り直す</button>`}</div>`;
}

function candChip(c, on) {
  const adopted = S.adopted === c.id;
  return `<button class="cand${on ? " on" : ""}" data-cand="${c.id}" aria-pressed="${on}">${c.engine}${adopted ? `<span class="tag ok">${svg("check")}採用中</span>` : ""}</button>`;
}

function transcriptHtml() {
  const viewing = S.viewing;
  const chips = [candChip(CANDS.c1, S.view !== "compare" && viewing === "c1")];
  if (S.running) chips.push(`<span class="cand" aria-live="polite"><i class="spin"></i>Deepgram<span class="tag">作成中…</span></span>`);
  else if (S.ready) chips.push(candChip(CANDS.c2, S.view !== "compare" && viewing === "c2"));
  chips.push(`<button class="cand add" data-open="new"${S.running ? " disabled" : ""}>${svg("plus")}別の案</button>`);
  if (S.ready && !S.running) chips.push(`<button class="btn quiet sm cmpbtn" data-cmp="${S.view === "compare" ? "off" : "on"}">${svg("cols")}${S.view === "compare" ? "1 案ずつ" : "比べる"}</button>`);
  let body = "";
  if (S.view === "compare") {
    const col = (c) => {
      const adopted = S.adopted === c.id;
      return `<section class="col${S.cmpShow !== c.id ? " hide" : ""}" aria-label="${c.engine} の案"><h3>${c.engine}<small>${c.at}</small>${adopted ? `<span class="tag ok">${svg("check")}採用中</span>` : `<button class="btn sm" data-open="adopt">この案を採用</button>`}</h3>${txHtml(c)}</section>`;
    };
    body = `<div class="seg cmpsw" role="group" aria-label="見る案"><button class="${S.cmpShow === "c1" ? "on" : ""}" data-show="c1">Gemini</button><button class="${S.cmpShow === "c2" ? "on" : ""}" data-show="c2">Deepgram</button></div><div class="cmp">${col(CANDS.c1)}${col(CANDS.c2)}</div>`;
  } else {
    const c = CANDS[viewing];
    const adopted = S.adopted === c.id;
    body = adopted
      ? `<div class="meta"><span class="tag ok">${svg("check")}採用中</span><span>${c.engine} · ${c.at} · ${c.dur}</span></div>${txHtml(c)}`
      : `<div class="candbar"><b>${c.engine} の案</b><span>${c.at} · ${c.dur}</span><button class="btn quiet sm" data-cmp="on">${svg("cols")}${CANDS[S.adopted].engine} と比べる</button><button class="btn sm" data-open="adopt">この案を採用</button></div>${txHtml(c)}`;
  }
  return `<div class="txhd"><h2>文字起こし</h2><button class="btn quiet sm" data-toast="話者の名前（モック）">話者の名前</button><button class="btn quiet sm" data-toast="タイムスタンプの表示（モック）">時刻</button></div><div class="cands">${chips.join("")}</div>${body}`;
}

function render() {
  $("#canvas").innerHTML = `<h1 class="tt" contenteditable="true" spellcheck="false">取材 11/3 北鎌倉</h1>${bandHtml()}
  <div class="recblk"><button class="play" aria-label="再生" data-toast="再生（モック）">${svg("play")}</button><div class="wave" aria-hidden="true"></div><span class="time">00:00 / 42:10</span><span class="tag">2 ファイル</span></div>
  <section class="recinfo" aria-label="この録音について"><button class="ri-hd" aria-expanded="false" data-toast="この録音について（editor-folders-v1 のまま）">${svg("mic")}<b>この録音について</b><span class="sum">2人 · 日本語 · 登場人物 2 · 固有名詞 3 · 背景あり</span>${svg("down", "ico chev")}</button></section>
  ${transcriptHtml()}`;
  renderList();
}

function renderList() {
  const stale = isStale();
  const rows = [
    ["f1", "folder", 0, "鎌倉の朝の散歩", "", ""],
    ["r1", "rec", 1, "取材 11/3 北鎌倉", "2日前", S.running ? '<i class="spin"></i> 文字起こし 作成中…' : "録音 · 文字起こし済み"],
    ...STEPS.map((n, i) => [`s${i + 1}`, "step", 2, n, "2日前", stale ? "前提変更" : ""]),
    ["d1", "note", 1, "散歩コースのメモ", "3日前", ""],
    ["d2", "note", 1, "円覚寺の資料", "3日前", ""],
    ["f2", "folder", 0, "コラム執筆", "", ""],
    ["w1", "note", 1, "冬の鎌倉、海辺の朝", "昨日", ""],
    ["p2", "note", 0, "鎌倉大好き", "昨日", ""],
  ];
  $("#list").innerHTML = rows.map(([id, kind, d, t, when, sub]) => `<li class="row ${kind}${id === "r1" ? " on" : ""}" style="--d:${d}" tabindex="0">
    ${kind === "folder" ? `<span class="tw">${svg("down")}</span>${svg("folder", "ico ki")}` : kind === "rec" ? svg("mic", "ico ki") : kind === "step" ? svg("spark", "ico ki") : ""}
    <b>${t}</b><span class="when">${when}</span>${sub ? `<span class="sub${sub === "前提変更" ? " stale" : ""}">${sub}</span>` : ""}</li>`).join("");
}

/* ===== 状態の切替 ===== */
const STATES = {
  one: () => { S = { view: "single", viewing: "c1", adopted: "c1", ready: false, running: false, cmpShow: "c1" }; },
  new: () => { STATES.one(); setTimeout(() => $("#veil-new").classList.add("open"), 0); },
  running: () => { S = { view: "single", viewing: "c1", adopted: "c1", ready: false, running: true, cmpShow: "c1" }; },
  two: () => { S = { view: "single", viewing: "c2", adopted: "c1", ready: true, running: false, cmpShow: "c2" }; },
  compare: () => { S = { view: "compare", viewing: "c2", adopted: "c1", ready: true, running: false, cmpShow: "c2" }; },
  adopt: () => { STATES.two(); setTimeout(() => $("#veil-adopt").classList.add("open"), 0); },
  adopted: () => { S = { view: "single", viewing: "c2", adopted: "c2", ready: true, running: false, cmpShow: "c2" }; },
};
function go(name) {
  $$(".veil.open").forEach((v) => v.classList.remove("open"));
  (STATES[name] || STATES.one)();
  render();
  $$("#sw button").forEach((b) => b.classList.toggle("on", b.dataset.state === name));
  if (name === "adopted") toast("Deepgram の案を採用しました。工程は前提変更になりました");
  if (name === "running") toast("Deepgram で文字起こしを始めました（モック）");
}
document.addEventListener("click", (e) => {
  const st = e.target.closest("[data-state]");
  if (st) { go(st.dataset.state); return; }
  const c = e.target.closest("[data-cand]");
  if (c) { S.view = "single"; S.viewing = c.dataset.cand; render(); return; }
  const cmp = e.target.closest("[data-cmp]");
  if (cmp) { S.view = cmp.dataset.cmp === "on" ? "compare" : "single"; render(); return; }
  const show = e.target.closest("[data-show]");
  if (show) { S.cmpShow = show.dataset.show; render(); return; }
  const o = e.target.closest("[data-open]");
  if (o) { $("#veil-" + o.dataset.open).classList.add("open"); return; }
  const cl = e.target.closest("[data-close]");
  if (cl) $("#" + cl.dataset.close).classList.remove("open");
  const opt = e.target.closest(".opt");
  if (opt) { $$(".opt", opt.parentElement).forEach((x) => { x.classList.toggle("on", x === opt); x.setAttribute("aria-checked", String(x === opt)); }); return; }
  const t = e.target.closest("[data-toast]");
  if (t) { e.preventDefault(); toast(t.dataset.toast); }
});
$$(".veil").forEach((v) => v.addEventListener("click", (e) => { if (e.target === v) v.classList.remove("open"); }));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $$(".veil.open").forEach((v) => v.classList.remove("open")); });
let tt;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2200); }

const q = new URLSearchParams(location.search);
go(q.get("state") || "one");
</script>
</body>
</html>
