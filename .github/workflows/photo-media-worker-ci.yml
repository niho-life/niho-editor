name: Photo media worker CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 使い捨ての service container の合成の値（秘密ではない）。
env:
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGUSER: editor_ci
  PGPASSWORD: editor-ci-disposable
  PGDATABASE: editor_ci

jobs:
  photo-media-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: editor_ci
          POSTGRES_PASSWORD: editor-ci-disposable
          POSTGRES_DB: editor_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U editor_ci -d editor_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            workers/photo-media/package-lock.json
            packages/editor-store/package-lock.json
      - name: Point the tests at the service database
        run: echo "TEST_DATABASE_URL=postgres://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}" >> "$GITHUB_ENV"
      - run: npm -C packages/editor-store ci --ignore-scripts --no-audit --no-fund
      - run: npm -C workers/photo-media ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, synthetic orchestration and P02 PostgreSQL adapter tests
        run: |
          test -n "$TEST_DATABASE_URL"
          npm -C workers/photo-media run check
