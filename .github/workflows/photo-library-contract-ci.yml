name: Photo library contract CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photo-library-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/photo-library-contract/package-lock.json
      - run: npm -C packages/photo-library-contract ci --ignore-scripts --no-audit --no-fund
      - run: npm -C packages/photo-library-contract run check
      - run: node scripts/ci/public-boundary-guard.mjs
