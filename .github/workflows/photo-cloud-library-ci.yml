name: Photo cloud library CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photo-cloud-library:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/photo-cloud-library/package-lock.json
      - run: npm -C packages/photo-cloud-library ci --ignore-scripts --no-audit --no-fund
      - run: npm -C packages/photo-cloud-library run check
