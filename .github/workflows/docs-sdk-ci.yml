name: Docs SDK CI

on:
  pull_request:
  # merge queue の検証。checkout と concurrency は `github.sha` へ fallback するので、merge_group のコミットを使う
  merge_group:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs-sdk-*.yml"
      - "sdk/**"
      - "scripts/sdk/**"
      - "packages/docs-core/**"
      - "packages/docs-ui/**"
      - "packages/ui/**"
      - "apps/docs/package.json"
      - "apps/docs/package-lock.json"
      - "docs/architecture/docs-sdk.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  pack-and-smoke:
    name: docs-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm -C apps/docs ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/sdk/release-set.test.mjs
      - name: Pack, verify, and smoke selected source
        run: |
          set -euo pipefail
          version="$(node -p "require('./sdk/release-set.json').version")"
          manifest="$RUNNER_TEMP/docs-sdk/niho-docs-sdk-$version-$SOURCE_SHA.json"
          node scripts/sdk/pack-release-set.mjs --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/docs-sdk"
          node scripts/sdk/pack-release-set.mjs --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/docs-sdk-reproduced"
          node scripts/sdk/verify-release-set.mjs --manifest "$manifest" --reproduced-manifest "$RUNNER_TEMP/docs-sdk-reproduced/niho-docs-sdk-$version-$SOURCE_SHA.json" --expected-source "$SOURCE_SHA" --expected-version "$version" --source-repository "$GITHUB_WORKSPACE"
          node scripts/sdk/smoke-consumer.mjs --manifest "$manifest"
