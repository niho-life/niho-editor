name: editor-web CI

# editor.niho.life の Web と、その正本（packages/editor-store）。secret なし・合成データ・GitHub-hosted runner。
# 3 つの job は main の必須チェック（docs/architecture/editor-release-boundary.md §3）。必須チェックは workflow ごと走らないと
# pending のまま queue に入れないので、PR では paths で止めず、`changes` job の結果を jobs の `if` で見て skip する（skip は成功と数える）。
on:
  pull_request:
  # merge queue が「PR + 先に並んだ変更 + 最新の main」を検証するときに必須チェックを報告する
  merge_group:
  push:
    branches: [main]
    paths:
      - ".github/workflows/editor-web-ci.yml"
      - "scripts/editor-deploy/**"
      - "apps/editor-web/**"
      - "packages/editor-store/**"
      - "packages/docs-ui/**"
      - "packages/docs-core/**"
      - "packages/ui/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 使い捨ての service container の合成の値（秘密ではない）。接続 URL はシェルで組み立てる。
env:
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGUSER: editor_ci
  PGPASSWORD: editor-ci-disposable
  PGDATABASE: editor_ci

jobs:
  # Web が見るもの（apps/editor-web・配備の道具・packages/ の共有コード・このワークフロー自身）に触れていない変更では、
  # 3 つの job を走らせない。見分けられないとき・main への push では走らせる。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      editor: ${{ steps.filter.outputs.editor }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          # image は packages/ を丸ごと COPY する（apps/editor-web/Dockerfile）ので、packages/ のどこを変えても Web の検査に入れる
          editor_paths='^(apps/editor-web/|packages/|scripts/editor-deploy/|\.github/workflows/editor-web-ci\.yml$)'
          result=true
          base=""
          case "$EVENT" in
            # チェックアウトは PR と base の merge commit。第一親が base
            pull_request) base=$(git rev-parse --verify -q HEAD^1) || base="" ;;
            # チェックアウトは queue の先頭（PR + 先に並んだ変更）。main は base_sha
            merge_group) git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE" && base="$MERGE_GROUP_BASE" || base="" ;;
          esac
          # --no-renames: 改名は移動先だけが出るので、見るディレクトリの外へ移したとき（移動元が消えたとき）を見落とす
          if [ -n "$base" ] && files=$(git diff --name-only --no-renames "$base" HEAD); then
            echo "changed files:"; printf '%s\n' "$files" | sed 's/^/  /'
            if ! printf '%s\n' "$files" | grep -Eq "$editor_paths"; then result=false; fi
          else
            echo "cannot tell what changed (event: $EVENT); running the editor jobs"
          fi
          echo "editor=$result" | tee -a "$GITHUB_OUTPUT"

  editor-store:
    needs: changes
    if: needs.changes.outputs.editor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: editor_ci
          POSTGRES_PASSWORD: editor-ci-disposable
          POSTGRES_DB: editor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U editor_ci -d editor_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/editor-store/package-lock.json
      - name: Point the tests at the service database
        run: echo "TEST_DATABASE_URL=postgres://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}" >> "$GITHUB_ENV"
      - run: npm -C packages/editor-store ci --no-audit --no-fund
      - run: npm -C packages/editor-store run typecheck
      - name: Test (schema + PostgreSQL integration)
        run: |
          test -n "$TEST_DATABASE_URL"
          npm -C packages/editor-store test

  editor-web:
    needs: changes
    if: needs.changes.outputs.editor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: editor_ci
          POSTGRES_PASSWORD: editor-ci-disposable
          POSTGRES_DB: editor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U editor_ci -d editor_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/editor-web/package-lock.json
            packages/editor-store/package-lock.json
      - name: Point the app (and its PostgreSQL tests) at the service database
        run: |
          echo "DATABASE_URL=postgres://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgres://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}" >> "$GITHUB_ENV"
      - run: npm -C apps/editor-web ci --no-audit --no-fund
      - run: npm -C packages/editor-store ci --no-audit --no-fund
      - name: Apply migrations to the empty database
        run: npm -C packages/editor-store run migrate
      - run: npm -C apps/editor-web run typecheck
      - run: npm -C apps/editor-web run lint
      - run: npm -C apps/editor-web test
      - name: Verify immutable Photo SDK runtime staging
        run: npm -C apps/editor-web run test:photo-runtime
      - name: Build (NODE_ENV=production, no EDITOR_AUTH_MODE)
        run: npm -C apps/editor-web run build
      - name: Production start guard (stub and unset refuse to start)
        run: npm -C apps/editor-web run test:startup
      - name: Create, write, reload (EDITOR_AUTH_MODE=stub, next dev)
        run: npm -C apps/editor-web run test:e2e

  # 配備の道具（docs/ops/editor-deploy.md）。本番には触れない: 構文・Secret と env の組み立て・image の build だけを確かめる。
  editor-deploy:
    needs: changes
    if: needs.changes.outputs.editor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x scripts/editor-deploy/lib.sh scripts/editor-deploy/gcp-bootstrap.sh scripts/editor-deploy/deploy.sh scripts/editor-deploy/set-ai-key.sh scripts/editor-deploy/set-transcribe-key.sh scripts/editor-deploy/set-google-oauth-secret.sh scripts/editor-deploy/steps-infra.sh scripts/editor-deploy/transcribe-infra.sh scripts/editor-deploy/lib-test.sh scripts/editor-deploy/steps-infra.test.sh scripts/editor-deploy/transcribe-infra.test.sh scripts/editor-deploy/dockerfile-test.sh
      - name: The example env file sets every variable the scripts require
        run: |
          set -euo pipefail
          cp scripts/editor-deploy/deploy.env.example "$RUNNER_TEMP/deploy.env"
          DEPLOY_ENV="$RUNNER_TEMP/deploy.env" bash -c 'source scripts/editor-deploy/lib.sh && load_deploy_env && test "$DB_NAME" = niho_editor'
      - name: The steps infrastructure script builds the expected gcloud calls (fake gcloud, nothing reaches GCP)
        run: scripts/editor-deploy/steps-infra.test.sh
      - name: The transcription infrastructure script and the request timeout (fake gcloud, nothing reaches GCP)
        run: scripts/editor-deploy/transcribe-infra.test.sh
      - name: The service's secrets and env with and without the AI key (gcloud is stubbed)
        run: bash scripts/editor-deploy/lib-test.sh
      - name: "Every file: dependency of apps/editor-web is copied into the image before npm ci"
        run: scripts/editor-deploy/dockerfile-test.sh
      - name: Build the migrate image
        run: DOCKER_BUILDKIT=1 docker build -f scripts/editor-deploy/Dockerfile.migrate -t editor-migrate-ci .
      # 画面の image も build する。ここを見ていなかったため、editor-publish と editor-publish-contract が増えた
      # とき（#64・#93）に Dockerfile の COPY が追いつかず、本番の image が数週間 build できない状態に気づけなかった。
      - name: Build the web image (the deploy builds this one; keep it buildable)
        run: DOCKER_BUILDKIT=1 docker build -f apps/editor-web/Dockerfile -t editor-web-ci .
