name: Editor unsigned Mac candidate

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "mainに含まれる製品sourceの40桁SHA"
        required: true
        type: string
      version:
        description: "配布先が採番した候補の版（X.Y.Z）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: editor-mac-candidate-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test candidate DATA protocol with synthetic inputs
        run: python3 -m unittest discover -s scripts/editor-candidate -p '*_test.py'
      - name: Check the build wrapper
        run: shellcheck scripts/editor-candidate/*.sh

  plan:
    needs: tests
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'niho-life/niho-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.plan.outputs.source-sha }}
      version: ${{ steps.plan.outputs.version }}
      release-tag: ${{ steps.plan.outputs.release-tag }}
      run-attempt: ${{ steps.plan.outputs.run-attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require owner-provided public client configuration
        env:
          CLIENT_CONFIG: ${{ secrets.NIHO_DESKTOP_FIREBASE_API_KEY_PROD }}
        run: |
          if [ -z "$CLIENT_CONFIG" ] || [ "$CLIENT_CONFIG" = ci-not-for-login ]; then
            echo '::error::Owner must configure the public client configuration variable before creating a distribution candidate.'
            exit 1
          fi
      - name: Plan the immutable source and version
        id: plan
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/editor-candidate/candidate.py plan \
            --repository "$GITHUB_WORKSPACE" --source-sha "$SOURCE_SHA" \
            --controller-sha "$GITHUB_SHA" --version "$VERSION" \
            --github-output "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      run-attempt: ${{ needs.plan.outputs.run-attempt }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: sha256:${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout the reviewed controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Require a complete workflow attempt
        env:
          PRODUCER_ATTEMPT: ${{ needs.plan.outputs.run-attempt }}
        run: bash control/scripts/editor-candidate/require-attempt.sh "$PRODUCER_ATTEMPT" "$GITHUB_RUN_ATTEMPT"
      - name: Checkout the selected product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          path: product
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Setup fixed Rust and inspect Xcode
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          xcodebuild -version
          swift --version
      - name: Build the unsigned editor candidate once
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          NIHO_ACCOUNT_ENV: prod
          NIHO_FIREBASE_API_KEY: ${{ secrets.NIHO_DESKTOP_FIREBASE_API_KEY_PROD }}
        run: |
          bash control/scripts/editor-candidate/build.sh \
            "$GITHUB_WORKSPACE/product" "$RUNNER_TEMP/editor-candidate-raw" \
            "$VERSION" "$SOURCE_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Preserve the exact unsigned bytes
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: editor-candidate-raw-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/editor-candidate-raw/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  verify_mac:
    needs: [plan, build]
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      run-attempt: ${{ needs.build.outputs.run-attempt }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: sha256:${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout the reviewed DATA verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Require a complete workflow attempt
        env:
          PRODUCER_ATTEMPT: ${{ needs.build.outputs.run-attempt }}
        run: bash control/scripts/editor-candidate/require-attempt.sh "$PRODUCER_ATTEMPT" "$GITHUB_RUN_ATTEMPT"
      - name: Checkout the selected source for contract comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          path: product
          persist-credentials: false
      - name: Download the exact build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/editor-candidate-raw
          merge-multiple: true
      - name: Verify the candidate as DATA on a fresh Mac
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python3 control/scripts/editor-candidate/candidate.py verify \
            --directory "$RUNNER_TEMP/editor-candidate-raw" --output "$RUNNER_TEMP/editor-candidate" \
            --source-repository "$GITHUB_WORKSPACE/product" --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --controller-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve the verified bytes and receipt
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: editor-candidate-verified-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/editor-candidate/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    needs: [plan, verify_mac]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'niho-life/niho-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require a complete workflow attempt
        env:
          PRODUCER_ATTEMPT: ${{ needs.verify_mac.outputs.run-attempt }}
        run: bash scripts/editor-candidate/require-attempt.sh "$PRODUCER_ATTEMPT" "$GITHUB_RUN_ATTEMPT"
      - name: Download the exact verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.verify_mac.outputs.artifact-id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/editor-candidate
          merge-multiple: true
      - name: Recheck manifest, receipt and file hashes without execution
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python3 scripts/editor-candidate/candidate.py validate \
            --directory "$RUNNER_TEMP/editor-candidate" --source-sha "$SOURCE_SHA" \
            --controller-sha "$GITHUB_SHA" --version "$VERSION" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Attest the immutable candidate manifest
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/editor-candidate/editor-candidate.json
      - name: Publish an unsigned prerelease for consumer adoption
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release-tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/editor-candidate/editor-candidate.sigstore.json"
          printf '%s\n' '署名前の配布候補です。公式updaterの配布ではありません。' > "$RUNNER_TEMP/editor-candidate-notes.txt"
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/editor-candidate/editor-candidate.dmg" \
            "$RUNNER_TEMP/editor-candidate/editor-candidate.app.tar.gz" \
            "$RUNNER_TEMP/editor-candidate/editor-candidate-mac.json" \
            "$RUNNER_TEMP/editor-candidate/editor-candidate.json" \
            "$RUNNER_TEMP/editor-candidate/editor-candidate.sigstore.json" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "NIHO editor unsigned candidate $VERSION" \
            --notes-file "$RUNNER_TEMP/editor-candidate-notes.txt"
