name: Docs SDK release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "origin/main の祖先である40桁commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.names.outputs.artifact-name }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest-file: ${{ steps.names.outputs.manifest-file }}
      source-sha: ${{ steps.source.outputs.source-sha }}
      version: ${{ steps.names.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: source
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          resolved="$(git rev-parse --verify "$REQUESTED_SOURCE^{commit}")"
          test "$resolved" = "$REQUESTED_SOURCE"
          git merge-base --is-ancestor "$REQUESTED_SOURCE" "$GITHUB_SHA"
          version="$(git show "$REQUESTED_SOURCE:sdk/release-set.json" | node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).version)')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          {
            echo "source-sha=$REQUESTED_SOURCE"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout immutable selected source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
        run: git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm -C apps/docs ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/sdk/release-set.test.mjs
      - env:
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
        run: node scripts/sdk/pack-release-set.mjs --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/docs-sdk"
      - id: names
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          manifest_file="niho-docs-sdk-$VERSION-$SOURCE_SHA.json"
          node scripts/sdk/verify-release-set.mjs --manifest "$RUNNER_TEMP/docs-sdk/$manifest_file" --expected-source "$SOURCE_SHA" --expected-version "$VERSION" --source-repository "$GITHUB_WORKSPACE"
          node scripts/sdk/smoke-consumer.mjs --manifest "$RUNNER_TEMP/docs-sdk/$manifest_file"
          artifact_name="niho-docs-sdk-$SOURCE_SHA-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          {
            echo "manifest-file=$manifest_file"
            echo "artifact-name=$artifact_name"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.names.outputs.artifact-name }}
          path: ${{ runner.temp }}/docs-sdk/*
          if-no-files-found: error
          retention-days: 7

  verify-source:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      manifest-file: ${{ steps.verify.outputs.manifest-file }}
      manifest-sha256: ${{ steps.verify.outputs.manifest-sha256 }}
      source-sha: ${{ steps.verify.outputs.source-sha }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm -C apps/docs ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/docs-sdk
          merge-multiple: true
      - name: Reproduce selected Git source with trusted workflow tooling and compare every entry
        id: verify
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          node scripts/sdk/pack-release-set.mjs --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/docs-sdk-reproduced"
          version="$(git show "$SOURCE_SHA:sdk/release-set.json" | node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).version)')"
          manifest_file="niho-docs-sdk-$version-$SOURCE_SHA.json"
          node scripts/sdk/verify-release-set.mjs --manifest "$RUNNER_TEMP/docs-sdk/$manifest_file" --reproduced-manifest "$RUNNER_TEMP/docs-sdk-reproduced/$manifest_file" --expected-source "$SOURCE_SHA" --expected-version "$version" --source-repository "$GITHUB_WORKSPACE"
          manifest_sha256="$(sha256sum "$RUNNER_TEMP/docs-sdk/$manifest_file" | cut -d' ' -f1)"
          {
            echo "manifest-file=$manifest_file"
            echo "manifest-sha256=$manifest_sha256"
            echo "source-sha=$SOURCE_SHA"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, verify-source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify artifact identity and transport digest
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          IFS=$'\t' read -r metadata_id metadata_name metadata_expired metadata_digest metadata_run_id < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '[.id, .name, .expired, .digest, .workflow_run.id] | @tsv'
          )
          test "$metadata_id" = "$ARTIFACT_ID"
          test "$metadata_name" = "$ARTIFACT_NAME"
          test "$metadata_expired" = "false"
          test "$metadata_digest" = "sha256:$ARTIFACT_DIGEST"
          test "$metadata_run_id" = "$GITHUB_RUN_ID"
      - name: Download exact artifact ID
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/docs-sdk
          merge-multiple: true
      - name: Verify downloaded data with trusted main verifier
        env:
          SOURCE_SHA: ${{ needs.verify-source.outputs.source-sha }}
          MANIFEST_FILE: ${{ needs.verify-source.outputs.manifest-file }}
          MANIFEST_SHA256: ${{ needs.verify-source.outputs.manifest-sha256 }}
          VERSION: ${{ needs.verify-source.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/sdk/verify-release-set.mjs --manifest "$RUNNER_TEMP/docs-sdk/$MANIFEST_FILE" --expected-manifest-sha256 "$MANIFEST_SHA256" --expected-source "$SOURCE_SHA" --expected-version "$VERSION" --source-repository "$GITHUB_WORKSPACE"
      - name: Create immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify-source.outputs.source-sha }}
          VERSION: ${{ needs.verify-source.outputs.version }}
        run: |
          set -euo pipefail
          tag="docs-sdk-v$VERSION"
          existing_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
          test -z "$existing_tag" || { echo "tag already exists: $tag" >&2; exit 1; }
          existing_release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\") | .id")"
          test -z "$existing_release" || { echo "release already exists: $tag" >&2; exit 1; }
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$SOURCE_SHA" >/dev/null
          prerelease_args=()
          if [[ "${VERSION%%+*}" == *-* ]]; then prerelease_args+=(--prerelease); fi
          gh release create "$tag" "$RUNNER_TEMP/docs-sdk/"* \
            --verify-tag \
            --latest=false \
            "${prerelease_args[@]}" \
            --title "NIHO docs SDK v$VERSION" \
            --notes "選択した commit $SOURCE_SHA から再現可能に生成・検証した NIHO docs SDK release set です。"
