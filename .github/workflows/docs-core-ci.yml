name: Client packages CI

on:
  pull_request:
  # merge queue が「PR + 先に並んだ変更 + 最新の main」を検証するときに必須チェックを報告する
  merge_group:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs-core-ci.yml"
      - "packages/docs-core/**"
      - "packages/docs-ui/**"
      - "packages/ui/**"
      - "packages/desktop-account/**"
      - "packages/desktop-vault/**"
      - "packages/desktop-bridge/**"
      - "packages/niho-cloud-contract/**"
      - "packages/editor-publish-contract/**"
      - "packages/editor-publish/**"
      - "docs/security/**"
      - "CONTRIBUTING.md"
      - "ASSET_LICENSE.md"
      - "TRADEMARKS.md"
      - "SECURITY.md"
      - "LICENSE"
      - "scripts/ci/public-boundary-guard.mjs"
      - "scripts/ci/public-boundary-guard.test.mjs"
      - "apps/docs/fixtures/flow-shape/**"
      - "apps/docs/fixtures/turn-events/**"
      - "apps/docs/**"
      - "packages/apple-speech/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS のランナーは同時に動かせる数が少なく（無料の枠）、待ちが長い。mac のジョブ（Rust・Swift）が見るものに
  # 触れていない変更では走らせない。見分けられないとき・main への push では走らせる。
  # `docs-mac-native` は必須チェックなので、skip しても成功として数えられる（jobs の `if` による skip）。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mac-native: ${{ steps.filter.outputs.mac-native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          # docs-mac-native が見るもの: apps/docs（Cargo・swift・remote-runner）、それが path で使う packages の
          # Rust・Swift（desktop-account・desktop-vault・apple-speech）、このワークフロー自身。
          mac_paths='^(apps/docs/|packages/apple-speech/|packages/desktop-account/|packages/desktop-vault/|\.github/workflows/docs-core-ci\.yml$)'
          result=true
          base=""
          case "$EVENT" in
            # チェックアウトは PR と base の merge commit。第一親が base
            pull_request) base=$(git rev-parse --verify -q HEAD^1) || base="" ;;
            # チェックアウトは queue の先頭（PR + 先に並んだ変更）。main は base_sha
            merge_group) git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE" && base="$MERGE_GROUP_BASE" || base="" ;;
          esac
          # --no-renames: 改名は移動先だけが出るので、見るディレクトリの外へ移したとき（移動元が消えたとき）を見落とす
          if [ -n "$base" ] && files=$(git diff --name-only --no-renames "$base" HEAD); then
            echo "changed files:"; printf '%s\n' "$files" | sed 's/^/  /'
            if ! printf '%s\n' "$files" | grep -Eq "$mac_paths"; then result=false; fi
          else
            echo "cannot tell what changed (event: $EVENT); running the macOS job"
          fi
          echo "mac-native=$result" | tee -a "$GITHUB_OUTPUT"

  docs-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/docs-core/package-lock.json
      - run: npm -C packages/docs-core ci
      - run: npm -C packages/docs-core run check

  editor-publish-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/editor-publish-contract/package-lock.json
      - run: npm -C packages/editor-publish-contract ci
      - run: npm -C packages/editor-publish-contract run check

  editor-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/editor-publish/package-lock.json
      - run: npm -C packages/editor-publish ci
      - run: npm -C packages/editor-publish run check

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json
      - run: npm -C packages/ui ci
      - run: npm -C packages/ui run typecheck
      - run: npm -C packages/ui run lint
      - run: npm -C packages/ui test

  docs-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/docs-ui/package-lock.json
      - run: npm -C packages/docs-ui ci
      - run: npm -C packages/docs-ui run typecheck
      # gallery は src の外（独自の tsconfig）なので、別に型検査する。
      - run: npm -C packages/docs-ui run typecheck:gallery
      - run: npm -C packages/docs-ui run lint
      - run: npm -C packages/docs-ui test

  # 実ブラウザ（chromium）で gallery を開き、横スクロールと axe（serious 以上）を検査する（Issue #43）。
  # 許容リスト（packages/docs-ui/e2e/known-violations.json）と一致しないと落ちる。手順は packages/docs-ui/README.md。
  docs-ui-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/docs-ui/package-lock.json
      - run: npm -C packages/docs-ui ci
      - run: npm -C packages/docs-ui run typecheck:browser
      - run: npm -C packages/docs-ui exec -- playwright install --with-deps chromium
      - run: npm -C packages/docs-ui run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-ui-playwright-report
          path: packages/docs-ui/node_modules/.cache/niho-docs-ui-e2e/playwright-report
          include-hidden-files: true
          retention-days: 7

  desktop-account:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path packages/desktop-account/Cargo.toml --check
      - run: cargo test --manifest-path packages/desktop-account/Cargo.toml --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/desktop-account/ts/package-lock.json
      - run: npm -C packages/desktop-account/ts ci
      - run: npm -C packages/desktop-account/ts run typecheck
      - run: npm -C packages/desktop-account/ts run lint
      - run: npm -C packages/desktop-account/ts test

  desktop-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path packages/desktop-vault/Cargo.toml --check
      - run: cargo test --manifest-path packages/desktop-vault/Cargo.toml --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/docs-core/package-lock.json
      - run: npm -C packages/docs-core ci
      - run: packages/docs-core/node_modules/.bin/tsc -p packages/desktop-vault/tsconfig.json

  # 名前は mac だが ubuntu で動く（必須チェックの名前なので変えない）。macOS で動くのは下の docs-mac-native だけ。
  desktop-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/desktop-bridge/package-lock.json
      - run: npm -C packages/desktop-bridge ci
      - run: npm -C packages/desktop-bridge run typecheck
      - run: npm -C packages/desktop-bridge run lint
      - run: npm -C packages/desktop-bridge test

  docs-mac-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm -C apps/docs ci --no-audit --no-fund
      - run: npm -C apps/docs run typecheck
      - run: npm -C apps/docs test
      - run: npm -C apps/docs run build
      - run: node --test scripts/ci/public-boundary-guard.test.mjs
      - run: node scripts/ci/public-boundary-guard.mjs

  docs-mac-native:
    needs: changes
    # changes が落ちたときは見分けられないので走らせる（needs が落ちたままだと skip になり、skip は必須チェックでは成功になる）。
    # always() は workflow の cancel のあとにも走るので、!cancelled() にする。
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mac-native == 'true') }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      NIHO_ACCOUNT_ENV: prod
      NIHO_FIREBASE_API_KEY: ci-not-for-login
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path apps/docs/Cargo.toml --all --check
      - run: cargo check --manifest-path apps/docs/Cargo.toml --locked --workspace --all-targets
      - run: cargo test --manifest-path apps/docs/Cargo.toml --locked --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm -C apps/docs/remote-runner test
      - run: swift build -c release --package-path apps/docs/sidecar/niho-speech
      - run: node apps/docs/scripts/sidecar-lock.mjs check-binary --binary apps/docs/sidecar/niho-speech/.build/release/niho-speech
      - run: swift test --package-path apps/docs/sidecar/niho-speech
      - run: swift test --package-path packages/apple-speech
